<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAU/USD Pro Terminal | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; margin: 0; overflow-x: hidden; }
        
        .terminal-container { height: 100vh; display: flex; flex-direction: column; }
        .chart-wrapper { flex-grow: 1; min-height: 400px; border-bottom: 2px solid #1e222d; }
        
        .execution-panel { 
            background: #131722; 
            padding: 20px; 
            border-top: 1px solid #2d3343;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .input-box {
            background: #1e222d;
            border: 1px solid #363c4e;
            color: white;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            font-weight: bold;
        }

        .btn-buy { background: #22c55e; transition: 0.3s; }
        .btn-buy:hover { background: #16a34a; transform: translateY(-2px); }
        
        .btn-sell { background: #ef4444; transition: 0.3s; }
        .btn-sell:hover { background: #dc2626; transform: translateY(-2px); }

        .label-text { font-size: 10px; font-weight: 900; color: #848e9c; text-transform: uppercase; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="p-4 flex justify-between items-center bg-[#131722] border-b border-white/5">
            <div class="flex items-center gap-3">
                <span class="text-blue-500 font-black italic">XAU/USD</span>
                <span class="text-[10px] bg-white/5 px-2 py-1 rounded text-gray-400 font-bold uppercase">Gold Spot</span>
            </div>
            <div class="flex gap-4">
                <div class="text-right">
                    <p class="text-[9px] text-gray-500 font-bold uppercase">Server Time</p>
                    <p id="clock" class="text-xs font-mono">00:00:00</p>
                </div>
            </div>
        </div>

        <div class="chart-wrapper">
            <div id="tradingview_xau" style="height: 100%; width: 100%;"></div>
        </div>

        <div class="execution-panel">
            <div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 items-end">
                
                <div>
                    <label class="label-text">Lot Size (Volume)</label>
                    <select class="input-box">
                        <option>0.01 (Micro)</option>
                        <option selected>0.10 (Mini)</option>
                        <option>1.00 (Standard)</option>
                        <option>5.00 (Pro)</option>
                    </select>
                </div>

                <div>
                    <label class="label-text">Order Type</label>
                    <select class="input-box">
                        <option>Market Execution</option>
                        <option>Limit Order</option>
                        <option>Stop Order</option>
                    </select>
                </div>

                <a href="deposit.html" class="btn-sell text-center py-4 rounded-xl font-black text-sm uppercase tracking-widest shadow-lg shadow-red-900/20">
                    <i class="fas fa-arrow-down mr-2"></i> Sell / Short
                </a>

                <a href="deposit.html" class="btn-buy text-center py-4 rounded-xl font-black text-sm uppercase tracking-widest shadow-lg shadow-green-900/20">
                    <i class="fas fa-arrow-up mr-2"></i> Buy / Long
                </a>

            </div>
            
            <div class="max-w-6xl mx-auto mt-4 flex justify-between items-center opacity-50">
                <p class="text-[9px] font-bold uppercase tracking-widest">Margin Requirement: ₦25,000.00</p>
                <p class="text-[9px] font-bold uppercase tracking-widest">Spread: 0.12 Pips</p>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // Initialize TradingView Widget
        new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "5",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_xau",
            "studies": [
                "RSI@tv-basicstudies",
                "MASimple@tv-basicstudies"
            ]
        });

        // Live Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
