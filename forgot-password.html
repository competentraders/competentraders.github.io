<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Account Recovery | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: #06070a; 
            color: white; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .grid-bg {
            background-image: linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            position: fixed; inset: 0; pointer-events: none;
        }

        .vault-card {
            background: #0f1218;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 40px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            position: relative;
        }

        /* LARGE PROFESSIONAL INPUTS */
        .field-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 8px 20px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .field-container:focus-within {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        input {
            background: transparent !important;
            border: none !important;
            outline: none !important;
            color: white !important;
            width: 100%;
            height: 50px; /* Larger vertical space */
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input::placeholder { color: #475569; font-weight: 400; }

        .scan-line {
            position: absolute;
            width: 100%; height: 2px;
            background: #3b82f6;
            top: 0; left: 0;
            box-shadow: 0 0 15px #3b82f6;
            display: none;
            animation: scanMove 2.5s infinite linear;
        }

        @keyframes scanMove {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .btn-action {
            background: #3b82f6;
            color: white;
            padding: 22px;
            border-radius: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            transition: 0.3s;
            width: 100%;
        }

        .btn-action:hover { background: #2563eb; transform: translateY(-2px); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        #success-overlay {
            position: fixed; inset: 0; background: #06070a;
            z-index: 100; display: none; align-items: center; justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body class="p-6">
    <div class="grid-bg"></div>

    <div id="success-overlay">
        <div class="max-w-xs px-6">
            <div class="w-20 h-20 bg-green-500/10 rounded-full flex items-center justify-center border border-green-500/20 mx-auto mb-6">
                <i class="fas fa-paper-plane text-2xl text-green-500 animate-pulse"></i>
            </div>
            <h2 class="text-2xl font-black uppercase italic tracking-tighter">Request Verified</h2>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-[3px] mt-4 mb-8">Authentication link is being dispatched to your secure inbox.</p>
            
            <a id="finalMailBtn" href="#" class="btn-action block">Continue to Inbox</a>
        </div>
    </div>

    <main class="vault-card overflow-hidden">
        <div id="scanner" class="scan-line"></div>

        <div class="mb-10 text-center">
            <h1 class="text-3xl font-black uppercase italic tracking-tighter">Security <span class="text-blue-600">Portal</span></h1>
            <p class="text-[10px] text-gray-500 font-black uppercase tracking-[4px] mt-2">Authorized Account Recovery</p>
        </div>

        <div class="space-y-6">
            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Authentication Username</label>
                <div class="field-container">
                    <i class="fas fa-shield-alt text-blue-500"></i>
                    <input type="text" id="u_name" placeholder="Client Username">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Verified Email Address</label>
                <div class="field-container">
                    <i class="fas fa-envelope text-blue-500"></i>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Last Known Balance (Optional)</label>
                <div class="field-container">
                    <i class="fas fa-wallet text-blue-500"></i>
                    <input type="number" id="balance" placeholder="0.00">
                </div>
            </div>

            <button onclick="processSecurityScan()" id="submit-btn" class="btn-action mt-4">
                Verify Identity & Request Reset
            </button>
        </div>

        <div class="mt-10 pt-6 border-t border-white/5 flex items-center justify-center gap-4">
            <i class="fas fa-lock text-[10px] text-gray-600"></i>
            <span class="text-[9px] text-gray-600 font-bold uppercase tracking-widest">End-to-End Encryption Active</span>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.processSecurityScan = async () => {
            const btn = document.getElementById('submit-btn');
            const scanner = document.getElementById('scanner');
            const emailIn = document.getElementById('email').value.trim().toLowerCase();
            const userIn = document.getElementById('u_name').value.trim();
            const balIn = document.getElementById('balance').value;

            if(!emailIn || !userIn) {
                alert("CRITICAL: Authentication fields required.");
                return;
            }

            btn.innerText = "VERIFYING SYSTEM LOGS...";
            btn.disabled = true;
            scanner.style.display = "block";

            try {
                const q = query(collection(db, "users"), where("email", "==", emailIn));
                const snap = await getDocs(q);

                if (snap.empty) {
                    alert("IDENTITY ERROR: No account found matching this email.");
                    resetUI(); return;
                }

                let isMatch = false;
                snap.forEach(doc => {
                    const data = doc.data();
                    if(data.username === userIn) isMatch = true;
                });

                if(!isMatch) {
                    alert("SECURITY ALERT: Username/Email mismatch detected.");
                    resetUI(); return;
                }

                // SUCCESS STATE
                document.getElementById('success-overlay').style.display = 'flex';

                const recipient = "fraudteamcompetentraders@gmail.com";
                const subject = encodeURIComponent("URGENT: IDENTITY VERIFIED - RESET REQUIRED [" + userIn + "]");
                const body = encodeURIComponent(
                    "--- COMPETENTRADERS SECURITY REPORT ---\n" +
                    "Identity successfully cross-referenced in Database.\n\n" +
                    "USER DETAILS:\n" +
                    "- Account: " + userIn + "\n" +
                    "- Email: " + emailIn + "\n" +
                    "- Reported Assets: ₦" + (balIn || "N/A") + "\n\n" +
                    "ACTION: Identity confirmed. Client is awaiting Password Reset Link via Firebase console."
                );

                const mailLink = `mailto:${recipient}?subject=${subject}&body=${body}`;
                document.getElementById('finalMailBtn').href = mailLink;
                
                // Auto-trigger mailer
                setTimeout(() => { document.getElementById('finalMailBtn').click(); }, 3000);

            } catch (err) {
                alert("SYSTEM ERROR: Secure connection failed.");
                resetUI();
            }
        };

        function resetUI() {
            const btn = document.getElementById('submit-btn');
            document.getElementById('scanner').style.display = 'none';
            btn.innerText = "Verify Identity & Request Reset";
            btn.disabled = false;
        }
    </script>
</body>
</html>
,
