<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Identity Verification | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: #06070a; 
            color: white; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .grid-bg {
            background-image: radial-gradient(rgba(59, 130, 246, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            position: fixed; inset: 0; pointer-events: none;
        }

        .vault-card {
            background: #0f1218;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 40px;
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            position: relative;
            z-index: 10;
        }

        .field-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 10px 25px;
            transition: 0.4s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .field-container:focus-within {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.1);
        }

        input {
            background: transparent !important;
            border: none !important;
            outline: none !important;
            color: white !important;
            width: 100%;
            height: 60px;
            font-size: 16px;
            font-weight: 600;
        }

        .btn-action {
            background: #3b82f6;
            color: white;
            padding: 24px;
            border-radius: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            transition: 0.3s;
            width: 100%;
            margin-top: 20px;
        }

        /* CUSTOM NOTIFICATIONS (Replaces "This Page Says") */
        #status-overlay {
            position: fixed; inset: 0; background: rgba(6, 7, 10, 0.95);
            z-index: 1000; display: none; align-items: center; justify-content: center;
            text-align: center; backdrop-filter: blur(10px);
        }

        .status-box {
            max-width: 320px;
            padding: 40px;
            border-radius: 35px;
            background: #13171f;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .scan-line {
            position: absolute;
            width: 100%; height: 3px;
            background: #3b82f6;
            top: 0; left: 0;
            box-shadow: 0 0 20px #3b82f6;
            display: none;
            animation: scanMove 2s infinite linear;
        }

        @keyframes scanMove {
            0% { top: 0%; } 100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div id="status-overlay">
        <div class="status-box" id="status-content">
            </div>
    </div>

    <main class="vault-card overflow-hidden">
        <div id="scanner" class="scan-line"></div>

        <div class="mb-12 text-center">
            <div class="w-16 h-16 bg-blue-600/10 rounded-2xl flex items-center justify-center border border-blue-500/20 mx-auto mb-6">
                <i class="fas fa-shield-check text-2xl text-blue-500"></i>
            </div>
            <h1 class="text-3xl font-black uppercase italic tracking-tighter">Identity <span class="text-blue-600">Verification</span></h1>
            <p class="text-[10px] text-gray-500 font-black uppercase tracking-[4px] mt-2">Secure Recovery Protocol</p>
        </div>

        <div class="space-y-6">
            <div class="space-y-3">
                <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest ml-2">Registered Gmail Address</label>
                <div class="field-container">
                    <i class="fas fa-envelope text-blue-500"></i>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>
            </div>

            <button onclick="handleRecovery()" id="submit-btn" class="btn-action">
                Initialize Security Scan
            </button>
        </div>

        <p class="text-[9px] text-gray-600 font-bold uppercase tracking-[2px] text-center mt-12 opacity-50">
            Authorized Personnel Only • Competentraders Security
        </p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showSystemStatus(type, title, msg, btnText = "Close") {
            const overlay = document.getElementById('status-overlay');
            const content = document.getElementById('status-content');
            const icon = type === 'success' ? 'fa-paper-plane text-blue-500' : 'fa-exclamation-triangle text-red-500';
            
            content.innerHTML = `
                <i class="fas ${icon} text-4xl mb-6"></i>
                <h2 class="text-xl font-black uppercase italic">${title}</h2>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-4 mb-8 leading-relaxed">${msg}</p>
                <button onclick="location.reload()" class="w-full py-4 bg-white/5 rounded-xl font-black text-[10px] uppercase tracking-widest hover:bg-white/10 transition">${btnText}</button>
            `;
            overlay.style.display = 'flex';
        }

        window.handleRecovery = async () => {
            const btn = document.getElementById('submit-btn');
            const scanner = document.getElementById('scanner');
            const emailIn = document.getElementById('email').value.trim().toLowerCase();

            if(!emailIn) return;

            btn.innerText = "QUERYING SYSTEM...";
            btn.disabled = true;
            scanner.style.display = "block";

            try {
                const q = query(collection(db, "users"), where("email", "==", emailIn));
                const snap = await getDocs(q);

                if (snap.empty) {
                    showSystemStatus('error', 'Access Denied', 'The provided Gmail address is not recognized by our security nodes.', 'Retry Authentication');
                    return;
                }

                // If found, capture user data for the email
                let userData = {};
                snap.forEach(doc => { userData = doc.data(); });

                // SUCCESS STATE
                const recipient = "fraudteamcompetentraders@gmail.com";
                const subject = encodeURIComponent("RECOVERY_VERIFIED: " + (userData.username || "Client"));
                const body = encodeURIComponent(
                    "--- COMPETENTRADERS SECURITY CLEARANCE ---\n" +
                    "ID: " + (userData.uid || "N/A") + "\n" +
                    "USER: " + (userData.username || "N/A") + "\n" +
                    "EMAIL: " + emailIn + "\n\n" +
                    "The system has successfully verified this user's identity via Gmail cross-reference. Please manually dispatch a Reset Link from the Console."
                );

                showSystemStatus('success', 'Identity Verified', 'Credential packet generated. Redirecting to secure mailer...', 'Proceeding...');

                setTimeout(() => {
                    window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
                }, 3000);

            } catch (err) {
                console.error(err);
                showSystemStatus('error', 'Link Failure', 'The secure handshake was interrupted. Please check your network.', 'Reconnect');
            }
        };
    </script>
</body>
</html>
