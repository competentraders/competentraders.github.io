<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizing Activation | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #06070a; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    </style>
</head>
<body>

    <div id="status-box" class="text-center p-8 bg-[#0f1218] border border-white/5 rounded-[2rem] max-w-sm w-full mx-4">
        <div id="loader" class="mb-6">
            <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500"></i>
        </div>
        <h2 id="status-title" class="text-xl font-black uppercase mb-2">Verifying Link...</h2>
        <p id="status-text" class="text-gray-500 text-xs uppercase font-bold tracking-widest">Securing your node connection</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, isSignInWithEmailLink, signInWithEmailLink } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function completeRegistration() {
            if (isSignInWithEmailLink(auth, window.location.href)) {
                let email = window.localStorage.getItem('emailForSignIn');
                
                // If the user opened the link on a different device, ask for email again
                if (!email) {
                    email = window.prompt('Please provide your email for confirmation');
                }

                try {
                    const result = await signInWithEmailLink(auth, email, window.location.href);
                    
                    // Link is valid! Now save the rest of the user's data to Firestore
                    const user = result.user;
                    const draftData = {
                        firstName: window.localStorage.getItem('draft_firstName'),
                        lastName: window.localStorage.getItem('draft_lastName'),
                        username: window.localStorage.getItem('draft_username'),
                        email: email,
                        uid: user.uid,
                        balance: 0,
                        joinedDate: new Date().toISOString()
                    };

                    await setDoc(doc(db, "users", user.uid), draftData);

                    // Success UI
                    document.getElementById('status-title').innerText = "Access Granted";
                    document.getElementById('status-text').innerText = "Identity Confirmed. Redirecting...";
                    document.getElementById('loader').innerHTML = '<i class="fas fa-check-circle text-5xl text-green-500"></i>';
                    
                    // Clear local storage
                    window.localStorage.clear();
                    
                    // Send to Dashboard after 2 seconds
                    setTimeout(() => { window.location.href = 'user-dashboard.html'; }, 2000);

                } catch (error) {
                    document.getElementById('status-title').innerText = "Link Expired";
                    document.getElementById('status-text').innerText = "Security token invalid. Please restart.";
                    document.getElementById('loader').innerHTML = '<i class="fas fa-times-circle text-5xl text-red-500"></i>';
                }
            }
        }

        window.onload = completeRegistration;
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</body>
</html>
