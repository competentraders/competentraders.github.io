<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT VIP TERMINAL | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        :root { --cpt-gold: #d4af37; }
        body { font-family: 'Outfit', sans-serif; background: #000; color: white; margin: 0; overflow-x: hidden; }
        
        .flipping-logo {
            animation: flip-3d 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            transform-style: preserve-3d;
             
        }
        @keyframes flip-3d {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
            100% { transform: rotateY(360deg); }
        }

        .cpt-glass { 
            background: linear-gradient(145deg, rgba(15,16,22,0.95) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid rgba(212, 175, 55, 0.12);
            backdrop-filter: blur(15px);
        }
        
        .cpt-btn {
            background: linear-gradient(to right, #996515, #d4af37);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #cpt-toast {
            visibility: hidden; min-width: 280px; background: var(--cpt-gold); color: #000;
            text-align: center; border-radius: 50px; padding: 16px; position: fixed;
            z-index: 10000; left: 50%; bottom: 50px; transform: translateX(-50%);
            font-weight: 900; text-transform: uppercase; font-size: 11px; letter-spacing: 2px;
        }
        #cpt-toast.show { visibility: visible; animation: slideInUp 0.5s forwards; }
        @keyframes slideInUp { from { bottom: 0; opacity: 0; } to { bottom: 50px; opacity: 1; } }

        /* --- NEW WATERMARK STYLE --- */
        .cpt-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 700px;
            opacity: 0.04; /* Very faint */
            pointer-events: none; /* Can click through it */
            z-index: 0;
            /* FIX: Removes black background and makes it a watermark */
            mix-blend-mode: screen; 
            filter: grayscale(100%);
        }
    </style>
</head>
<body>

    <img src="vip.png" class="cpt-watermark" alt="">

    <div id="cpt-toast"></div>

    <nav class="p-6 flex justify-between items-center relative z-10">
        <a href="user-dashboard.html" class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5 transition">
            <i class="fas fa-arrow-left text-gray-400 text-sm"></i>
        </a>
        <div class="text-[9px] font-black uppercase tracking-[0.4em] text-yellow-600/60">CPT ENCRYPTED NODE</div>
        <div class="w-10 h-10"></div>
    </nav>

    <div class="flex flex-col items-center justify-center mt-6 mb-12 px-6 relative z-10">
        <img src="vip.png" alt="CPT VIP" class="flipping-logo h-36 md:h-48 w-auto drop-shadow-[0_0_25px_rgba(212,175,55,0.2)]">
        <h1 class="mt-8 text-3xl font-black uppercase tracking-tighter italic text-center">CPT <span class="text-yellow-600">VIP</span></h1>
    </div>

    <main id="vip-container" class="max-w-lg mx-auto px-6 space-y-8 pb-24 relative z-10">
        <div class="text-center py-20 font-black text-gray-700 uppercase tracking-widest text-[10px]">Synchronizing CPT Servers...</div>
    </main>

    <div id="vip-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl hidden items-center justify-center p-6 z-[9999]">
        <div class="cpt-glass w-full max-w-sm p-8 rounded-[40px] text-center shadow-2xl">
            <div class="w-16 h-16 bg-yellow-600/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-fingerprint text-2xl text-yellow-600"></i>
            </div>
            <h2 id="modal-title" class="text-xl font-black uppercase mb-2 italic">CPT PROTOCOL</h2>
            <p id="modal-desc" class="text-gray-400 text-[10px] mb-8 uppercase tracking-widest leading-relaxed"></p>
            <div id="modal-actions" class="space-y-3">
                <button id="confirm-vip-btn" class="w-full py-5 cpt-btn text-black rounded-2xl font-black uppercase text-xs">AGREE & INITIALIZE</button>
                <button onclick="closeModal()" class="w-full py-5 text-gray-500 font-black uppercase text-[10px]">CANCEL</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            addId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const showToast = (msg) => {
            const t = document.getElementById("cpt-toast");
            t.innerText = msg; t.className = "show";
            setTimeout(() => { t.className = ""; }, 3000);
        };

        window.closeModal = () => document.getElementById('vip-modal').classList.replace('flex', 'hidden');

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "login.html"; return; }

            // LIVE LISTENER: If a plan is deleted in Admin, it disappears here instantly
            onSnapshot(query(collection(db, "vip_plans"), orderBy("createdAt", "desc")), (snap) => {
                const cont = document.getElementById('vip-container');
                cont.innerHTML = "";
                if(snap.empty) {
                    cont.innerHTML = `<p class="text-center text-gray-700 text-[10px] font-black uppercase py-20 tracking-widest">Awaiting CPT Node Deployment...</p>`;
                    return;
                }
                snap.forEach(d => {
                    const p = d.data();
                    cont.innerHTML += `
                        <div class="cpt-glass p-8 rounded-[35px] relative">
                            <h2 class="text-2xl font-black uppercase italic mb-6">${p.planName}</h2>
                            <div class="grid grid-cols-2 gap-4 mb-8 text-[10px] font-black uppercase tracking-widest">
                                <div><p class="text-gray-500 mb-1">Investment</p><p class="text-white text-sm">₦${p.amount.toLocaleString()}</p></div>
                                <div><p class="text-gray-500 mb-1">Contract</p><p class="text-white text-sm">${p.duration}</p></div>
                                <div><p class="text-gray-500 mb-1">Return</p><p class="text-green-500 text-sm">₦${p.roi.toLocaleString()}</p></div>
                                <div><p class="text-gray-500 mb-1">Security</p><p class="text-yellow-600 text-sm">${p.guarantee}</p></div>
                            </div>
                            <button onclick="triggerPurchase('${d.id}', '${p.planName}', ${p.amount}, '${p.duration}')" class="w-full py-5 cpt-btn text-black rounded-2xl font-black uppercase text-xs">INITIALIZE CPT VIP</button>
                        </div>
                    `;
                });
            });
        });

        window.triggerPurchase = (id, name, amt, duration) => {
            const modal = document.getElementById('vip-modal');
            modal.classList.replace('hidden', 'flex');
            document.getElementById('confirm-vip-btn').classList.remove('hidden');
            document.getElementById('modal-desc').innerText = `Syncing ${name} node for ₦${amt.toLocaleString()}.`;
            document.getElementById('confirm-vip-btn').onclick = () => processVIP(name, amt, duration);
        };

        async function processVIP(name, amt, duration) {
            const user = auth.currentUser;
            const btn = document.getElementById('confirm-vip-btn');
            const uRef = doc(db, "users", user.uid);
            const uSnap = await getDoc(uRef);
            
            if(uSnap.data().balance < amt) {
                document.getElementById('modal-title').innerText = "CPT ERROR";
                document.getElementById('modal-desc').innerText = "Insufficient liquidity for this node.";
                btn.classList.add('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i>`;

            try {
                await updateDoc(uRef, { balance: increment(-amt) });
                await addDoc(collection(db, "active_investments"), {
                    clientId: user.uid, plan: name, amount: amt, type: "CPT-VIP", createdAt: new Date().toISOString()
                });
                showToast("CPT NODE SECURED");
                setTimeout(() => {
                    const msg = encodeURIComponent(`*CPT VIP INITIALIZED*\nPlan: ${name}\nAmt: ₦${amt.toLocaleString()}\nID: ${user.uid}`);
                    window.location.href = `https://wa.me/2349153258628?text=${msg}`;
                }, 1500);
            } catch (e) {
                document.getElementById('modal-title').innerText = "FAILED";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
