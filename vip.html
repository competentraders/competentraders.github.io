<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT VIP TERMINAL | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        :root { --cpt-gold: #d4af37; }
        body { font-family: 'Outfit', sans-serif; background: #000; color: white; margin: 0; overflow-x: hidden; }
        
        .cpt-glass { 
            background: linear-gradient(145deg, rgba(20,20,25,0.9) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(20px);
        }
        
        .cpt-btn {
            background: linear-gradient(to right, #996515, #d4af37);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #cpt-toast {
            visibility: hidden; min-width: 280px; background: var(--cpt-gold); color: #000;
            text-align: center; border-radius: 50px; padding: 16px; position: fixed;
            z-index: 10000; left: 50%; bottom: 50px; transform: translateX(-50%);
            font-weight: 900; text-transform: uppercase; font-size: 11px; letter-spacing: 2px;
        }
        #cpt-toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 50px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 50px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div id="cpt-toast"></div>

    <nav class="p-6 flex justify-between items-center relative z-10">
        <a href="user-dashboard.html" class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/5 transition">
            <i class="fas fa-chevron-left text-gray-400"></i>
        </a>
        <div class="text-[10px] font-black uppercase tracking-[0.5em] text-yellow-600/50">CPT SECURE ACCESS</div>
        <div class="w-12 h-12"></div>
    </nav>

    <div class="flex flex-col items-center justify-center mt-4 mb-16 px-6">
        <img src="vip.png" alt="CPT VIP" class="h-32 md:h-48 w-auto relative z-10 drop-shadow-[0_0_30px_rgba(212,175,55,0.3)]">
        <h1 class="mt-8 text-4xl font-black uppercase tracking-tighter italic text-center text-white">CPT <span class="text-yellow-600">VIP</span></h1>
        <p class="mt-2 text-[10px] font-bold uppercase tracking-[0.4em] text-gray-500">Official Competentraders Node</p>
    </div>

    <main id="vip-container" class="max-w-xl mx-auto px-6 space-y-10 pb-24">
        <div class="text-center py-20 font-black text-gray-700 uppercase tracking-widest text-xs">Synchronizing CPT Servers...</div>
    </main>

    <div id="vip-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl hidden items-center justify-center p-6 z-[9999]">
        <div class="cpt-glass w-full max-w-sm p-10 rounded-[40px] text-center shadow-2xl">
            <div id="modal-icon-box" class="w-16 h-16 bg-yellow-600/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-crown text-2xl text-yellow-600"></i>
            </div>
            <h2 id="modal-title" class="text-2xl font-black uppercase mb-3 tracking-tighter italic">CPT PROTOCOL</h2>
            <p id="modal-desc" class="text-gray-400 text-[10px] mb-10 uppercase tracking-[0.2em] leading-relaxed"></p>
            <div id="modal-actions" class="space-y-3">
                <button id="confirm-vip-btn" class="w-full py-5 cpt-btn text-black rounded-2xl font-black uppercase text-xs">AGREE & INITIALIZE CPT PLAN</button>
                <button onclick="closeModal()" class="w-full py-5 text-gray-500 font-black uppercase text-[10px]">CANCEL</button>
            </div>
        </div>
    </div>

    <footer class="border-t border-white/5 bg-[#050505] pt-16 pb-10 px-8 text-center">
        <h3 class="text-yellow-600 font-black uppercase text-sm mb-4 tracking-widest">Competentraders (CPT)</h3>
        <p class="text-gray-600 text-[9px] font-bold uppercase tracking-widest">© 2026 Competentraders Global. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const toast = document.getElementById("cpt-toast");
        window.showToast = (msg) => {
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        };

        window.closeModal = () => document.getElementById('vip-modal').classList.replace('flex', 'hidden');

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "login.html"; return; }

            onSnapshot(query(collection(db, "vip_plans"), orderBy("createdAt", "desc")), (snap) => {
                const cont = document.getElementById('vip-container');
                cont.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    cont.innerHTML += `
                        <div class="cpt-glass p-10 rounded-[40px] relative">
                            <h2 class="text-3xl font-black uppercase italic mb-8">${p.planName}</h2>
                            <div class="space-y-4 mb-10 text-[11px] font-bold uppercase tracking-widest text-gray-400">
                                <div class="flex justify-between font-black"><span>INVESTMENT</span><span class="text-white">₦${p.amount.toLocaleString()}</span></div>
                                <div class="flex justify-between font-black"><span>DURATION</span><span class="text-white">${p.duration}</span></div>
                                <div class="flex justify-between font-black"><span>RETURN</span><span class="text-green-500">₦${p.roi.toLocaleString()}</span></div>
                                <div class="flex justify-between font-black"><span>GUARANTEE</span><span class="text-yellow-600">${p.guarantee}</span></div>
                            </div>
                            <button onclick="triggerPurchase('${d.id}', '${p.planName}', ${p.amount}, '${p.duration}')" class="w-full py-5 cpt-btn text-black rounded-2xl font-black uppercase text-xs">INITIALIZE CPT VIP</button>
                        </div>
                    `;
                });
            });
        });

        window.triggerPurchase = (id, name, amt, duration) => {
            const modal = document.getElementById('vip-modal');
            modal.classList.replace('hidden', 'flex');
            document.getElementById('confirm-vip-btn').classList.remove('hidden');
            document.getElementById('modal-desc').innerText = `Syncing ${name} with your CPT account for ₦${amt.toLocaleString()}.`;
            document.getElementById('confirm-vip-btn').onclick = () => processVIP(name, amt, duration);
        };

        async function processVIP(name, amt, duration) {
            const user = auth.currentUser;
            const btn = document.getElementById('confirm-vip-btn');
            const uSnap = await getDoc(doc(db, "users", user.uid));
            
            if(uSnap.data().balance < amt) {
                document.getElementById('modal-title').innerText = "CPT ERROR";
                document.getElementById('modal-desc').innerText = "Insufficient balance for this CPT Plan.";
                btn.classList.add('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin mr-2"></i> CONNECTING...`;

            try {
                await updateDoc(doc(db, "users", user.uid), { balance: increment(-amt) });
                await addDoc(collection(db, "active_investments"), { clientId: user.uid, plan: name, type: "CPT-VIP", createdAt: new Date().toISOString() });
                showToast("CPT PLAN ACTIVE");
                setTimeout(() => {
                    window.location.href = `https://wa.me/2349153258628?text=${encodeURIComponent("CPT VIP ACTIVATED:\nPlan: "+name)}`;
                }, 2000);
            } catch (e) {
                document.getElementById('modal-title').innerText = "CPT ERROR";
                document.getElementById('modal-desc').innerText = "CPT Server handshake failed.";
                btn.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
