<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Ledger | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; margin: 0; }
        .glass-panel { background: rgba(15, 18, 24, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .status-success { color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .status-pending { color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .monday-active { border: 1px solid #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
        .monday-idle { border: 1px solid #3b82f6; color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
    </style>
</head>
<body class="p-4 pb-24">

    <div id="status-bar" class="max-w-2xl mx-auto mb-6 p-4 rounded-2xl text-[10px] font-black uppercase tracking-[3px] text-center"></div>

    <div class="max-w-2xl mx-auto glass-panel rounded-[32px] p-8 mb-8 border-b-4 border-blue-600">
        <p class="text-[10px] text-gray-500 font-black uppercase mb-1 tracking-widest text-center">Total Verified Disbursements</p>
        <h3 id="total-payout" class="text-4xl font-black mb-6 text-center">₦0</h3>
        
        <div class="bg-blue-600/5 p-4 rounded-2xl border border-blue-500/10">
            <p class="text-[11px] text-center text-gray-400 font-medium">
                Official Window: <span class="text-white">Mondays (08:00 - 18:00)</span>. 
                <br><span class="text-[9px] uppercase tracking-tighter">Verified by Competentraders Node</span>
            </p>
        </div>
    </div>

    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-6 px-2">
            <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-500">Weekly Settlement Log</h3>
            <span id="batch-id" class="text-[8px] font-black text-blue-500 uppercase tracking-widest"></span>
        </div>

        <div id="transaction-feed" class="space-y-3">
            </div>
    </div>

    <script>
        const masterTraderList = [
            "Tunde Lagos", "Chidi_FX", "Abubakar Y.", "Blessing.E", "Kwame Accra", 
            "Efe Warri", "Zainab J.", "Sipho SA", "Ikenna W.", "Funke Trades", 
            "Musa Kano", "Osas Benin", "Samuel Douala", "Bintu Jos", "Segun Akure",
            "Olumide.T", "Grace_Zambia", "Kofi_G", "Umar M.", "Faithful Trader",
            "Emeka_Wealth", "Amaka_J", "Hassan_K", "David_Lekki", "Victor_PH",
            "Seyi_FX", "Yinka_B", "Abba_Gombe", "Chuka_O", "Nkechi_V",
            "Mofe_Warri", "Dayo_Ibadan", "Lekan_Crypto", "Amina_Kano", "Titi_Lagos"
        ];

        function seededRandom(seed) {
            const x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function initLedger() {
            const now = new Date();
            const day = now.getDay();
            const isMonday = (day === 1);
            const feed = document.getElementById('transaction-feed');
            
            // 1. DYNAMIC TOTAL
            const startDate = new Date('2026-01-01');
            const weeksPassed = Math.floor((now - startDate) / (7 * 24 * 60 * 60 * 1000));
            const currentTotal = 15000000 + (weeksPassed * 1250000);
            document.getElementById('total-payout').innerText = `₦${currentTotal.toLocaleString()}.00`;

            // 2. STATUS BAR
            const bar = document.getElementById('status-bar');
            bar.className += isMonday ? " monday-active" : " monday-idle";
            bar.innerHTML = isMonday ? '<i class="fas fa-check-circle animate-pulse mr-2"></i> BATCH DISBURSEMENT IN PROGRESS' : '<i class="fas fa-clock mr-2"></i> NEXT SETTLEMENT: MONDAY';
            
            // BATCH ID (Changes weekly)
            document.getElementById('batch-id').innerText = `Batch: CT-2026-${weeksPassed}`;

            // 3. GENERATE 30 ENTRIES USING WEEK-BASED SEED
            // This ensures names stay the same for the whole week but change every Monday
            feed.innerHTML = "";
            for(let i=0; i<30; i++) {
                // Seed logic: uses the week number + index
                const seed = weeksPassed + i;
                const nameIndex = Math.floor(seededRandom(seed) * masterTraderList.length);
                const name = masterTraderList[nameIndex];
                const amount = (Math.floor(seededRandom(seed + 100) * 85) + 5) * 1000;
                
                const statusHtml = isMonday 
                    ? '<span class="text-[7px] font-black px-2 py-1 rounded status-success uppercase tracking-tighter">Settled</span>'
                    : '<span class="text-[7px] font-black px-2 py-1 rounded status-pending uppercase tracking-tighter">Awaiting Mon</span>';
                
                feed.innerHTML += `
                    <div class="glass-panel p-5 rounded-2xl flex items-center justify-between">
                        <div class="flex items-center gap-4">
                            <div class="w-8 h-8 bg-white/5 rounded-full flex items-center justify-center text-gray-500 text-[10px]">
                                <i class="fas fa-user"></i>
                            </div>
                            <div>
                                <p class="text-[11px] font-black uppercase tracking-tight">${name}</p>
                                <p class="text-[8px] text-gray-600 font-bold uppercase tracking-widest">${now.toLocaleDateString()}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xs font-black text-white">₦${amount.toLocaleString()}</p>
                            ${statusHtml}
                        </div>
                    </div>
                `;
            }
        }
        window.onload = initLedger;
    </script>
</body>
</html>
