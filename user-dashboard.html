<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
        authDomain: "competentraders-2efdc.firebaseapp.com",
        projectId: "competentraders-2efdc",
        storageBucket: "competentraders-2efdc.firebasestorage.app",
        messagingSenderId: "150379227882",
        appId: "1:150379227882:web:19d9c19805ef68b016c593"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const beep = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');

    // Global Modal Function
    window.showModal = (title, text, confirm = false, callback = null) => {
        const m = document.getElementById('custom-modal');
        if(!m) return;
        m.classList.replace('hidden', 'flex');
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = text;
        const btns = document.getElementById('modal-buttons');
        btns.innerHTML = "";
        
        if(confirm) {
            const b = document.createElement('button');
            b.className = "w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-[10px]";
            b.innerText = "CONFIRM ACCESS";
            b.onclick = callback;
            btns.appendChild(b);
        }
        const c = document.createElement('button');
        c.className = "w-full bg-white/10 py-4 rounded-2xl font-black uppercase text-[10px]";
        c.innerText = "CLOSE";
        c.onclick = () => m.classList.replace('flex', 'hidden');
        btns.appendChild(c);
    };

    // FIXED BUY FUNCTION
    window.buyROI = async (cat, price, payout) => {
        const user = auth.currentUser;
        if(!user) {
            window.location.href = "login.html";
            return;
        }
        
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        const uData = userSnap.data();
        
        // Ensure price is a clean number
        const amt = Number(String(price).replace(/[^0-9.]/g, ''));

        if(uData.balance < amt) { 
            window.showModal("BALANCE LOW", "Kindly top up your account to initialize this node."); 
            return; 
        }

        window.showModal("CONFIRM NODE", `Subscribe to ${cat} for ${price}? Your balance will be debited.`, true, async () => {
            try {
                // 1. UPDATE BALANCE
                await updateDoc(userRef, { balance: increment(-amt) });

                // 2. LOG TO DATABASE (Simplified object to avoid errors)
                await addDoc(collection(db, "active_investments"), {
                    clientId: user.uid,
                    clientName: uData.fullName || "User",
                    plan: cat,
                    amount: amt,
                    payout: payout,
                    status: "running",
                    createdAt: new Date().toISOString()
                });

                // 3. SUCCESS MESSAGE
                window.showModal("SUCCESS", "Plan Activated! Your account has been debited. Redirecting to support...");
                
                // 4. FORCE REDIRECT AFTER 3 SECONDS
                setTimeout(() => {
                    window.location.replace("https://tawk.to/chat/69d36adc9ba1621c3a200a7d/default");
                }, 3000);

            } catch (error) {
                console.error("Firebase Error:", error);
                window.showModal("TRANSACTION FAILED", "Check your internet or Firebase rules.");
            }
        });
    };

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            // Stats Sync
            onSnapshot(doc(db, "users", user.uid), (s) => {
                const d = s.data();
                if(d) {
                    document.getElementById('user-name-display').innerText = d.fullName;
                    document.getElementById('user-email-display').innerText = d.email;
                    document.getElementById('user-initial').innerText = d.fullName.charAt(0).toUpperCase();
                    document.getElementById('user-balance').innerText = (d.balance || 0).toFixed(2);
                    document.querySelectorAll('.curr').forEach(el => el.innerHTML = d.currency || "₦");
                }
            });

            // Plans Loader

            // Locate this part in your User Dashboard script:
onSnapshot(query(collection(db, "roi_plans"), orderBy("timestamp", "desc")), (snap) => {
    const cont = document.getElementById('roi-plans-container');
    if(!cont) return;
    cont.innerHTML = "";
    snap.forEach(d => {
        const p = d.data();
        cont.innerHTML += `
            <div class="plan-card">
                <p class="text-[10px] font-bold text-gray-500 uppercase">${p.category}</p>
                <h3 class="text-2xl font-black text-white"><span class="curr"></span>${p.price}</h3>
                
                <p class="text-[9px] text-blue-500 font-bold mt-1 uppercase">
                    ROI: <span class="curr"></span>${p.payout} | ${p.duration} | ${p.guarantee}
                </p>
                
                <button onclick="window.buyROI('${p.category}', '${p.price}', '${p.payout}')" class="w-full py-4 bg-blue-600 rounded-xl font-black text-[10px] uppercase mt-4">INITIALIZE ACCESS</button>
            </div>`;
    });
});

        } else { window.location.href = "login.html"; }
    });

    window.toggleMenu = () => document.getElementById('master-sidebar').classList.toggle('active');
    window.handleLogout = () => signOut(auth).then(() => window.location.href = "login.html");
</script>
