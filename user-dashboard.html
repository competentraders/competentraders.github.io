<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Competentraders | Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; margin: 0; overflow-x: hidden; }

        .master-trigger {
            position: fixed; top: 12px; left: 12px; width: 45px; height: 45px;
            background: #3b82f6; color: white; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            z-index: 2147483647 !important; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
        }

        #master-sidebar {
            position: fixed; inset: 0; background: #0b0d12;
            z-index: 2147483646 !important; display: none;
            flex-direction: column; overflow-y: auto;
        }
        #master-sidebar.active { display: flex; }

        .chart-section { height: 45vh; width: 100%; border-bottom: 2px solid #1e222d; }
        
        .plan-card { 
            background: #0f111a; border: 1px solid #1e293b; border-radius: 20px; 
            padding: 20px; display: flex; flex-direction: column; transition: 0.3s; 
        }

        .ticker-wrapper {
            position: fixed; bottom: 0; width: 100%; height: 50px;
            background: #131722; z-index: 1000; border-top: 1px solid #2d3343;
            overflow: hidden; display: flex; align-items: center;
        }

        .ticker-scroll {
            display: flex;
            width: 200%;
            animation: marquee-nonstop 40s linear infinite;
        }

        .ticker-item { flex-shrink: 0; width: 100%; }

        @keyframes marquee-nonstop {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .tradingview-widget-container { width: 100% !important; pointer-events: none; }
    </style>
</head>

<body class="pb-24">

    <button class="master-trigger" id="menu-btn">
        <i class="fas fa-bars fa-lg"></i>
    </button>

    <div id="master-sidebar">
        <div class="p-6 bg-[#131722] border-b border-gray-800 flex flex-col min-h-screen">
            <div class="flex justify-between items-center mb-8">
                <span class="font-black italic text-white uppercase text-xs">Competent<span class="text-blue-500">raders</span></span>
                <button id="close-btn" class="text-white text-3xl">&times;</button>
            </div>
            
            <div class="bg-blue-600/10 border border-blue-500/20 p-5 rounded-[24px] mb-6">
                <div class="flex items-center gap-4 mb-5">
                    <div id="user-initial" class="w-12 h-12 rounded-2xl bg-blue-600 flex items-center justify-center font-black text-xl text-white">?</div>
                    <div>
                        <p id="user-name-display" class="text-sm font-black uppercase tracking-tight text-white">Loading...</p>
                        <p id="user-email-display" class="text-[9px] text-gray-500 font-bold"></p>
                    </div>
                </div>
                <div class="pt-4 border-t border-white/5">
                    <p class="text-[9px] text-gray-500 font-black uppercase tracking-widest mb-1">Balance</p>
                    <h2 class="text-2xl font-black text-white"><span class="curr"></span><span id="user-balance">0.00</span></h2>
                </div>
            </div>

            <div class="space-y-3">
                <a href="deposit.html" class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-green-500/10 flex items-center justify-center"><i class="fas fa-wallet text-green-500 text-xs"></i></div>
                        <span class="text-[11px] font-black uppercase tracking-widest text-white">Deposit Funds</span>
                    </div>
                </a>
                <a href="withdraw.html" class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-orange-500/10 flex items-center justify-center"><i class="fas fa-money-bill-transfer text-orange-500 text-xs"></i></div>
                        <span class="text-[11px] font-black uppercase tracking-widest text-white">Withdrawal</span>
                    </div>
                </a>
                <a href="football-predictions.html" class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-blue-500/10 flex items-center justify-center"><i class="fas fa-futbol text-blue-500 text-xs"></i></div>
                        <span class="text-[11px] font-black uppercase tracking-widest text-white">Predictions</span>
                    </div>
                </a>
                <a href="forex-trading.html" class="flex items-center justify-between p-4 bg-white/5 rounded-2xl border border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-indigo-500/10 flex items-center justify-center"><i class="fas fa-globe-americas text-indigo-400 text-xs"></i></div>
                        <span class="text-[11px] font-black uppercase tracking-widest text-white">Forex Trading</span>
                    </div>
                </a>
            </div>

            <div class="mt-auto pt-10 pb-6">
                <button id="logout-btn" class="w-full py-4 bg-red-500/10 text-red-500 rounded-2xl font-black uppercase text-[10px] tracking-widest border border-red-500/20">LOGOUT SESSION</button>
            </div>
        </div>
    </div>

    <div class="chart-section">
        <div id="tradingview_live" style="height: 100%; width: 100%;"></div>
    </div>

    <div class="p-4 mt-6">
        <marquee class="text-[10px] font-black uppercase tracking-widest text-blue-400 bg-blue-600/5 py-2 rounded-lg mb-4">
            The ROI plan changes per what we know will work or pay out, kindly select your desire option and rest, the % determines the guarantee thank you.
        </marquee>
        
        <h2 class="text-sm font-black mb-4 flex items-center gap-2 text-white uppercase tracking-tighter">
            <i class="fas fa-bolt text-yellow-500"></i> Select Desire ROI Node
        </h2>

        <div id="roi-plans-container" class="grid grid-cols-1 gap-4 mb-20">
            </div>
    </div>

    <div id="custom-modal" class="fixed inset-0 z-[2147483647] hidden flex items-center justify-center p-6 bg-black/90 backdrop-blur-md">
        <div class="glass-panel max-w-sm w-full p-8 rounded-[40px] text-center border-blue-500/30 shadow-2xl scale-95 transition-transform duration-300">
            <div id="modal-icon" class="text-6xl mb-6"></div>
            <h2 id="modal-title" class="text-2xl font-black uppercase mb-2 text-white"></h2>
            <p id="modal-text" class="text-gray-400 text-xs mb-8 leading-relaxed"></p>
            <div id="modal-buttons" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <div class="ticker-wrapper">
        <div class="ticker-scroll">
            <div class="ticker-item">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
                    { "symbols": [
                        {"proName":"BINANCE:BTCUSDT","title":"BTC"},{"proName":"FX_IDC:XAUUSD","title":"GOLD"},
                        {"proName":"FX:EURUSD","title":"EUR/USD"},{"proName":"BINANCE:SOLUSDT","title":"SOL"}
                    ], "colorTheme": "dark", "isTransparent": true, "displayMode": "regular", "locale": "en" }
                    </script>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, increment, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
        authDomain: "competentraders-2efdc.firebaseapp.com",
        projectId: "competentraders-2efdc",
        storageBucket: "competentraders-2efdc.firebasestorage.app",
        messagingSenderId: "150379227882",
        appId: "1:150379227882:web:19d9c19805ef68b016c593"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Sidebar Fix
    const sidebar = document.getElementById('master-sidebar');
    document.getElementById('menu-btn').onclick = () => sidebar.classList.add('active');
    document.getElementById('close-btn').onclick = () => sidebar.classList.remove('active');
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");

    // Modal Controller
    const showModal = (type, title, text, onConfirm = null) => {
        const modal = document.getElementById('custom-modal');
        const icon = document.getElementById('modal-icon');
        const mBtns = document.getElementById('modal-buttons');
        mBtns.innerHTML = "";
        modal.classList.replace('hidden', 'flex');

        if(type === 'insufficient') {
            icon.innerHTML = "🦅"; icon.className = "text-6xl mb-6 opacity-20 grayscale";
            document.getElementById('modal-title').className = "text-2xl font-black uppercase text-red-500";
        } else {
            icon.innerHTML = "🦅"; icon.className = "text-6xl mb-6 text-blue-500 drop-shadow-xl";
            document.getElementById('modal-title').className = "text-2xl font-black uppercase text-blue-400";
        }

        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-text').innerText = text;

        if(onConfirm) {
            const b1 = document.createElement('button');
            b1.className = "w-full bg-blue-600 py-4 rounded-2xl font-black uppercase text-[10px]";
            b1.innerText = "Confirm Access";
            b1.onclick = () => { modal.classList.replace('flex', 'hidden'); onConfirm(); };
            mBtns.appendChild(b1);
        }
        const b2 = document.createElement('button');
        b2.className = "w-full bg-white/10 py-4 rounded-2xl font-black uppercase text-[10px]";
        b2.innerText = onConfirm ? "Cancel" : "Close";
        b2.onclick = () => modal.classList.replace('flex', 'hidden');
        mBtns.appendChild(b2);
    };

    // Global Access for HTML
    window.buyROI = async (cat, price, payout, duration) => {
        const user = auth.currentUser;
        if(!user) return;
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        const bal = userSnap.data().balance || 0;
        const cleanPrice = parseFloat(price.replace(/[^0-9.]/g, ''));

        if(bal < cleanPrice) {
            showModal('insufficient', 'Empty Nest', 'Your balance is too low. Kindly top up.');
            return;
        }

        showModal('confirm', 'Initialize Node?', `Authorize debit of ${price} for ${cat}?`, async () => {
            await updateDoc(userRef, { balance: increment(-cleanPrice) });
            showModal('success', 'Node Active!', `Growth started. Expected ROI after ${duration}.`);
            const msg = `ROI Subscription: ${cat}\nAmt: ${price}\nUser: ${userSnap.data().fullName}`;
            setTimeout(() => window.location.href = `https://wa.me/2349153258628?text=${encodeURIComponent(msg)}`, 3000);
        });
    };

    // User State Listener
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('user-name-display').innerText = data.fullName;
                    document.getElementById('user-email-display').innerText = data.email;
                    document.getElementById('user-initial').innerText = data.fullName.charAt(0).toUpperCase();
                    document.getElementById('user-balance').innerText = (data.balance || 0).toFixed(2);
                    const userCurr = data.currency || "₦";
                    document.querySelectorAll('.curr').forEach(el => el.innerHTML = userCurr);
                }
            });
        } else { window.location.href = "login.html"; }
    });

    // ROI Listener (Fixed)
    onSnapshot(query(collection(db, "roi_plans"), orderBy("timestamp", "desc")), (snap) => {
        const roiContainer = document.getElementById('roi-plans-container');
        roiContainer.innerHTML = "";
        snap.forEach(d => {
            const plan = d.data();
            roiContainer.innerHTML += `
                <div class="plan-card border-l-4 border-blue-600">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[9px] font-black uppercase text-blue-500 bg-blue-500/10 px-3 py-1 rounded-full">${plan.category}</span>
                        <span class="text-[9px] font-black uppercase text-green-500">${plan.guarantee} Guarantee</span>
                    </div>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Growth Target</p>
                    <h3 class="text-2xl font-black text-white mb-2"><span class="curr"></span>${plan.payout}</h3>
                    <div class="flex items-center gap-4 text-[10px] text-gray-400 mb-6">
                        <span><i class="far fa-clock"></i> ${plan.duration}</span>
                        <span><i class="fas fa-microchip"></i> Node Active</span>
                    </div>
                    <button onclick="buyROI('${plan.category}', '${plan.price}', '${plan.payout}', '${plan.duration}')" 
                        class="w-full py-4 bg-blue-600 rounded-xl font-black text-[10px] uppercase shadow-lg shadow-blue-500/20">
                        Purchase Access (${plan.price})
                    </button>
                </div>`;
        });
    });
</script>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    new TradingView.widget({
        "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "1",
        "theme": "dark", "container_id": "tradingview_live"
    });
</script>
</body>
</html>
