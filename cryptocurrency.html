<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Crypto Terminal | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #06070a; color: white; }
        .glass-panel { background: rgba(15, 18, 24, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Fluctuation Flash Effects */
        .price-up { color: #22c55e !important; }
        .price-down { color: #ef4444 !important; }

        .crypto-row { border-bottom: 1px solid rgba(255,255,255,0.02); transition: all 0.2s; }
        .crypto-row:hover { background: rgba(59, 130, 246, 0.03); }
        
        /* Hide scrollbar for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-8 pb-24">

    <div class="max-w-6xl mx-auto mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
            <div class="inline-flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"><i class="fas fa-microchip text-white text-xs"></i></div>
                <span class="text-xl font-black uppercase tracking-tighter">Competent<span class="text-blue-500">raders</span></span>
            </div>
            <h2 class="text-3xl font-black uppercase tracking-tight">Crypto Terminal</h2>
            <p class="text-gray-500 text-[10px] font-black uppercase tracking-[0.3em]">Institutional Liquidity • Secure Execution</p>
        </div>
        <div class="flex gap-4">
            <a href="user-dashboard.html" class="px-6 py-3 glass-panel rounded-xl text-xs font-bold uppercase hover:bg-white/5 transition-all">Dashboard</a>
            <div class="px-4 py-3 bg-blue-500/10 border border-blue-500/20 rounded-xl text-[10px] font-black uppercase text-blue-400">
                <i class="fas fa-bolt animate-pulse mr-2"></i> Real-Time
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto glass-panel rounded-[32px] overflow-hidden">
        <div class="grid grid-cols-4 md:grid-cols-5 p-6 bg-white/5 text-[9px] font-black uppercase tracking-widest text-gray-500 border-b border-white/5">
            <div>Asset</div>
            <div class="text-right">Price (USD)</div>
            <div class="text-right hidden md:block">24h Change</div>
            <div class="text-right">Action</div>
            <div class="text-right">Sell Rate</div>
        </div>

        <div id="market-list" class="divide-y divide-white/5"></div>
    </div>

    <script>
        // High-Growth Assets (No BTC as requested)
        const assets = [
            { s: 'ETHUSDT', name: 'Ethereum' }, { s: 'SOLUSDT', name: 'Solana' }, { s: 'BNBUSDT', name: 'Binance' },
            { s: 'AVAXUSDT', name: 'Avalanche' }, { s: 'LINKUSDT', name: 'Chainlink' }, { s: 'MATICUSDT', name: 'Polygon' },
            { s: 'NEARUSDT', name: 'Near Protocol' }, { s: 'APTUSDT', name: 'Aptos' }, { s: 'OPUSDT', name: 'Optimism' },
            { s: 'SUIUSDT', name: 'Sui' }, { s: 'INJUSDT', name: 'Injective' }, { s: 'TIAUSDT', name: 'Celestia' }
        ];

        const marketList = document.getElementById('market-list');
        const prevPrices = {};

        // Inject rows with WhatsApp Links
        assets.forEach(asset => {
            const cleanS = asset.s.replace('USDT', '');
            marketList.innerHTML += `
                <div id="row-${asset.s}" class="crypto-row grid grid-cols-4 md:grid-cols-5 p-5 items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-500/10 rounded-xl flex items-center justify-center text-[11px] font-black text-blue-500 border border-blue-500/20">${cleanS}</div>
                        <div>
                            <p class="text-xs font-black uppercase">${cleanS}</p>
                            <p class="text-[8px] text-gray-600 font-bold uppercase tracking-tighter">${asset.name}</p>
                        </div>
                    </div>
                    <div id="price-${asset.s}" class="text-right font-mono text-sm font-bold">---</div>
                    <div id="change-${asset.s}" class="text-right hidden md:block text-[10px] font-black">--</div>
                    
                    <div class="text-right">
                        <a href="https://wa.me/2349153258628?text=Hello%20Competentraders%2C%20I%20want%20to%20open%20a%20BUY%20position%20for%20${cleanS}." 
                           class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-[9px] font-black uppercase transition-all inline-block">Buy</a>
                    </div>

                    <div id="sell-${asset.s}" class="text-right text-[10px] font-black text-emerald-500">--</div>
                </div>
            `;
        });

        function startLiveStream() {
            const streams = assets.map(a => a.s.toLowerCase() + '@ticker').join('/');
            const socket = new WebSocket(`wss://stream.binance.com:9443/ws/${streams}`);

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const sym = data.s;
                const price = parseFloat(data.c);
                const change = data.P;
                
                const priceEl = document.getElementById(`price-${sym}`);
                const changeEl = document.getElementById(`change-${sym}`);
                const sellEl = document.getElementById(`sell-${sym}`);

                if (priceEl) {
                    if (prevPrices[sym] < price) {
                        priceEl.className = 'text-right font-mono text-sm font-bold price-up';
                    } else if (prevPrices[sym] > price) {
                        priceEl.className = 'text-right font-mono text-sm font-bold price-down';
                    }
                    
                    // Reset to white after flicker
                    setTimeout(() => { priceEl.className = 'text-right font-mono text-sm font-bold text-white'; }, 400);

                    priceEl.innerText = `$${price.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                    changeEl.innerText = `${parseFloat(change) > 0 ? '+' : ''}${change}%`;
                    changeEl.style.color = parseFloat(change) >= 0 ? '#22c55e' : '#ef4444';
                    
                    // Sell Rate (Calculated at 98.2% of market value)
                    sellEl.innerText = `$${(price * 0.982).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                }
                prevPrices[sym] = price;
            };

            socket.onclose = () => setTimeout(startLiveStream, 3000);
        }

        startLiveStream();
    </script>

    <p class="mt-10 text-center text-[9px] text-gray-700 uppercase tracking-[0.4em] font-black">
        Global Liquidity Provided by Binance Cloud • Encryption Active
    </p>

</body>
</html>
