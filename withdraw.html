<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; }
        .withdraw-card { background: #0f111a; border: 1px solid #1e293b; border-radius: 28px; }
        input, select { background: #131722 !important; border: 1px solid #2d3343 !important; color: white !important; }
        input:focus { border-color: #3b82f6 !important; outline: none; }
        .method-card { border: 2px solid transparent; transition: 0.3s; cursor: pointer; }
        .method-card.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="p-4 pb-12">

    <div class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-4">
            <a href="user-dashboard.html" class="w-10 h-10 flex items-center justify-center bg-gray-800 rounded-full text-blue-500">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-black uppercase italic">Withdraw <span class="text-blue-500">Funds</span></h1>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-gray-500 font-bold uppercase">Available</p>
            <p class="text-lg font-black text-green-500" id="currentBalanceDisplay">$0.00</p>
        </div>
    </div>

    <div class="withdraw-card p-6 mb-6">
        <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 block">Withdrawal Amount ($)</label>
        <input type="number" id="withdrawAmount" placeholder="0.00" class="w-full p-4 rounded-2xl font-black text-2xl">
    </div>

    <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 block px-2">Select Method</label>
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div onclick="setMethod('bank')" id="btn-bank" class="method-card active p-4 rounded-2xl bg-[#0f111a] text-center">
            <i class="fas fa-university text-2xl mb-2 text-yellow-500"></i>
            <p class="text-xs font-bold uppercase">Bank Transfer</p>
        </div>
        <div onclick="setMethod('crypto')" id="btn-crypto" class="method-card p-4 rounded-2xl bg-[#0f111a] text-center">
            <i class="fab fa-bitcoin text-2xl mb-2 text-orange-500"></i>
            <p class="text-xs font-bold uppercase">Crypto (USDT)</p>
        </div>
    </div>

    <div class="withdraw-card p-6 mb-8">
        <div id="form-bank">
            <p class="text-blue-500 text-[10px] font-bold uppercase mb-4">Transferring to saved account</p>
            <div id="savedBankInfo" class="bg-[#131722] p-4 rounded-xl border border-gray-800 mb-4">
                <p class="text-gray-500 text-xs italic">Loading saved bank details...</p>
            </div>
            <p class="text-[10px] text-gray-500">To change bank details, go to the <a href="bank-account.html" class="text-blue-500">Bank Account</a> page.</p>
        </div>

        <div id="form-crypto" class="hidden space-y-4">
            <div>
                <label class="text-[10px] font-black text-gray-500 uppercase mb-2 block">Network</label>
                <select class="w-full p-4 rounded-xl font-bold">
                    <option>USDT (TRC20)</option>
                    <option>USDT (ERC20)</option>
                    <option>Bitcoin (BTC)</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-black text-gray-500 uppercase mb-2 block">Wallet Address</label>
                <input type="text" placeholder="Enter your wallet address" class="w-full p-4 rounded-xl font-semibold">
            </div>
        </div>
    </div>

    <button onclick="handleWithdrawal()" class="w-full py-5 bg-blue-600 rounded-3xl font-black text-sm uppercase shadow-xl shadow-blue-500/20 active:scale-95 transition">
        Process Withdrawal
    </button>

    <script>
        let currentMethod = 'bank';
        let balance = parseFloat(localStorage.getItem('accountBalance')) || 0.00;

        // Initialize Page
        window.onload = () => {
            document.getElementById('currentBalanceDisplay').innerText = "$" + balance.toLocaleString();
            loadBankDetails();
        };

        function loadBankDetails() {
            const savedBank = JSON.parse(localStorage.getItem('userBankDetails'));
            const container = document.getElementById('savedBankInfo');
            if (savedBank) {
                container.innerHTML = `
                    <p class="font-black text-white">${savedBank.bank}</p>
                    <p class="text-sm text-gray-400">${savedBank.num} - ${savedBank.name}</p>
                `;
            } else {
                container.innerHTML = `<p class="text-red-400 text-xs">No bank account saved. Please add one in settings.</p>`;
            }
        }

        function setMethod(m) {
            currentMethod = m;
            document.getElementById('btn-bank').classList.toggle('active', m === 'bank');
            document.getElementById('btn-crypto').classList.toggle('active', m === 'crypto');
            document.getElementById('form-bank').classList.toggle('hidden', m !== 'bank');
            document.getElementById('form-crypto').classList.toggle('hidden', m !== 'crypto');
        }

        function handleWithdrawal() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            if (!amount || amount <= 0) {
                alert("Please enter a valid amount.");
                return;
            }

            if (amount > balance) {
                alert("Insufficient Balance! You only have $" + balance);
                return;
            }

            // DEDUCT MONEY
            balance -= amount;
            localStorage.setItem('accountBalance', balance);
            
            alert("Withdrawal Request Submitted! Your funds will be processed within 24 hours.");
            window.location.href = "user-dashboard.html";
        }
    </script>
</body>
</html>
