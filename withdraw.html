<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; }
        .withdraw-card { background: #0f111a; border: 1px solid #1e293b; border-radius: 24px; padding: 24px; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto">
        <div class="flex items-center justify-between mb-10">
            <a href="dashboard.html" class="text-gray-500"><i class="fas fa-arrow-left"></i></a>
            <span class="text-[10px] font-black uppercase tracking-widest text-gray-600">Secure Withdrawal</span>
            <a href="settings.html" class="text-blue-500 text-sm font-bold underline">Edit Bank</a>
        </div>

        <div class="text-center mb-8">
            <p class="text-[10px] font-black uppercase text-gray-500 tracking-[0.2em] mb-1">Available Balance</p>
            <h1 class="text-4xl font-black">₦<span id="display-bal">0.00</span></h1>
        </div>

        <div class="withdraw-card space-y-6">
            <div class="p-4 bg-blue-600/5 rounded-2xl border border-blue-500/10">
                <p class="text-[9px] font-black uppercase text-blue-500 mb-2">Sending To:</p>
                <h3 id="target-bank" class="font-black text-sm uppercase">Loading...</h3>
                <p id="target-acc" class="text-xs text-gray-400 font-bold tracking-widest mt-1">---</p>
                <p id="target-name" class="text-[10px] text-gray-500 uppercase mt-1">---</p>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block">Withdrawal Amount</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-gray-600">₦</span>
                    <input type="number" id="withdraw-amt" placeholder="Min 1,000" class="w-full bg-black/40 border border-white/5 p-4 pl-10 rounded-xl font-black outline-none focus:border-red-500 transition-all">
                </div>
                <p class="text-[9px] text-red-400 font-bold mt-2 uppercase tracking-tighter">* Processing Fee: ₦100 will be deducted</p>
            </div>

            <button onclick="processWithdrawal()" id="withdraw-btn" class="w-full py-5 bg-white text-black rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl">
                Request Withdrawal
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userBalance = 0;
        let bankData = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    const data = snap.data();
                    userBalance = data.balance || 0;
                    document.getElementById('display-bal').innerText = userBalance.toLocaleString();
                    
                    if(data.bankDetails) {
                        bankData = data.bankDetails;
                        document.getElementById('target-bank').innerText = bankData.bankName;
                        document.getElementById('target-acc').innerText = bankData.accNum;
                        document.getElementById('target-name').innerText = bankData.accName;
                    } else {
                        document.getElementById('target-bank').innerHTML = `<span class="text-red-500">No Bank Linked</span>`;
                        document.getElementById('withdraw-btn').disabled = true;
                        document.getElementById('withdraw-btn').innerText = "LINK BANK IN SETTINGS FIRST";
                    }
                }
            }
        });

        window.processWithdrawal = async () => {
            const amt = Number(document.getElementById('withdraw-amt').value);
            const totalToDeduct = amt + 100;

            if(amt < 1000) return alert("Minimum withdrawal is ₦1,000");
            if(totalToDeduct > userBalance) return alert("Insufficient Balance (Incl. ₦100 fee)");

            const btn = document.getElementById('withdraw-btn');
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            const ticket = "WD-" + Math.floor(1000 + Math.random() * 9000);

            try {
                // Log request to Firebase
                await addDoc(collection(db, "withdrawals"), {
                    uid: auth.currentUser.uid,
                    email: auth.currentUser.email,
                    amount: amt,
                    fee: 100,
                    total: totalToDeduct,
                    bank: bankData,
                    status: "pending",
                    ticket: ticket,
                    timestamp: serverTimestamp()
                });

                // Redirect to WhatsApp
                const phone = "2349157023248";
                const text = `*WITHDRAWAL REQUEST*%0A---%0A*Ticket:* ${ticket}%0A*Email:* ${auth.currentUser.email}%0A*Amount:* ₦${amt}%0A*Fee:* ₦100%0A*Total:* ₦${totalToDeduct}%0A---%0A*Bank:* ${bankData.bankName}%0A*Acc:* ${bankData.accNum}%0A*Name:* ${bankData.accName}`;
                
                window.location.href = `https://wa.me/${phone}?text=${text}`;

            } catch (e) {
                alert("Error connecting. Try again.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
