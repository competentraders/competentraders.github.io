<div class="text-center mb-8">
    <p class="text-[10px] font-black uppercase text-gray-500 tracking-[0.2em] mb-1">Available Balance</p>
    <h1 class="text-4xl font-black italic"><span class="user-currency">₦</span><span id="display-bal">0.00</span></h1>
</div>

<div>
    <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-widest ml-1">Withdrawal Amount</label>
    <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-gray-600 user-currency">₦</span>
        <input type="number" id="withdraw-amt" placeholder="0.00" class="w-full bg-black/40 border border-white/5 p-5 pl-10 rounded-2xl font-black text-xl outline-none focus:border-blue-500 transition-all text-white">
    </div>
    <div class="flex justify-between items-center mt-3 px-1">
        <p class="text-[9px] text-gray-500 font-bold uppercase italic">Network Fee: <span class="user-currency">₦</span><span id="fee-amt">100</span></p>
        <p class="text-[9px] text-blue-500 font-bold uppercase tracking-tighter">Min: <span class="user-currency">₦</span><span id="min-amt">1,000</span></p>
    </div>
</div>

<script type="module">
    // ... (Keep your existing Firebase imports)

    let userBalance = 0;
    let bankData = null;
    let userSymbol = "₦"; // Default
    let networkFee = 100;
    let minWithdrawal = 1000;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const snap = await getDoc(doc(db, "users", user.uid));
            if (snap.exists()) {
                const data = snap.data();
                
                // 1. GET USER CURRENCY FROM DATABASE
                // Assuming your field is named 'currency' or 'symbol'
                userSymbol = data.currency === "USD" ? "$" : (data.currency === "GHS" ? "GH₵" : "₦");
                
                // 2. ADJUST FEES BASED ON CURRENCY
                if (userSymbol === "$") {
                    networkFee = 1;      // $1 fee
                    minWithdrawal = 10;  // $10 minimum
                } else if (userSymbol === "GH₵") {
                    networkFee = 5;      // 5 GHS fee
                    minWithdrawal = 50;  // 50 GHS minimum
                }

                // 3. UPDATE ALL UI ELEMENTS
                document.querySelectorAll('.user-currency').forEach(el => el.innerText = userSymbol);
                document.getElementById('fee-amt').innerText = networkFee;
                document.getElementById('min-amt').innerText = minWithdrawal.toLocaleString();
                
                userBalance = data.balance || 0;
                document.getElementById('display-bal').innerText = userBalance.toLocaleString();
                
                if(data.bankDetails) {
                    bankData = data.bankDetails;
                    document.getElementById('target-bank').innerText = bankData.bankName;
                    document.getElementById('target-acc').innerText = bankData.accNum;
                    document.getElementById('target-name').innerText = bankData.accName;
                } else {
                    document.getElementById('target-bank').innerHTML = `<span class="text-red-500">Bank Details Missing</span>`;
                    document.getElementById('withdraw-btn').disabled = true;
                    document.getElementById('withdraw-btn').style.opacity = "0.5";
                    document.getElementById('withdraw-btn').innerText = "SET UP BANK IN SETTINGS";
                }
            }
        } else {
            window.location.href = "login.html";
        }
    });

    window.processWithdrawal = async () => {
        const amtValue = document.getElementById('withdraw-amt').value;
        const amt = Number(amtValue);
        const totalToDeduct = amt + networkFee;

        if(!amtValue || amt < minWithdrawal) return showNotify(`Minimum withdrawal is ${userSymbol}${minWithdrawal}`);
        if(totalToDeduct > userBalance) return showNotify("Insufficient Balance (Fee Included)");

        const btn = document.getElementById('withdraw-btn');
        btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> SECURING REQUEST...`;
        btn.disabled = true;

        const ticket = "WD-" + Math.floor(1000 + Math.random() * 9000);
        const phone = "2349157023248";
        
        // DYNAMIC WHATSAPP MESSAGE
        const text = `*WITHDRAWAL REQUEST*%0A---%0A*Ticket:* ${ticket}%0A*Email:* ${auth.currentUser.email}%0A*Amount:* ${userSymbol}${amt}%0A*Fee:* ${userSymbol}${networkFee}%0A*Total:* ${userSymbol}${totalToDeduct}%0A---%0A*Bank:* ${bankData.bankName}%0A*Acc:* ${bankData.accNum}%0A*Name:* ${bankData.accName}`;

        // ... (Keep the rest of your Firebase addDoc and redirect logic)
    };
</script>
