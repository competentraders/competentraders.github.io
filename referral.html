<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Referral | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        :root { --bg: #06070a; --card: #0f1218; --text: #f8fafc; --border: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); }
        .glass-panel { background: var(--card); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .stat-card { background: rgba(59, 130, 246, 0.05); border: 1px solid rgba(59, 130, 246, 0.1); }
        .withdraw-note { background: rgba(245, 158, 11, 0.05); border: 1px dashed rgba(245, 158, 11, 0.3); }
    </style>
</head>
<body class="p-6">

    <div class="max-w-2xl mx-auto space-y-8">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black uppercase italic tracking-tighter">Referral<span class="text-blue-600"></span></h1>
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.3em]">Affiliate Terminal</p>
            </div>
            <a href="user-dashboard.html" class="w-10 h-10 rounded-xl glass-panel flex items-center justify-center text-blue-500">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>

        <div class="glass-panel p-8 rounded-[2.5rem] text-center space-y-6">
            <div>
                <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-2">Share Invitation Link</label>
                <div class="flex items-center gap-2 bg-black/40 p-4 rounded-2xl border border-white/5">
                    <span id="referralCode" class="text-2xl font-black tracking-widest text-blue-400">---</span>
                    <button onclick="copyCode()" class="ml-auto text-gray-400 hover:text-white transition">
                        <i class="fas fa-copy"></i>
                    </button>
                </div>
            </div>
            <button onclick="shareLink()" class="w-full py-4 bg-blue-600 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-blue-700 transition">
                Copy Full Referral Link
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="stat-card p-6 rounded-3xl text-center">
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Active Referrals</p>
                <h3 id="referralCount" class="text-3xl font-black mt-2">0</h3>
            </div>
            <div class="stat-card p-6 rounded-3xl text-center border-green-500/20">
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Withdrawable</p>
                <h3 id="referralEarnings" class="text-3xl font-black mt-2 text-green-500">₦0</h3>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-[2rem] space-y-4">
            <div class="withdraw-note p-4 rounded-xl">
                <p class="text-[9px] font-bold text-amber-500 uppercase leading-relaxed">
                    <i class="fas fa-circle-info mr-1"></i> Policy Note:
                    <br>Minimum withdrawal: <span class="text-white">₦2,000</span>.
                    <br>Processing fee: <span class="text-white">₦500</span> per request.
                </p>
            </div>
            
            <button id="withdrawBtn" disabled class="w-full py-4 bg-gray-800 text-gray-500 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all">
                Insufficient Balance
            </button>
        </div>

        <div class="space-y-4">
            <h4 class="text-[10px] font-black uppercase tracking-[0.3em] text-gray-500 px-2">Referral Network</h4>
            <div id="referralList" class="space-y-3">
                <div class="text-center py-10 text-gray-600 text-[10px] font-bold uppercase tracking-widest">Scanning...</div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
        authDomain: "competentraders-2efdc.firebaseapp.com",
        projectId: "competentraders-2efdc",
        storageBucket: "competentraders-2efdc.firebasestorage.app",
        messagingSenderId: "150379227882",
        appId: "1:150379227882:web:19d9c19805ef68b016c593"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userDetails = null;
    let currentBalance = 0;

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                userDetails = userDoc.data();
                document.getElementById('referralCode').innerText = userDetails.referralId;
                
                // Fetch only 'active' referrals (optional: you only pay for active ones)
                const q = query(collection(db, "users"), where("referredBy", "==", userDetails.referralId));
                const querySnapshot = await getDocs(q);
                
                const count = querySnapshot.size;
                currentBalance = count * 1000; // Assuming 1k per person
                
                document.getElementById('referralCount').innerText = count;
                document.getElementById('referralEarnings').innerText = `₦${currentBalance}`;

                // Handle Withdraw Button Logic
                const wBtn = document.getElementById('withdrawBtn');
                if (currentBalance >= 2000) {
                    wBtn.disabled = false;
                    wBtn.innerText = "Request Withdrawal";
                    wBtn.className = "w-full py-4 bg-green-600 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-green-700 shadow-lg shadow-green-600/20 transition-all";
                    wBtn.onclick = handleWithdraw;
                }

                // List Referrals
                if (!querySnapshot.empty) {
                    const listHtml = [];
                    querySnapshot.forEach((doc) => {
                        const s = doc.data();
                        listHtml.push(`
                            <div class="glass-panel p-4 rounded-2xl flex justify-between items-center border-l-4 ${s.accountStatus === 'active' ? 'border-green-500' : 'border-amber-500'}">
                                <div>
                                    <p class="text-[11px] font-bold">${s.fullName}</p>
                                    <p class="text-[8px] text-gray-500 uppercase font-black">${s.accountStatus}</p>
                                </div>
                                <span class="text-[9px] font-black text-gray-400">${s.registrationDate.split('T')[0]}</span>
                            </div>
                        `);
                    });
                    document.getElementById('referralList').innerHTML = listHtml.join('');
                } else {
                    document.getElementById('referralList').innerHTML = `<div class="text-center py-10 text-gray-600 text-[10px] font-bold uppercase tracking-widest">No Referrals Recorded</div>`;
                }
            }
        } else {
            window.location.href = "login.html";
        }
    });

    function handleWithdraw() {
        const netAmount = currentBalance - 500;
        const waNumber = "2349153258628";
        const msg = `Hello Admin, I want to withdraw my Referral Earnings.%0A%0AName: ${userDetails.fullName}%0AUsername: ${userDetails.username}%0ABalance: ₦${currentBalance}%0AAfter Fee (₦500): ₦${netAmount}%0A%0APlease provide bank details form.`;
        
        if(confirm(`Confirm Withdrawal Request?\nTotal: ₦${currentBalance}\nFee: ₦500\nYou will receive: ₦${netAmount}`)) {
            window.location.href = `https://wa.me/${waNumber}?text=${msg}`;
        }
    }

    window.copyCode = () => {
        const code = document.getElementById('referralCode').innerText;
        navigator.clipboard.writeText(code);
        alert("Code Copied!");
    };

    window.shareLink = () => {
        const code = document.getElementById('referralCode').innerText;
        const link = `https://competentraders.vercel.app/register.html?ref=${code}`;
        navigator.clipboard.writeText(link);
        alert("Link Copied to Clipboard!");
    };
</script>
</body>
</html>
