<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT MASTER ADMIN | CONTROL CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        :root { --cpt-gold: #d4af37; }
        body { font-family: 'Outfit', sans-serif; background: #000; color: white; margin: 0; }
        
        .cpt-panel { 
            background: #0a0b10; 
            border: 1px solid rgba(212, 175, 55, 0.1); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .cpt-input { 
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05); 
            outline: none; 
            transition: 0.3s ease; 
            color: white; 
        }

        .cpt-input:focus { 
            border-color: var(--cpt-gold); 
            background: rgba(212, 175, 55, 0.03); 
        }
        
        #cpt-toast {
            visibility: hidden; min-width: 300px; background: var(--cpt-gold); color: #000;
            text-align: center; border-radius: 12px; padding: 20px; position: fixed;
            z-index: 10000; left: 50%; bottom: 40px; transform: translateX(-50%);
            font-weight: 900; text-transform: uppercase; font-size: 11px;
            letter-spacing: 1px;
        }
        #cpt-toast.show { visibility: visible; animation: slideUp 0.5s forwards; }
        @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 40px; opacity: 1; } }

        .btn-deploy { 
            background: linear-gradient(to right, #996515, #d4af37); 
            transition: 0.4s; 
            box-shadow: 0 10px 20px rgba(153, 101, 21, 0.2);
        }
        .btn-deploy:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-deploy:active { transform: translateY(0); }

        .node-card { 
            background: rgba(255,255,255,0.02); 
            border: 1px solid rgba(255,255,255,0.05); 
            transition: 0.3s ease; 
        }
        .node-card:hover { 
            background: rgba(255,255,255,0.04);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            transition: 0.3s;
        }
        .delete-btn:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body class="p-6 md:p-12 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-black to-black min-h-screen">

    <div id="cpt-toast"></div>

    <div class="max-w-4xl mx-auto space-y-12">
        
        <div class="cpt-panel rounded-[40px] overflow-hidden">
            <div class="h-1.5 w-full bg-gradient-to-right from-yellow-800 via-yellow-500 to-yellow-800"></div>
            <div class="p-8 md:p-14">
                <div class="flex items-center justify-between mb-12">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 rounded-2xl bg-yellow-600/10 flex items-center justify-center text-yellow-600 border border-yellow-600/20">
                            <i class="fas fa-layer-group text-xl"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl font-black uppercase tracking-tighter">CPT VIP <span class="text-yellow-600">COMMAND</span></h1>
                            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-[0.4em]">Master Deployment Interface</p>
                        </div>
                    </div>
                    <div class="hidden md:block text-right">
                        <p class="text-[10px] font-black text-green-500 uppercase tracking-widest">Server: Online</p>
                        <p class="text-[9px] font-bold text-gray-600 uppercase">Secure CPT Node</p>
                    </div>
                </div>

                <form id="vipForm" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 ml-2 uppercase">Category</label>
                        <input type="text" id="cat" placeholder="e.g. PREMIUM TRADING" class="cpt-input w-full p-5 rounded-2xl text-[11px] font-bold" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 ml-2 uppercase">Plan Name</label>
                        <input type="text" id="name" placeholder="e.g. CPT DIAMOND" class="cpt-input w-full p-5 rounded-2xl text-[11px] font-bold" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 ml-2 uppercase">Investment (₦)</label>
                        <input type="number" id="amt" placeholder="50000" class="cpt-input w-full p-5 rounded-2xl text-[11px] font-bold" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 ml-2 uppercase">Duration</label>
                        <input type="text" id="dur" placeholder="e.g. 7 DAYS" class="cpt-input w-full p-5 rounded-2xl text-[11px] font-bold" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 ml-2 uppercase">ROI Payout (₦)</label>
                        <input type="number" id="roi" placeholder="120000" class="cpt-input w-full p-5 rounded-2xl text-[11px] font-bold" required>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] font-black text-gray-500 ml-2 uppercase">Guarantee Status</label>
                        <input type="text" id="guar" placeholder="e.g. 100% SECURED" class="cpt-input w-full p-5 rounded-2xl text-[11px] font-bold" required>
                    </div>
                    <button type="submit" id="btn" class="md:col-span-2 py-6 mt-4 btn-deploy text-black font-black uppercase text-xs tracking-[0.3em] rounded-2xl flex items-center justify-center gap-3">
                        <i class="fas fa-bolt"></i> DEPLOY TO CLIENT TERMINALS
                    </button>
                </form>
            </div>
        </div>

        <div>
            <div class="flex items-center justify-between mb-8 px-6">
                <div>
                    <h2 class="text-sm font-black uppercase tracking-[0.3em] text-white">Live Terminal Nodes</h2>
                    <p class="text-[9px] text-gray-600 font-bold uppercase mt-1">Real-time database synchronization</p>
                </div>
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    <span class="text-[10px] text-green-500 font-black uppercase tracking-widest">Active</span>
                </div>
            </div>
            
            <div id="live-nodes" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="p-12 text-center col-span-2 text-gray-700 font-black uppercase text-[10px] tracking-widest bg-zinc-900/20 border border-white/5 rounded-[30px]">
                    Syncing CPT Cloud...
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const toast = document.getElementById("cpt-toast");
        const showToast = (msg) => {
            toast.innerText = msg; toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        };

        // --- MASTER LIVE SYNC ---
        // This ensures what you see here is EXACTLY what is on the vip.html page
        onSnapshot(query(collection(db, "vip_plans"), orderBy("createdAt", "desc")), (snap) => {
            const container = document.getElementById('live-nodes');
            container.innerHTML = "";
            
            if(snap.empty) {
                container.innerHTML = `
                <div class="col-span-2 p-16 text-center border border-dashed border-white/10 rounded-[40px] text-gray-600 font-black uppercase text-[10px] tracking-[0.4em]">
                    Empty Terminal: No Nodes Deployed
                </div>`;
                return;
            }

            snap.forEach(d => {
                const p = d.data();
                container.innerHTML += `
                    <div class="node-card p-8 rounded-[30px] flex justify-between items-center group animate-in fade-in duration-500">
                        <div class="space-y-2">
                            <p class="text-[9px] font-black text-yellow-600 uppercase tracking-widest">${p.category}</p>
                            <h3 class="text-lg font-black uppercase italic tracking-tighter text-white">${p.planName}</h3>
                            <div class="flex gap-3 items-center">
                                <span class="text-[10px] text-gray-400 font-bold uppercase">₦${p.amount.toLocaleString()}</span>
                                <span class="text-[8px] text-zinc-700">•</span>
                                <span class="text-[10px] text-gray-400 font-bold uppercase">${p.duration}</span>
                            </div>
                        </div>
                        <button onclick="deleteNode('${d.id}')" class="delete-btn w-12 h-12 rounded-2xl flex items-center justify-center">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    </div>
                `;
            });
        });

        // --- MASTER DELETE LOGIC ---
        // Clicking this wipes it from Firebase and kills the plan on the user's phone instantly
        window.deleteNode = async (id) => {
            if(confirm("TERMINATE CPT NODE?\nThis action will instantly remove the plan from all client terminals.")) {
                try {
                    await deleteDoc(doc(db, "vip_plans", id));
                    showToast("CPT NODE TERMINATED");
                } catch (e) { 
                    showToast("TERMINATION FAILED"); 
                    console.error(e);
                }
            }
        };

        // --- MASTER DEPLOY LOGIC ---
        document.getElementById('vipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> SYNCING TO CLOUD...`;
            
            try {
                await addDoc(collection(db, "vip_plans"), {
                    category: document.getElementById('cat').value.toUpperCase(),
                    planName: document.getElementById('name').value.toUpperCase(),
                    amount: Number(document.getElementById('amt').value),
                    duration: document.getElementById('dur').value.toUpperCase(),
                    roi: Number(document.getElementById('roi').value),
                    guarantee: document.getElementById('guar').value.toUpperCase(),
                    createdAt: serverTimestamp()
                });
                showToast("CPT NODE DEPLOYED SUCCESSFULLY");
                e.target.reset();
            } catch (err) { 
                showToast("DEPLOYMENT ERROR"); 
                console.error(err);
            } finally { 
                btn.disabled = false; 
                btn.innerHTML = originalContent;
            }
        });
    </script>
</body>
</html>
