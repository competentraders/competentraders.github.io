<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT VIP | MASTER CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        body { background: #06070a; color: white; font-family: 'Outfit', sans-serif; }
        .input-field { background: #111; border: 1px solid #333; padding: 12px; border-radius: 12px; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #d4af37; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        #custom-toast { 
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: #d4af37; color: black; padding: 12px 30px; border-radius: 50px;
            font-weight: 900; text-transform: uppercase; font-size: 10px; letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3); z-index: 9999;
            transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        #custom-toast.show { top: 30px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="custom-toast">CPT Node Deployed</div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10">
        
        <div class="glass p-8 rounded-[32px] h-fit sticky top-10">
            <h1 class="text-2xl font-black uppercase mb-2 text-yellow-600">Deploy VIP Node</h1>
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-8">Node Command Center</p>
            
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Category</label>
                        <input type="text" id="cat" placeholder="e.g. PREMIUM" class="input-field mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Plan Name</label>
                        <input type="text" id="name" placeholder="e.g. CPT DIAMOND" class="input-field mt-1">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Investment (₦)</label>
                        <input type="number" id="amt" placeholder="50000" class="input-field mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">ROI Payout (₦)</label>
                        <input type="number" id="roi" placeholder="120000" class="input-field mt-1">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Duration</label>
                        <input type="text" id="dur" placeholder="7 Days" class="input-field mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Guarantee</label>
                        <input type="text" id="guar" placeholder="100% Secured" class="input-field mt-1">
                    </div>
                </div>

                <button onclick="deployNode()" id="post-btn" class="w-full bg-yellow-600 py-4 rounded-xl font-black text-black uppercase text-xs tracking-[0.2em] hover:bg-yellow-500 transition-all active:scale-95">Deploy to Terminals</button>
            </div>
        </div>

        <div class="glass p-8 rounded-[32px]">
            <h2 class="text-xl font-black uppercase mb-6 flex items-center gap-3">
                <i class="fas fa-microchip text-yellow-600"></i> Active Terminal Nodes
            </h2>
            <div id="admin-list" class="space-y-4 max-h-[700px] overflow-y-auto pr-2 no-scrollbar">
                <p class="text-gray-600 text-xs italic text-center">Syncing CPT Nodes...</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showToast(msg) {
            const t = document.getElementById('custom-toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.deployNode = async () => {
            const cat = document.getElementById('cat').value.toUpperCase();
            const name = document.getElementById('name').value.toUpperCase();
            const amt = Number(document.getElementById('amt').value);
            const roi = Number(document.getElementById('roi').value);
            const dur = document.getElementById('dur').value.toUpperCase();
            const guar = document.getElementById('guar').value.toUpperCase();

            if(!amt || !name) return showToast("Missing Plan Data!");

            try {
                await addDoc(collection(db, "vip_plans"), {
                    category: cat, planName: name, amount: amt,
                    roi: roi, duration: dur, guarantee: guar,
                    createdAt: serverTimestamp()
                });
                // Reset fields
                document.getElementById('cat').value = "";
                document.getElementById('name').value = "";
                document.getElementById('amt').value = "";
                document.getElementById('roi').value = "";
                document.getElementById('dur').value = "";
                document.getElementById('guar').value = "";
                showToast("CPT Node Online!");
            } catch (e) { showToast("Deployment Error"); }
        };

        // Real-Time List Monitoring
        const q = query(collection(db, "vip_plans"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('admin-list');
            list.innerHTML = "";
            if(snapshot.empty) {
                list.innerHTML = `<p class="text-gray-700 text-[10px] font-black uppercase text-center py-20">No Active Terminal Nodes</p>`;
            }
            snapshot.forEach((planDoc) => {
                const p = planDoc.data();
                const id = planDoc.id;
                const item = document.createElement('div');
                item.className = `p-5 bg-white/5 rounded-2xl border border-white/5 space-y-3`;
                item.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[9px] font-black uppercase text-yellow-600 tracking-widest">${p.category}</span>
                            <h3 class="text-sm font-black uppercase italic text-white mt-1">${p.planName}</h3>
                        </div>
                        <button onclick="deletePlan('${id}')" class="text-gray-700 hover:text-red-500 transition-colors"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div class="flex justify-between items-center text-[10px] font-bold text-gray-500 border-t border-white/5 pt-3">
                        <span>₦${p.amount.toLocaleString()}</span>
                        <span>${p.duration}</span>
                        <span class="text-green-500 font-black italic">₦${p.roi.toLocaleString()}</span>
                    </div>`;
                list.appendChild(item);
            });
        });

        window.deletePlan = async (id) => { 
            if(confirm("Terminate this CPT Node? It will vanish from all user terminals.")) { 
                await deleteDoc(doc(db, "vip_plans", id)); 
                showToast("Node Terminated"); 
            } 
        };
    </script>
</body>
</html>
