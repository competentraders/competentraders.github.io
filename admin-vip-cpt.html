<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT ADMIN | MASTER CONTROL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #000; color: white; }
        .cpt-panel { background: #0a0b10; border: 1px solid rgba(212, 175, 55, 0.1); }
        .cpt-input { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); outline: none; color: white; }
        .cpt-input:focus { border-color: #d4af37; }
        .btn-deploy { background: linear-gradient(to right, #996515, #d4af37); }
        #toast {
            visibility: hidden; min-width: 250px; background: #d4af37; color: #000;
            text-align: center; border-radius: 12px; padding: 16px; position: fixed;
            left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: 900;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
    </style>
</head>
<body class="p-6">
    <div id="toast">ACTION SUCCESSFUL</div>

    <div class="max-w-4xl mx-auto space-y-10">
        <div class="cpt-panel rounded-[30px] p-8">
            <h1 class="text-xl font-black uppercase text-yellow-600 mb-8">Deploy New VIP Node</h1>
            <form id="vipForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="cat" placeholder="CATEGORY" class="cpt-input p-4 rounded-xl text-xs font-bold" required>
                <input type="text" id="name" placeholder="PLAN NAME" class="cpt-input p-4 rounded-xl text-xs font-bold" required>
                <input type="number" id="amt" placeholder="AMOUNT (₦)" class="cpt-input p-4 rounded-xl text-xs font-bold" required>
                <input type="text" id="dur" placeholder="DURATION" class="cpt-input p-4 rounded-xl text-xs font-bold" required>
                <input type="number" id="roi" placeholder="ROI PAYOUT (₦)" class="cpt-input p-4 rounded-xl text-xs font-bold" required>
                <input type="text" id="guar" placeholder="GUARANTEE %" class="cpt-input p-4 rounded-xl text-xs font-bold" required>
                <button type="submit" id="btn" class="md:col-span-2 py-4 btn-deploy text-black font-black uppercase text-xs rounded-xl">Add to VIP Terminal</button>
            </form>
        </div>

        <div>
            <h2 class="text-xs font-black uppercase tracking-widest text-gray-500 mb-4 px-2">Manage Live Plans</h2>
            <div id="admin-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. LIST PLANS WITH DELETE BUTTON
        onSnapshot(query(collection(db, "vip_plans"), orderBy("createdAt", "desc")), (snap) => {
            const list = document.getElementById('admin-list');
            list.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                list.innerHTML += `
                    <div class="p-6 bg-zinc-900/50 border border-white/5 rounded-2xl flex justify-between items-center">
                        <div>
                            <p class="text-[10px] text-yellow-600 font-black mb-1">${p.category}</p>
                            <h3 class="text-sm font-black uppercase">${p.planName}</h3>
                            <p class="text-[10px] text-gray-500">₦${p.amount.toLocaleString()}</p>
                        </div>
                        <button onclick="removePlan('${d.id}')" class="w-10 h-10 bg-red-500/10 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });
        });

        // 2. DELETE FUNCTION
        window.removePlan = async (id) => {
            if(confirm("Delete this plan? It will vanish from the VIP page too.")) {
                await deleteDoc(doc(db, "vip_plans", id));
                const t = document.getElementById("toast");
                t.className = "show"; setTimeout(() => t.className = "", 3000);
            }
        };

        // 3. ADD FUNCTION
        document.getElementById('vipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "vip_plans"), {
                category: document.getElementById('cat').value.toUpperCase(),
                planName: document.getElementById('name').value.toUpperCase(),
                amount: Number(document.getElementById('amt').value),
                duration: document.getElementById('dur').value.toUpperCase(),
                roi: Number(document.getElementById('roi').value),
                guarantee: document.getElementById('guar').value.toUpperCase(),
                createdAt: serverTimestamp()
            });
            e.target.reset();
        });
    </script>
</body>
</html>
