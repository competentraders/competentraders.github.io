<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Terminal | VIP Deployment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: white; font-family: 'Outfit', sans-serif; }
        .glass-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); outline: none; }
        #toast {
            visibility: hidden; min-width: 250px; background: #d4af37; color: #000;
            text-align: center; border-radius: 50px; padding: 16px; position: fixed;
            left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: 900; font-size: 10px;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="p-10">
    <div id="toast">VIP NODE DEPLOYED</div>
    <div class="max-w-xl mx-auto bg-[#0f111a] p-10 rounded-[40px] border border-white/5">
        <h1 class="text-xl font-black uppercase text-yellow-600 mb-8 tracking-widest">VIP Command Center</h1>
        <form id="vipForm" class="space-y-4">
            <input type="text" id="cat" placeholder="Category" class="glass-input w-full p-4 rounded-2xl" required>
            <input type="text" id="name" placeholder="Plan Name" class="glass-input w-full p-4 rounded-2xl" required>
            <input type="number" id="amt" placeholder="Amount" class="glass-input w-full p-4 rounded-2xl" required>
            <input type="text" id="dur" placeholder="Duration" class="glass-input w-full p-4 rounded-2xl" required>
            <input type="number" id="roi" placeholder="ROI Payout" class="glass-input w-full p-4 rounded-2xl" required>
            <input type="text" id="guar" placeholder="Guarantee" class="glass-input w-full p-4 rounded-2xl" required>
            <button type="submit" id="btn" class="w-full py-5 bg-yellow-600 text-black font-black uppercase text-xs rounded-2xl">Deploy Node</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('vipForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.disabled = true;
            try {
                await addDoc(collection(db, "vip_plans"), {
                    category: document.getElementById('cat').value,
                    planName: document.getElementById('name').value,
                    amount: Number(document.getElementById('amt').value),
                    duration: document.getElementById('dur').value,
                    roi: Number(document.getElementById('roi').value),
                    guarantee: document.getElementById('guar').value,
                    createdAt: serverTimestamp()
                });
                const t = document.getElementById("toast");
                t.className = "show";
                setTimeout(() => t.className = "", 3000);
                e.target.reset();
            } catch (err) { console.error(err); } finally { btn.disabled = false; }
        });
    </script>
</body>
</html>
