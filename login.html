<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Competentraders Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        :root { --bg: #06070a; --card: rgba(15, 18, 24, 0.8); --text: white; }
        .light-mode { --bg: #f8fafc; --card: white; --text: #0f172a; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; }
        .glass-panel { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-group { background: rgba(120, 120, 120, 0.05); border: 1px solid rgba(120, 120, 120, 0.1); transition: all 0.3s ease; }
        .input-group:focus-within { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.1); }
        .error-shake { animation: shake 0.4s ease-in-out; border-color: #ef4444 !important; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6" id="bodyTag">

    <div class="w-full max-w-md">
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fas fa-shield-halved text-white text-lg"></i>
                </div>
                <span class="text-2xl font-black uppercase tracking-tighter">Competent<span class="text-blue-500">raders</span></span>
            </div>
            <button onclick="document.getElementById('bodyTag').classList.toggle('light-mode')" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-blue-500 border border-blue-500/20">
                <i class="fas fa-circle-half-stroke"></i>
            </button>
        </div>

        <div id="login-container" class="glass-panel p-8 rounded-[32px] relative overflow-hidden">
            <div id="error-msg" class="hidden mb-6 p-4 bg-red-500/10 border border-red-500/50 rounded-xl flex items-center gap-3 text-red-500 text-[10px] font-bold uppercase">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Authentication Failed</span>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-6">
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 block">Username or Email</label>
                    <div class="input-group flex items-center px-4 rounded-xl">
                        <i class="fas fa-user-circle text-blue-500 mr-3 text-sm"></i>
                        <input type="text" id="login_user" required class="bg-transparent outline-none w-full py-4 text-sm" placeholder="Enter credentials">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 block">Access Password</label>
                    <div class="input-group flex items-center px-4 rounded-xl">
                        <i class="fas fa-lock text-blue-500 mr-3 text-sm"></i>
                        <input type="password" id="login_pass" required class="bg-transparent outline-none w-full py-4 text-sm" placeholder="••••••••">
                        <i class="fas fa-eye text-gray-500 cursor-pointer hover:text-blue-500 transition" onclick="togglePass()"></i>
                    </div>
                </div>

                <div class="flex justify-between items-center px-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-gray-500 bg-transparent checked:bg-blue-600">
                        <span class="text-[10px] text-gray-500 font-bold uppercase">Keep me logged in</span>
                    </label>
                    <a href="forgot-password.html" class="text-[10px] text-blue-500 font-bold uppercase hover:underline">Forgot Your Password?</a>
                </div>

                <button type="submit" id="loginBtn" class="w-full py-5 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl font-black text-xs tracking-[0.2em] shadow-xl shadow-blue-600/20 transition-all uppercase">
                    proceed to login
                </button>
            </form>

            <div class="mt-8 text-center pt-6 border-t border-white/5">
                <p class="text-[10px] text-gray-600 uppercase font-bold tracking-widest">
                    Not yet registered? <a href="register.html" class="text-blue-500 hover:underline">Create Your Account....</a>
                </p>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
        authDomain: "competentraders-2efdc.firebaseapp.com",
        projectId: "competentraders-2efdc",
        storageBucket: "competentraders-2efdc.firebasestorage.app",
        messagingSenderId: "150379227882",
        appId: "1:150379227882:web:19d9c19805ef68b016c593"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.togglePass = () => {
        const p = document.getElementById('login_pass');
        p.type = p.type === 'password' ? 'text' : 'password';
    };

    window.handleLogin = async function(e) {
        e.preventDefault();
        
        let identifier = document.getElementById('login_user').value.trim();
        const pass = document.getElementById('login_pass').value;
        const remember = document.getElementById('rememberMe').checked;
        const btn = document.getElementById('loginBtn');
        const errorBox = document.getElementById('error-msg');
        const container = document.getElementById('login-container');

        errorBox.classList.add('hidden');
        btn.innerText = "AUTHENTICATING...";
        btn.disabled = true;

        try {
            let finalEmail = identifier;
            // Username logic
            if (!identifier.includes('@')) {
                const q = query(collection(db, "users"), where("username", "==", identifier));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) throw { code: 'auth/user-not-found' };
                querySnapshot.forEach((doc) => { finalEmail = doc.data().email; });
            }

            await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);

            // AUTHENTICATION
            const userCredential = await signInWithEmailAndPassword(auth, finalEmail, pass);
            const user = userCredential.user;

            // DATABASE GATE
            const userDoc = await getDoc(doc(db, "users", user.uid));
            
            if (userDoc.exists()) {
                const userData = userDoc.data();
                if (userData.accountStatus === "active") {
                    btn.innerText = "ACCESS GRANTED";
                    // Change this to your exact dashboard filename if different
                    setTimeout(() => { window.location.href = "user-dashboard.html"; }, 800);
                } else {
                    await signOut(auth);
                    throw { code: 'custom/pending-activation' };
                }
            } else {
                // User in Auth but not in Firestore
                await signOut(auth);
                throw { code: 'custom/record-not-found' };
            }

        } catch (error) {
            console.error("Login Error:", error.code);
            let message = "Security Check Failed: Invalid Credentials.";
            
            if (error.code === 'auth/user-not-found') message = "Account ID not recognized.";
            if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') message = "Authentication failed: Wrong password.";
            if (error.code === 'custom/pending-activation') message = "Account Pending Activation. Contact Admin on WhatsApp.";
            if (error.code === 'custom/record-not-found') message = "Profile data missing. Please re-register.";
            
            errorBox.querySelector('span').innerText = message;
            errorBox.classList.remove('hidden');
            container.classList.add('error-shake');
            setTimeout(() => container.classList.remove('error-shake'), 400);
            
            btn.innerText = "PROCEED TO LOGIN";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
