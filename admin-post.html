<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competentraders | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap');
        body { background: #06070a; color: white; font-family: 'Outfit', sans-serif; }
        .input-field { background: #111; border: 1px solid #333; padding: 12px; border-radius: 12px; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #3b82f6; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10">
        
        <div class="glass p-8 rounded-[32px] h-fit sticky top-10">
            <h1 class="text-2xl font-black uppercase mb-2 text-blue-500 text-center lg:text-left">Post Tip</h1>
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-8 text-center lg:text-left">Live Admin Control</p>
            
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Home Team</label>
                        <select id="home-select" class="input-field mt-1">
                            <optgroup label="Premier League (England)">
                                <option value="Arsenal|2750">Arsenal</option>
                                <option value="Aston Villa|2801">Aston Villa</option>
                                <option value="Bournemouth|60">Bournemouth</option>
                                <option value="Brentford|50">Brentford</option>
                                <option value="Brighton|30">Brighton</option>
                                <option value="Chelsea|2635">Chelsea</option>
                                <option value="Crystal Palace|7">Crystal Palace</option>
                                <option value="Everton|2688">Everton</option>
                                <option value="Fulham|31">Fulham</option>
                                <option value="Ipswich|36">Ipswich</option>
                                <option value="Leicester|23">Leicester</option>
                                <option value="Liverpool|2674">Liverpool</option>
                                <option value="Man City|17">Man City</option>
                                <option value="Man Utd|35">Man Utd</option>
                                <option value="Newcastle|39">Newcastle</option>
                                <option value="Nottm Forest|14">Nottm Forest</option>
                                <option value="Southampton|26">Southampton</option>
                                <option value="Tottenham|33">Tottenham</option>
                                <option value="West Ham|37">West Ham</option>
                                <option value="Wolves|3">Wolves</option>
                            </optgroup>
                            <optgroup label="La Liga (Spain)">
                                <option value="Real Madrid|2829">Real Madrid</option>
                                <option value="Barcelona|2817">Barcelona</option>
                                <option value="Atletico Madrid|2836">Atletico Madrid</option>
                                <option value="Girona|24264">Girona</option>
                                <option value="Real Sociedad|2824">Real Sociedad</option>
                                <option value="Villarreal|2819">Villarreal</option>
                                <option value="Sevilla|2833">Sevilla</option>
                            </optgroup>
                            <optgroup label="Bundesliga (Germany)">
                                <option value="Bayern Munich|2672">Bayern Munich</option>
                                <option value="Bayer Leverkusen|2681">Bayer Leverkusen</option>
                                <option value="Dortmund|2673">Dortmund</option>
                                <option value="RB Leipzig|36360">RB Leipzig</option>
                            </optgroup>
                            <optgroup label="Serie A (Italy)">
                                <option value="Inter Milan|2697">Inter Milan</option>
                                <option value="AC Milan|2692">AC Milan</option>
                                <option value="Juventus|2687">Juventus</option>
                                <option value="Napoli|2714">Napoli</option>
                            </optgroup>
                            <optgroup label="Ligue 1 (France)">
                                <option value="PSG|1644">PSG</option>
                                <option value="Monaco|1654">Monaco</option>
                                <option value="Marseille|1641">Marseille</option>
                            </optgroup>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Away Team</label>
                        <select id="away-select" class="input-field mt-1">
                            <option value="Man City|17">Man City</option>
                            <option value="Real Madrid|2829">Real Madrid</option>
                            <option value="Arsenal|2750">Arsenal</option>
                            <option value="Barcelona|2817">Barcelona</option>
                            <option value="Liverpool|2674">Liverpool</option>
                            <option value="Bayern Munich|2672">Bayern Munich</option>
                            <option value="PSG|1644">PSG</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold uppercase text-gray-500 ml-1">Prediction Value</label>
                    <input type="text" id="pred-val" placeholder="e.g. Over 2.5 Goals" class="input-field mt-1">
                </div>

                <button onclick="uploadGame()" id="post-btn" class="w-full bg-blue-600 py-4 rounded-xl font-black uppercase text-xs tracking-[0.2em] hover:bg-blue-700 transition-all active:scale-95">Publish Live Tip</button>
            </div>
        </div>

        <div class="glass p-8 rounded-[32px]">
            <h2 class="text-xl font-black uppercase mb-6 flex items-center gap-3">
                <i class="fas fa-list-ul text-blue-500"></i> Active Board
            </h2>
            <div id="admin-list" class="space-y-4 max-h-[700px] overflow-y-auto pr-2 no-scrollbar">
                <p class="text-gray-600 text-xs italic">Syncing with database...</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- POST GAME ---
        window.uploadGame = async () => {
            const btn = document.getElementById('post-btn');
            const home = document.getElementById('home-select').value.split('|');
            const away = document.getElementById('away-select').value.split('|');
            const pred = document.getElementById('pred-val').value;

            if(!pred) return alert("Please enter a prediction!");

            btn.disabled = true;
            btn.innerText = "PUBLISHING...";

            try {
                await addDoc(collection(db, "predictions"), {
                    homeName: home[0],
                    homeId: home[1],
                    awayName: away[0],
                    awayId: away[1],
                    mainPrediction: pred,
                    status: "pending", 
                    timestamp: serverTimestamp()
                });
                document.getElementById('pred-val').value = "";
                btn.disabled = false;
                btn.innerText = "PUBLISH LIVE TIP";
            } catch (e) { 
                alert("Error: " + e.message); 
                btn.disabled = false;
                btn.innerText = "PUBLISH LIVE TIP";
            }
        };

        // --- MANAGE LIST (History & Deletion) ---
        const q = query(collection(db, "predictions"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const list = document.getElementById('admin-list');
            list.innerHTML = "";
            
            if (snapshot.empty) {
                list.innerHTML = `<p class="text-gray-600 text-xs font-bold uppercase">No games currently active.</p>`;
                return;
            }

            snapshot.forEach((gameDoc) => {
                const game = gameDoc.data();
                const id = gameDoc.id;
                
                const item = document.createElement('div');
                item.className = `p-4 bg-white/5 rounded-2xl border ${game.status === 'won' ? 'border-green-500/20' : game.status === 'lost' ? 'border-red-500/20' : 'border-white/5'} space-y-3`;
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-[9px] font-black uppercase px-2 py-1 rounded bg-white/5 ${game.status === 'won' ? 'text-green-500' : game.status === 'lost' ? 'text-red-500' : 'text-blue-500'}">
                            ${game.status}
                        </span>
                        <button onclick="deleteGame('${id}')" class="text-gray-700 hover:text-red-500 transition-colors">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                    <div>
                        <p class="text-[11px] font-black uppercase text-white">${game.homeName} vs ${game.awayName}</p>
                        <p class="text-[10px] font-bold text-gray-500 uppercase mt-1">Pick: ${game.mainPrediction}</p>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="updateStatus('${id}', 'won')" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-[9px] font-black uppercase transition-all">Mark Won</button>
                        <button onclick="updateStatus('${id}', 'lost')" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-[9px] font-black uppercase transition-all">Mark Lost</button>
                    </div>
                `;
                list.appendChild(item);
            });
        });

        // --- GLOBAL ACTIONS ---
        window.deleteGame = async (id) => {
            if(confirm("Permanently delete this prediction?")) {
                await deleteDoc(doc(db, "predictions", id));
            }
        };

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "predictions", id), { status: status });
        };
    </script>
</body>
</html>
