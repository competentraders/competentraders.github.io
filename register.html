<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #06070a; color: white; margin: 0; }
        .input-field { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; width: 100%; padding: 12px;
            border-radius: 12px; font-size: 14px; outline: none;
        }
        .input-field:focus { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .label-text { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .glass-panel { background: rgba(15, 18, 24, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* THE BIRD MODAL SYSTEM */
        #bird-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); 
            z-index: 10000; display: none; align-items: center; justify-content: center;
            padding: 20px; backdrop-filter: blur(15px);
        }
        .bird-box {
            background: #0b0d12; border: 1px solid #3b82f6; 
            padding: 40px 25px; text-align: center;
            width: 100%; max-width: 360px; border-radius: 40px;
        }
        
        /* Status helpers */
        .error-msg { font-size: 10px; color: #ef4444; margin-top: 4px; font-weight: bold; display: none; }
        .requirement { font-size: 10px; color: #64748b; }
        .requirement.met { color: #22c55e; }
        .relative-box { position: relative; }
        .eye-icon { position: absolute; right: 12px; top: 38px; cursor: pointer; color: #64748b; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="bird-overlay">
        <div class="bird-box">
            <div class="text-7xl mb-4 animate-bounce">🕊️</div>
            <h3 class="text-2xl font-black italic uppercase mb-2">Account Created</h3>
            <p class="text-gray-500 text-[10px] font-black uppercase mb-6 tracking-widest leading-relaxed">
                Security clearance granted. Your trading terminal is ready.
            </p>
            <button onclick="window.location.href='login.html'" class="w-full py-4 bg-blue-600 rounded-2xl font-black text-[10px] uppercase shadow-lg shadow-blue-900/40">
                Proceed to Login
            </button>
        </div>
    </div>

    <div class="max-w-xl mx-auto">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-user-plus text-white text-sm"></i>
                </div>
                <span class="text-xl font-black uppercase">Competent<span class="text-blue-500">raders</span></span>
            </div>
            <h2 class="text-2xl font-bold italic">Identity Registration</h2>
        </div>

        <form onsubmit="return handleRegister(event)" class="glass-panel p-6 rounded-3xl space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-text">First Name</label>
                    <input type="text" id="f_name" class="input-field" required placeholder="John">
                </div>
                <div>
                    <label class="label-text">Last Name</label>
                    <input type="text" id="l_name" class="input-field" required placeholder="Doe">
                </div>
            </div>

            <div>
                <label class="label-text">Username</label>
                <input type="text" id="reg_user" oninput="validateUsername()" class="input-field" required placeholder="UniqueID">
                <p id="user-error" class="error-msg text-red-500">Username taken</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Email</label>
                    <input type="email" id="reg_email" oninput="validateEmail()" class="input-field" required placeholder="email@example.com">
                    <p id="email-error" class="error-msg text-red-500">Email already used</p>
                </div>
                <div>
                    <label class="label-text">Confirm Email</label>
                    <input type="email" id="reg_email_confirm" oninput="updateBtnState()" class="input-field" required placeholder="Confirm email">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative-box">
                    <label class="label-text">Password</label>
                    <input type="password" id="reg_pass" oninput="checkPassRequirements()" class="input-field" required placeholder="••••••••">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('reg_pass')"></i>
                    <div class="mt-2 space-y-1">
                        <p id="req-len" class="requirement">• 8+ Characters</p>
                        <p id="req-alp" class="requirement">• 1 Alphabet</p>
                        <p id="req-num" class="requirement">• 1 Numeric</p>
                    </div>
                </div>
                <div class="relative-box">
                    <label class="label-text">Confirm Password</label>
                    <input type="password" id="reg_pass_confirm" oninput="updateBtnState()" class="input-field" required placeholder="Confirm password">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('reg_pass_confirm')"></i>
                </div>
            </div>

            <div>
                <label class="label-text">Country of Residence</label>
                <select id="reg_country" class="input-field" required>
                    <option value="">Select Country</option>
                    <optgroup label="Africa">
                        <option value="Nigeria">Nigeria</option>
                        <option value="South Africa">South Africa</option>
                        <option value="Ghana">Ghana</option>
                        <option value="Kenya">Kenya</option>
                    </optgroup>
                    <optgroup label="International">
                        <option value="USA">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="UAE">United Arab Emirates</option>
                        <option value="Canada">Canada</option>
                        <option value="Germany">Germany</option>
                    </optgroup>
                </select>
            </div>

            <div class="bg-blue-600/5 p-4 rounded-2xl border border-blue-500/20">
                <label class="label-text text-blue-400">Security Check</label>
                <div class="flex items-center gap-4 mb-3">
                    <div id="captcha-code" class="bg-gray-800 px-4 py-2 rounded font-mono text-xl text-blue-400 italic">-----</div>
                </div>
                <div class="relative">
                    <input type="text" id="captcha-input" oninput="verifyCaptcha()" class="input-field pr-12" placeholder="Code">
                    <div id="verified-badge" class="hidden absolute right-3 top-3 text-green-500">
                        <i class="fas fa-check-circle"></i> VERIFIED
                    </div>
                </div>
            </div>

            <button id="reg-btn" disabled class="w-full py-4 bg-gray-700 text-gray-500 rounded-2xl font-black transition-all cursor-not-allowed">
                FINALIZE REGISTRATION
            </button>

        </form>
    </div>

    <script>
    let currentCaptcha = "";

    function togglePass(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
    }

    function checkPassRequirements() {
        const val = document.getElementById('reg_pass').value;
        document.getElementById('req-len').classList.toggle('met', val.length >= 8);
        document.getElementById('req-alp').classList.toggle('met', /[a-zA-Z]/.test(val));
        document.getElementById('req-num').classList.toggle('met', /[0-9]/.test(val));
        updateBtnState();
    }

    function validateUsername() {
        const user = document.getElementById('reg_user').value;
        const taken = ["admin", "competent", "ceo", "system"];
        document.getElementById('user-error').style.display = taken.includes(user.toLowerCase()) ? "block" : "none";
        updateBtnState();
    }

    function validateEmail() {
        const email = document.getElementById('reg_email').value;
        const taken = ["admin@competentraders.com", "test@gmail.com"];
        document.getElementById('email-error').style.display = taken.includes(email.toLowerCase()) ? "block" : "none";
        updateBtnState();
    }

    function generateCaptcha() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let result = "";
        for (let i = 0; i < 6; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
        currentCaptcha = result;
        document.getElementById('captcha-code').innerText = result;
        updateBtnState();
    }

    function verifyCaptcha() {
        const input = document.getElementById('captcha-input').value.toUpperCase();
        document.getElementById('verified-badge').classList.toggle('hidden', input !== currentCaptcha);
        updateBtnState();
    }

    function updateBtnState() {
        const btn = document.getElementById('reg-btn');
        const isVerified = !document.getElementById('verified-badge').classList.contains('hidden');
        const passMatch = document.getElementById('reg_pass').value === document.getElementById('reg_pass_confirm').value;
        const emailMatch = document.getElementById('reg_email').value === document.getElementById('reg_email_confirm').value;
        const requirementsMet = document.querySelectorAll('.requirement.met').length === 3;
        const userOk = document.getElementById('user-error').style.display !== "block";
        const emailOk = document.getElementById('email-error').style.display !== "block";

        if (isVerified && passMatch && emailMatch && requirementsMet && userOk && emailOk && document.getElementById('reg_user').value !== "") {
            btn.disabled = false;
            btn.className = "w-full py-4 bg-blue-600 text-white rounded-2xl font-black transition-all";
        } else {
            btn.disabled = true;
            btn.className = "w-full py-4 bg-gray-700 text-gray-500 rounded-2xl font-black cursor-not-allowed";
        }
    }

    function handleRegister(e) {
        e.preventDefault();
        
        // Save Credentials
        localStorage.setItem('competent_username', document.getElementById('reg_user').value);
        localStorage.setItem('competent_password', document.getElementById('reg_pass').value);
        localStorage.setItem('accountBalance', '0.00');

        // SHOW THE BIRD INSTEAD OF ALERT
        document.getElementById('bird-overlay').style.display = 'flex';
    }

    window.onload = generateCaptcha;
    </script>
</body>
</html>
