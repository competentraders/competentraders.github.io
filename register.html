<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #06070a; color: white; }
        .input-field { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .label-text { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .glass-panel { background: rgba(15, 18, 24, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .hidden { display: none; }
        /* Professional Validation Styles */
        .error-msg { font-size: 10px; color: #ef4444; margin-top: 4px; font-weight: bold; display: none; }
        .requirement { font-size: 10px; color: #64748b; transition: 0.3s; }
        .requirement.met { color: #22c55e; }
        .relative-box { position: relative; }
        .eye-icon { position: absolute; right: 12px; top: 38px; cursor: pointer; color: #64748b; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-xl mx-auto">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-user-plus text-white text-sm"></i>
                </div>
                <span class="text-xl font-black uppercase">Competent<span class="text-blue-500">raders</span></span>
            </div>
            <h2 class="text-2xl font-bold">Create Account</h2>
            <p class="text-gray-500 text-xs">Security Check: Level 1 Encryption Active</p>
        </div>

        <form onsubmit="return handleRegister(event)" class="glass-panel p-6 rounded-3xl space-y-5">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-text">First Name</label>
                    <input type="text" id="f_name" class="input-field" required placeholder="John">
                </div>
                <div>
                    <label class="label-text">Last Name</label>
                    <input type="text" id="l_name" class="input-field" required placeholder="Doe">
                </div>
            </div>

            <div>
                <label class="label-text">Other Name (Optional)</label>
                <input type="text" id="o_name" class="input-field" placeholder="Middle Name">
            </div>

            <div>
                <label class="label-text">Username</label>
                <input type="text" id="reg_user" oninput="validateUsername()" class="input-field" required placeholder="UniqueUsername">
                <p id="user-error" class="error-msg">This username is already taken</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Email</label>
                    <input type="email" id="reg_email" oninput="validateEmail()" class="input-field" required placeholder="email@example.com">
                    <p id="email-error" class="error-msg">Email address already in use</p>
                </div>
                <div>
                    <label class="label-text">Confirm Email</label>
                    <input type="email" id="reg_email_confirm" class="input-field" required placeholder="Confirm email">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative-box">
                    <label class="label-text">Password</label>
                    <input type="password" id="reg_pass" oninput="checkPassRequirements()" class="input-field" required placeholder="••••••••">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('reg_pass')"></i>
                    <div class="mt-2 space-y-1">
                        <p id="req-len" class="requirement">• Min 8 characters</p>
                        <p id="req-alp" class="requirement">• One Alphabet</p>
                        <p id="req-num" class="requirement">• One Numeric</p>
                    </div>
                </div>
                <div class="relative-box">
                    <label class="label-text">Confirm Password</label>
                    <input type="password" id="reg_pass_confirm" class="input-field" required placeholder="Confirm password">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('reg_pass_confirm')"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Date of Birth</label>
                    <input type="date" class="input-field" required>
                </div>
                <div>
                    <label class="label-text">Gender</label>
                    <select class="input-field">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="label-text">Nationality (International)</label>
                <select class="input-field" required>
                    <option value="">Select Country</option>
                    <optgroup label="Africa">
                        <option value="Nigeria">Nigeria</option>
                        <option value="South Africa">South Africa</option>
                        <option value="Ghana">Ghana</option>
                        <option value="Kenya">Kenya</option>
                        <option value="Egypt">Egypt</option>
                    </optgroup>
                    <optgroup label="Americas">
                        <option value="USA">United States</option>
                        <option value="Canada">Canada</option>
                        <option value="Brazil">Brazil</option>
                    </optgroup>
                    <optgroup label="Europe">
                        <option value="UK">United Kingdom</option>
                        <option value="Germany">Germany</option>
                        <option value="France">France</option>
                    </optgroup>
                    <optgroup label="Asia/Middle East">
                        <option value="UAE">United Arab Emirates</option>
                        <option value="China">China</option>
                        <option value="India">India</option>
                    </optgroup>
                </select>
            </div>

            <div class="bg-blue-600/5 p-4 rounded-2xl border border-blue-500/20">
                <label class="label-text text-blue-400">Security Check</label>
                <div class="flex items-center gap-4 mb-3">
                    <div id="captcha-code" class="bg-gray-800 px-4 py-2 rounded font-mono text-xl tracking-widest text-blue-400 italic select-none">
                        -----
                    </div>
                    <span id="timer" class="text-[10px] text-gray-500">Refreshing in 30s</span>
                </div>
                <div class="relative">
                    <input type="text" id="captcha-input" oninput="verifyCaptcha()" class="input-field pr-12" placeholder="Enter Security Code">
                    <div id="verified-badge" class="hidden absolute right-3 top-3 text-green-500">
                        <i class="fas fa-check-circle"></i> VERIFIED
                    </div>
                </div>
            </div>

            <button id="reg-btn" disabled class="w-full py-4 bg-gray-700 text-gray-500 rounded-2xl font-black transition-all cursor-not-allowed">
                FINALIZE REGISTRATION
            </button>

            <div class="flex flex-col gap-3 text-center pt-4">
                <a href="login.html" class="text-sm text-gray-400">Already registered? <span class="text-blue-500 font-bold">Login Here</span></a>
                <a href="forgot-password.html" class="text-xs text-gray-600">Forgot Password?</a>
            </div>

        </form>
    </div>

    <script>
    let currentCaptcha = "";
    let timeLeft = 30;

    // --- NEW VALIDATION LOGIC ---

    function togglePass(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
    }

    function checkPassRequirements() {
        const val = document.getElementById('reg_pass').value;
        const reqLen = document.getElementById('req-len');
        const reqAlp = document.getElementById('req-alp');
        const reqNum = document.getElementById('req-num');

        val.length >= 8 ? reqLen.classList.add('met') : reqLen.classList.remove('met');
        /[a-zA-Z]/.test(val) ? reqAlp.classList.add('met') : reqAlp.classList.remove('met');
        /[0-9]/.test(val) ? reqNum.classList.add('met') : reqNum.classList.remove('met');
        
        updateBtnState();
    }

    function validateUsername() {
        const user = document.getElementById('reg_user').value;
        const error = document.getElementById('user-error');
        // Simulated taken username for demo
        const taken = ["admin", "competent", "ceo"];
        error.style.display = taken.includes(user.toLowerCase()) ? "block" : "none";
        updateBtnState();
    }

    function validateEmail() {
        const email = document.getElementById('reg_email').value;
        const error = document.getElementById('email-error');
        // Simulated taken email
        const taken = ["test@gmail.com", "fraud@gmail.com"];
        error.style.display = taken.includes(email.toLowerCase()) ? "block" : "none";
        updateBtnState();
    }

    // --- EXISTING LOGIC UPDATED ---

    function generateCaptcha() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let result = "";
        for (let i = 0; i < 6; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        currentCaptcha = result;
        document.getElementById('captcha-code').innerText = result;
        document.getElementById('captcha-input').value = "";
        document.getElementById('verified-badge').classList.add('hidden');
        updateBtnState();
        timeLeft = 30;
    }

    function verifyCaptcha() {
        const input = document.getElementById('captcha-input').value.toUpperCase();
        const badge = document.getElementById('verified-badge');
        if (input === currentCaptcha) {
            badge.classList.remove('hidden');
        } else {
            badge.classList.add('hidden');
        }
        updateBtnState();
    }

    function updateBtnState() {
        const btn = document.getElementById('reg-btn');
        const isVerified = !document.getElementById('verified-badge').classList.contains('hidden');
        const pass = document.getElementById('reg_pass').value;
        const passConf = document.getElementById('reg_pass_confirm').value;
        const email = document.getElementById('reg_email').value;
        const emailConf = document.getElementById('reg_email_confirm').value;

        // Validation Checks
        const userValid = document.getElementById('user-error').style.display !== "block";
        const emailValid = document.getElementById('email-error').style.display !== "block";
        const passMet = document.querySelectorAll('.requirement.met').length === 3;

        if (isVerified && pass === passConf && passMet && email === emailConf && userValid && emailValid) {
            btn.disabled = false;
            btn.classList.remove('bg-gray-700', 'text-gray-500', 'cursor-not-allowed');
            btn.classList.add('bg-blue-600', 'text-white');
        } else {
            btn.disabled = true;
            btn.classList.add('bg-gray-700', 'text-gray-500', 'cursor-not-allowed');
            btn.classList.remove('bg-blue-600', 'text-white');
        }
    }

    function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById('reg_user').value;
        const password = document.getElementById('reg_pass').value;
        
        // Save full user details for the Fraud Team request system later
        const userDetails = {
            fName: document.getElementById('f_name').value,
            lName: document.getElementById('l_name').value,
            oName: document.getElementById('o_name').value,
            email: document.getElementById('reg_email').value,
            regDate: new Date().toLocaleDateString()
        };

        localStorage.setItem('competent_username', username);
        localStorage.setItem('competent_password', password);
        localStorage.setItem('user_profile_data', JSON.stringify(userDetails));
        
        if(!localStorage.getItem('accountBalance')) {
            localStorage.setItem('accountBalance', '0.00');
        }

        alert("Registration Successful! Please login.");
        window.location.href = "login.html";
    }

    setInterval(() => {
        timeLeft--;
        if(document.getElementById('timer')) {
            document.getElementById('timer').innerText = `Refreshing in ${timeLeft}s`;
        }
        if (timeLeft <= 0) generateCaptcha();
    }, 1000);

    window.onload = generateCaptcha;
</script>
</body>
</html>
