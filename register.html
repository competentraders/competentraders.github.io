<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; --input-bg: rgba(0,0,0,0.02); }
        .dark-mode { --bg: #06070a; --card: #0f1218; --text: #f8fafc; --border: rgba(255, 255, 255, 0.05); --input-bg: rgba(255,255,255,0.03); }
        
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; margin: 0; overflow-x: hidden; }
        .glass-panel { background: var(--card); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .input-field { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); width: 100%; padding: 12px; border-radius: 12px; outline: none; font-weight: 600; font-size: 14px; }
        .label-text { font-size: 10px; font-weight: 800; color: #64748b; margin-bottom: 5px; text-transform: uppercase; display: block; tracking-widest; }
        
        #toast { position: fixed; top: 20px; right: -450px; padding: 16px 24px; border-radius: 16px; background: #0f172a; color: white; display: flex; align-items: center; gap: 12px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); min-width: 300px; }
        #toast.show { right: 20px; }

        #overlay { display: none; position: fixed; inset: 0; background: rgba(6, 7, 10, 0.98); z-index: 10000; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; backdrop-filter: blur(15px); }
        .eye-icon { position: absolute; right: 15px; top: 38px; cursor: pointer; color: #64748b; }
    </style>
</head>
<body class="p-4 md:p-10 dark-mode" id="bodyTag">

    <div id="toast">
        <i id="toast-icon" class="fas fa-exclamation-circle text-red-500"></i>
        <span id="toast-msg" class="text-xs font-bold uppercase tracking-tight"></span>
    </div>

    <div id="overlay">
        <div class="mb-6 relative">
            <i class="fas fa-paper-plane text-6xl text-blue-600 animate-pulse"></i>
            <div class="absolute -top-2 -right-2 w-4 h-4 bg-green-500 rounded-full animate-ping"></div>
        </div>
        <h2 class="text-3xl font-black uppercase tracking-tighter italic">Security Link Dispatched</h2>
        <p class="text-gray-400 text-[11px] font-bold uppercase tracking-[0.2em] mt-4 max-w-xs leading-relaxed">
            Check your Gmail to verify credentials and return to terminal.
        </p>
        <button onclick="window.location.href='login.html'" class="mt-10 px-8 py-3 bg-blue-600 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-blue-700 transition shadow-lg shadow-blue-600/20">
            Proceed to Login
        </button>
    </div>

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-black uppercase italic tracking-tighter">Competent<span class="text-blue-600">raders</span></h2>
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.3em] mt-1">Registration Node</p>
            </div>
            <button onclick="document.getElementById('bodyTag').classList.toggle('dark-mode')" class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-blue-600">
                <i class="fas fa-circle-half-stroke"></i>
            </button>
        </div>

        <form id="mainRegForm" class="glass-panel p-6 md:p-10 rounded-[2.5rem] space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label class="label-text">First Name</label><input type="text" id="f_name" class="input-field" required></div>
                <div><label class="label-text">Last Name</label><input type="text" id="l_name" class="input-field" required></div>
                <div><label class="label-text">Other Name <span class="opacity-50">(Opt)</span></label><input type="text" id="o_name" class="input-field"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div><label class="label-text">Username</label><input type="text" id="reg_user" class="input-field" required></div>
                <div><label class="label-text">Email Address</label><input type="email" id="reg_email" class="input-field" required></div>
                <div><label class="label-text">Phone Number</label><input type="tel" id="reg_phone" class="input-field" placeholder="+234..." required></div>
                <div><label class="label-text">Referral ID <span class="opacity-50 text-[8px]">(Optional)</span></label><input type="text" id="referral_code" class="input-field" placeholder="CPT-0000"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative">
                    <label class="label-text">Access Password</label>
                    <input type="password" id="reg_pass" class="input-field" placeholder="••••••••" required oninput="checkPassword(this.value)">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('reg_pass')"></i>
                </div>
                <div class="relative">
                    <label class="label-text">Confirm Password</label>
                    <input type="password" id="confirm_pass" class="input-field" placeholder="••••••••" required>
                    <i class="fas fa-eye eye-icon" onclick="togglePass('confirm_pass')"></i>
                </div>
            </div>

            <div id="pass-hints" class="grid grid-cols-2 md:grid-cols-3 gap-2 mt-2 p-4 bg-black/20 rounded-xl border border-white/5">
                <div id="crit-length" class="text-[9px] font-bold uppercase tracking-wider text-gray-600 transition-all">
                    <i class="fas fa-circle-check mr-1"></i> 8+ Characters
                </div>
                <div id="crit-upper" class="text-[9px] font-bold uppercase tracking-wider text-gray-600 transition-all">
                    <i class="fas fa-circle-check mr-1"></i> Starts with Uppercase
                </div>
                <div id="crit-end" class="text-[9px] font-bold uppercase tracking-wider text-gray-600 transition-all">
                    <i class="fas fa-circle-check mr-1"></i> Ends with Num/Symbol
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="label-text">Date of Birth</label><input type="date" id="reg_dob" class="input-field" required></div>
                <div>
                    <label class="label-text">Gender</label>
                    <select id="reg_gender" class="input-field" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Nationality</label>
                    <select id="reg_country" class="input-field" required>
                        <option value="">Select Country</option>
                        <option value="Nigeria (+234)">Nigeria</option>
                        <option value="Ghana (+233)">Ghana</option>
                        <option value="South Africa (+27)">South Africa</option>
                        <option value="Kenya (+254)">Kenya</option>
                        <option value="Egypt (+20)">Egypt</option>
                        <option value="Ethiopia (+251)">Ethiopia</option>
                        <option value="Tanzania (+255)">Tanzania</option>
                        <option value="Algeria (+213)">Algeria</option>
                        <option value="Morocco (+212)">Morocco</option>
                        <option value="Uganda (+256)">Uganda</option>
                    </select>
                </div>
                <div>
                    <label class="label-text">Trading Currency</label>
                    <select id="reg_currency" class="input-field" required>
                        <option value="">Select Currency</option>
                        <option value="₦">Nigerian Naira (NGN)</option>
                        <option value="₵">Ghanaian Cedi (GHS)</option>
                        <option value="R">South African Rand (ZAR)</option>
                        <option value="KSh">Kenyan Shilling (KES)</option>
                        <option value="E£">Egyptian Pound (EGP)</option>
                        <option value="US$">US Dollar (Global)</option>
                    </select>
                </div>
            </div>

            <div class="text-[9px] text-gray-500 font-bold uppercase tracking-widest text-center px-4">
                Security Policy: Password must be 8+ chars, start with Uppercase, and end with a number/symbol.
            </div>

            <button type="submit" id="submitBtn" class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black uppercase text-xs tracking-[0.2em] shadow-2xl shadow-blue-600/40 hover:bg-blue-700 transition-all duration-300">
                Initialize Secure Account
            </button>
        </form>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
        authDomain: "competentraders-2efdc.firebaseapp.com",
        projectId: "competentraders-2efdc",
        storageBucket: "competentraders-2efdc.firebasestorage.app",
        messagingSenderId: "150379227882",
        appId: "1:150379227882:web:19d9c19805ef68b016c593"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.checkPassword = (p) => {
        const critLength = document.getElementById('crit-length');
        const critUpper = document.getElementById('crit-upper');
        const critEnd = document.getElementById('crit-end');
        if (p.length >= 8) { critLength.classList.replace('text-gray-600', 'text-blue-500'); } else { critLength.classList.replace('text-blue-500', 'text-gray-600'); }
        if (/^[A-Z]/.test(p)) { critUpper.classList.replace('text-gray-600', 'text-blue-500'); } else { critUpper.classList.replace('text-blue-500', 'text-gray-600'); }
        if (/[0-9!@#$%^&*]$/.test(p)) { critEnd.classList.replace('text-gray-600', 'text-blue-500'); } else { critEnd.classList.replace('text-blue-500', 'text-gray-600'); }
    };

    window.togglePass = (id) => {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    };

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-msg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 5000);
    }

    document.getElementById('mainRegForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const email = document.getElementById('reg_email').value;
        const pass = document.getElementById('reg_pass').value;
        const confirm = document.getElementById('confirm_pass').value;
        const refCode = document.getElementById('referral_code').value.trim();

        if(pass !== confirm) return showToast("Passwords do not match!");

        btn.innerText = "VERIFYING SECURITY NODE...";
        btn.disabled = true;

        const actionCodeSettings = {
            url: 'https://competentraders.vercel.app/login.html', 
            handleCodeInApp: true,
        };

        try {
            // --- OPTIONAL REFERRAL VALIDATION ---
            let referredBy = null;
            if(refCode !== "") {
                const q = query(collection(db, "users"), where("referralId", "==", refCode));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) {
                    showToast("Invalid Referral ID. Leave blank if none.");
                    btn.innerText = "INITIALIZE SECURE ACCOUNT";
                    btn.disabled = false;
                    return;
                }
                referredBy = refCode;
            }

            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const user = userCredential.user;

            await sendEmailVerification(user, actionCodeSettings);

            await setDoc(doc(db, "users", user.uid), {
                firstName: document.getElementById('f_name').value,
                lastName: document.getElementById('l_name').value,
                fullName: document.getElementById('f_name').value + " " + document.getElementById('l_name').value, 
                username: document.getElementById('reg_user').value,
                email: email,
                phone: document.getElementById('reg_phone').value,
                dob: document.getElementById('reg_dob').value,
                gender: document.getElementById('reg_gender').value,
                country: document.getElementById('reg_country').value,
                currency: document.getElementById('reg_currency').value,
                uid: user.uid,
                referredBy: referredBy,
                accountStatus: "pending_verification",
                balance: 0,
                referralEarnings: 0,
                referralCount: 0,
                registrationDate: new Date().toISOString()
            });

            document.getElementById('overlay').style.display = 'flex';

        } catch (error) {
            showToast(error.message);
            btn.innerText = "INITIALIZE SECURE ACCOUNT";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
