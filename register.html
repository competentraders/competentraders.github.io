<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        :root { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; }
        .dark-mode { --bg: #06070a; --card: #0f1218; --text: #f8fafc; --border: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; margin: 0; }
        .glass-panel { background: var(--card); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .input-field { background: rgba(0,0,0,0.02); border: 1px solid var(--border); color: var(--text); width: 100%; padding: 12px; border-radius: 12px; outline: none; }
        .dark-mode .input-field { background: rgba(255,255,255,0.03); }
        .label-text { font-size: 10px; font-weight: 800; color: #64748b; margin-bottom: 5px; text-transform: uppercase; display: block; }
        .relative-box { position: relative; }
        .eye-btn { position: absolute; right: 12px; top: 35px; cursor: pointer; color: #94a3b8; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-3xl mx-auto flex justify-end mb-4">
        <button onclick="document.body.classList.toggle('dark-mode')" class="p-2 bg-blue-600 text-white rounded-lg"><i class="fas fa-adjust"></i></button>
    </div>

    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black uppercase italic">Competent<span class="text-blue-600">raders</span></h2>
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mt-1">Enterprise Registration Node</p>
        </div>

        <form id="mainRegForm" class="glass-panel p-6 md:p-10 rounded-[2rem] space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label class="label-text">First Name</label><input type="text" id="f_name" class="input-field" required></div>
                <div><label class="label-text">Last Name</label><input type="text" id="l_name" class="input-field" required></div>
                <div><label class="label-text">Other Name</label><input type="text" id="o_name" class="input-field"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="label-text">Username</label><input type="text" id="reg_user" class="input-field" required></div>
                <div>
                    <label class="label-text">Gender</label>
                    <select id="reg_gender" class="input-field" required>
                        <option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="label-text">Email</label><input type="email" id="reg_email" class="input-field" required></div>
                <div><label class="label-text">Confirm Email</label><input type="email" id="confirm_email" class="input-field" required></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative-box"><label class="label-text">Password</label>
                    <input type="password" id="reg_pass" class="input-field" required>
                    <i class="fas fa-eye eye-btn" onclick="toggleView('reg_pass')"></i>
                </div>
                <div class="relative-box"><label class="label-text">Confirm Password</label>
                    <input type="password" id="confirm_pass" class="input-field" required>
                    <i class="fas fa-eye eye-btn" onclick="toggleView('confirm_pass')"></i>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="label-text">Date of Birth</label><input type="date" id="reg_dob" class="input-field" required></div>
                <div>
                    <label class="label-text">Nationality</label>
                    <select id="reg_country" class="input-field" required>
                        <option value="Nigeria">Nigeria</option><option value="Ghana">Ghana</option><option value="South Africa">South Africa</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black uppercase text-xs shadow-lg shadow-blue-600/30">
                Create Account
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "Competentraders",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('mainRegForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            const email = document.getElementById('reg_email').value;
            const pass = document.getElementById('reg_pass').value;

            if(email !== document.getElementById('confirm_email').value || pass !== document.getElementById('confirm_pass').value) {
                alert("Match Error: Email or Password do not match.");
                btn.innerText = "CREATE ACCOUNT"; btn.disabled = false; return;
            }

            try {
                // 1. Create the Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 2. Save detailed data to Firestore Database
                await setDoc(doc(db, "users", user.uid), {
                    firstName: document.getElementById('f_name').value,
                    lastName: document.getElementById('l_name').value,
                    otherName: document.getElementById('o_name').value,
                    username: document.getElementById('reg_user').value,
                    gender: document.getElementById('reg_gender').value,
                    dob: document.getElementById('reg_dob').value,
                    country: document.getElementById('reg_country').value,
                    email: email,
                    balance: 0,
                    createdAt: new Date().toISOString()
                });

                // 3. Direct access to dashboard
                window.location.href = 'user-dashboard.html';

            } catch (error) {
                alert(error.message);
                btn.innerText = "CREATE ACCOUNT"; btn.disabled = false;
            }
        });
    </script>
    <script>
        function toggleView(id) {
            const x = document.getElementById(id);
            x.type = x.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
