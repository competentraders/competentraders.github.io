<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --input-bg: #f1f5f9;
        }

        .dark-mode {
            --bg-body: #06070a;
            --bg-card: #0f1218;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(255, 255, 255, 0.03);
        }

        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-body); color: var(--text-main); transition: 0.3s; }
        
        .glass-panel { background: var(--bg-card); border: 1px solid var(--border); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        
        .input-field { 
            background: var(--input-bg); border: 1px solid var(--border);
            color: var(--text-main); width: 100%; padding: 12px 16px;
            border-radius: 12px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: #3b82f6; }

        .label-text { font-size: 10px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; display: block; text-transform: uppercase; letter-spacing: 1px; }
        
        #verify-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 10000; display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); padding: 20px;
        }

        .eye-btn { position: absolute; right: 15px; top: 38px; color: var(--text-muted); cursor: pointer; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-3xl mx-auto flex justify-end mb-6">
        <button onclick="toggleTheme()" class="p-3 rounded-full bg-blue-600 text-white shadow-lg">
            <i id="theme-icon" class="fas fa-moon"></i>
        </button>
    </div>

    <div id="verify-overlay">
        <div class="bg-[#0f1218] border border-blue-500/30 p-8 text-center rounded-[2rem] max-w-sm w-full">
            <i class="fas fa-paper-plane text-4xl text-blue-500 mb-4 animate-bounce"></i>
            <h3 class="text-white text-xl font-black uppercase mb-2">Check Your Gmail</h3>
            <p id="sent-to-email" class="text-blue-400 text-[10px] font-bold mb-6 italic">---</p>
            <p class="text-gray-400 text-xs mb-8">We sent a secure activation link. Click it to confirm your identity and unlock your dashboard.</p>
            <button onclick="location.reload()" class="w-full py-3 bg-white/5 text-white rounded-xl text-[10px] font-bold uppercase border border-white/10">Try Different Email</button>
        </div>
    </div>

    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-10">
            <div class="inline-flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center"><i class="fas fa-shield-alt text-white text-sm"></i></div>
                <span class="text-xl font-black uppercase">Competent<span class="text-blue-500">raders</span></span>
            </div>
            <h2 class="text-2xl font-black uppercase tracking-tight">Security Node Creation</h2>
        </div>

        <form onsubmit="handleRegister(event)" class="glass-panel p-6 md:p-10 rounded-[2.5rem] space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div><label class="label-text">First Name</label><input type="text" id="f_name" class="input-field" required></div>
                <div><label class="label-text">Last Name</label><input type="text" id="l_name" class="input-field" required></div>
                <div><label class="label-text">Other Name</label><input type="text" id="o_name" class="input-field"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="label-text">Username</label>
                    <input type="text" id="reg_user" class="input-field" required placeholder="@username">
                </div>
                <div>
                    <label class="label-text">Gender</label>
                    <select id="reg_gender" class="input-field" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Prefer not to say</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="label-text">Email Address</label><input type="email" id="reg_email" class="input-field" required></div>
                <div><label class="label-text">Confirm Email</label><input type="email" id="confirm_email" class="input-field" required></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="relative"><label class="label-text">Security Password</label>
                    <input type="password" id="reg_pass" class="input-field" required>
                    <i class="fas fa-eye eye-btn" onclick="togglePass('reg_pass')"></i>
                </div>
                <div class="relative"><label class="label-text">Confirm Password</label>
                    <input type="password" id="confirm_pass" class="input-field" required>
                    <i class="fas fa-eye eye-btn" onclick="togglePass('confirm_pass')"></i>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="label-text">Date of Birth</label><input type="date" id="reg_dob" class="input-field" required></div>
                <div>
                    <label class="label-text">Nationality (African Region)</label>
                    <select id="reg_country" class="input-field" required>
                        <option value="">Select Country</option>
                        <option value="Nigeria">Nigeria</option><option value="Ghana">Ghana</option>
                        <option value="South Africa">South Africa</option><option value="Kenya">Kenya</option>
                        <option value="Egypt">Egypt</option><option value="Ethiopia">Ethiopia</option>
                        <option value="Uganda">Uganda</option><option value="Tanzania">Tanzania</option>
                        <option value="Algeria">Algeria</option><option value="Morocco">Morocco</option>
                        <option value="Angola">Angola</option><option value="Ivory Coast">Ivory Coast</option>
                        <option value="Cameroon">Cameroon</option><option value="Senegal">Senegal</option>
                        <option value="Zimbabwe">Zimbabwe</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="reg-btn" class="w-full py-5 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-blue-700 transition-all shadow-xl shadow-blue-600/20">
                Finalize & Send Activation Link
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleRegister = async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('reg_email').value;
            const confirmEmail = document.getElementById('confirm_email').value;
            const pass = document.getElementById('reg_pass').value;
            const confirmPass = document.getElementById('confirm_pass').value;

            if(email !== confirmEmail) { alert("Emails do not match!"); return; }
            if(pass !== confirmPass) { alert("Passwords do not match!"); return; }
            if(pass.length < 8) { alert("Security level too low. Use 8+ characters."); return; }

            const actionCodeSettings = {
                url: 'https://competentraders-2efdc.firebaseapp.com/finish-reg.html',
                handleCodeInApp: true,
            };

            try {
                await sendSignInLinkToEmail(auth, email, actionCodeSettings);
                
                // Store all data for the next page
                window.localStorage.setItem('emailForSignIn', email);
                window.localStorage.setItem('draft_f_name', document.getElementById('f_name').value);
                window.localStorage.setItem('draft_l_name', document.getElementById('l_name').value);
                window.localStorage.setItem('draft_user', document.getElementById('reg_user').value);

                document.getElementById('sent-to-email').innerText = email;
                document.getElementById('verify-overlay').style.display = 'flex';
            } catch (error) {
                alert("Error: " + error.message);
            }
        };
    </script>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            if(document.body.classList.contains('dark-mode')) {
                icon.className = "fas fa-sun";
            } else {
                icon.className = "fas fa-moon";
            }
        }

        function togglePass(id) {
            const el = document.getElementById(id);
            el.type = el.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
