<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex Trading | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #06070a; color: white; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 18, 24, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        .ticker-wrap { width: 100%; overflow: hidden; background: rgba(99, 102, 241, 0.1); border-bottom: 1px solid rgba(99, 102, 241, 0.2); }
        .ticker { display: flex; white-space: nowrap; padding: 10px 0; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .plan-card { transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-left: 4px solid #6366f1; }
        .plan-card:hover { transform: translateY(-5px); border-color: #818cf8; background: rgba(99, 102, 241, 0.05); }

        /* Modal Animation */
        #custom-modal.flex { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="pb-20">

    <div class="ticker-wrap">
        <div class="ticker space-x-12">
            <span class="text-[10px] font-black uppercase tracking-widest"><span class="text-indigo-400">EURUSD</span> 1.0842 <i class="fas fa-caret-up text-green-500"></i></span>
            <span class="text-[10px] font-black uppercase tracking-widest"><span class="text-indigo-400">GBPUSD</span> 1.2635 <i class="fas fa-caret-down text-red-500"></i></span>
            <span class="text-[10px] font-black uppercase tracking-widest"><span class="text-indigo-400">XAUUSD</span> 2341.20 <i class="fas fa-caret-up text-green-500"></i></span>
            <span class="text-[10px] font-black uppercase tracking-widest"><span class="text-indigo-400">USDJPY</span> 151.45 <i class="fas fa-caret-up text-green-500"></i></span>
        </div>
    </div>

    <div class="max-w-6xl mx-auto p-6 md:p-10">
        
        <div class="flex justify-between items-center mb-16">
            <div>
                <div class="inline-flex items-center gap-2 mb-2">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-globe-americas text-white text-xs"></i>
                    </div>
                    <span class="text-xl font-black uppercase tracking-tighter">Competent<span class="text-indigo-500">raders</span></span>
                </div>
                <h2 class="text-3xl font-black uppercase tracking-tight">Forex <span class="text-indigo-500">Trade</span></h2>
                <p class="text-gray-500 text-[10px] font-bold uppercase tracking-[0.3em]">Institutional Grade Portfolios</p>
            </div>
            <a href="user-dashboard.html" class="w-10 h-10 glass-panel rounded-full flex items-center justify-center hover:bg-white/10 transition-all">
                <i class="fas fa-times text-xs"></i>
            </a>
        </div>

        <div id="forex-plans-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

        <div id="empty-state" class="text-center py-20 hidden">
            <i class="fas fa-layer-group text-gray-800 text-4xl mb-4"></i>
            <p class="text-gray-600 text-[10px] font-black uppercase tracking-widest">Waiting for next market session...</p>
        </div>

    </div>

    <div id="custom-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-black/80 backdrop-blur-sm">
        <div class="glass-panel max-w-sm w-full p-8 rounded-[40px] text-center border-indigo-500/30 shadow-2xl scale-95 transition-transform duration-300">
            <div id="modal-icon" class="text-6xl mb-6"></div>
            <h3 id="modal-title" class="text-2xl font-black uppercase mb-2"></h3>
            <p id="modal-text" class="text-gray-400 text-sm mb-8 leading-relaxed"></p>
            <div id="modal-buttons" class="flex flex-col gap-3"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
        authDomain: "competentraders-2efdc.firebaseapp.com",
        projectId: "competentraders-2efdc",
        storageBucket: "competentraders-2efdc.firebasestorage.app",
        messagingSenderId: "150379227882",
        appId: "1:150379227882:web:19d9c19805ef68b016c593"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const container = document.getElementById('forex-plans-container');

    // UI MODAL CONTROLLER
    const showModal = (type, title, text, onConfirm = null) => {
        const modal = document.getElementById('custom-modal');
        const icon = document.getElementById('modal-icon');
        const mTitle = document.getElementById('modal-title');
        const mText = document.getElementById('modal-text');
        const mBtns = document.getElementById('modal-buttons');

        mBtns.innerHTML = "";
        modal.classList.remove('hidden');
        modal.classList.add('flex');

        if (type === 'insufficient') {
            icon.innerHTML = "🦅"; 
            icon.className = "text-6xl mb-6 opacity-20 grayscale"; // "Dying" bird effect
            mTitle.className = "text-2xl font-black uppercase mb-2 text-red-500";
        } else if (type === 'success') {
            icon.innerHTML = "🦅"; 
            icon.className = "text-6xl mb-6 text-indigo-500 drop-shadow-[0_0_15px_rgba(99,102,241,0.5)]"; // "Soaring" bird effect
            mTitle.className = "text-2xl font-black uppercase mb-2 text-indigo-400";
        } else {
            icon.innerHTML = "📥";
            mTitle.className = "text-2xl font-black uppercase mb-2 text-white";
        }

        mTitle.innerText = title;
        mText.innerText = text;

        if (onConfirm) {
            const confirmBtn = document.createElement('button');
            confirmBtn.className = "w-full bg-indigo-600 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest";
            confirmBtn.innerText = "Confirm Trade";
            confirmBtn.onclick = () => { modal.classList.add('hidden'); onConfirm(); };
            
            const cancelBtn = document.createElement('button');
            cancelBtn.className = "w-full bg-white/5 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest text-gray-500";
            cancelBtn.innerText = "Cancel";
            cancelBtn.onclick = () => modal.classList.add('hidden');
            
            mBtns.appendChild(confirmBtn);
            mBtns.appendChild(cancelBtn);
        } else {
            const closeBtn = document.createElement('button');
            closeBtn.className = "w-full bg-white/10 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest text-white";
            closeBtn.innerText = "Close";
            closeBtn.onclick = () => modal.classList.add('hidden');
            mBtns.appendChild(closeBtn);
        }
    };

    // CORE SUBSCRIPTION LOGIC
    window.subscribeToPlan = async (asset, planPrice, returnAmt) => {
        const user = auth.currentUser;
        if (!user) {
            showModal('standard', 'Access Denied', 'Please login to your account to execute trades.');
            return;
        }

        const userRef = doc(db, "users", user.uid);
        try {
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) return;

            const currentBalance = userSnap.data().balance || 0;
            const price = parseFloat(planPrice.replace(/[^0-9.]/g, ''));

            if (currentBalance < price) {
                showModal('insufficient', 'Empty Nest', 'Your account balance is insufficient. Top up your wallet to let your investment soar.');
                return;
            }

            showModal('confirm', 'Execute Trade', `Authorize debit of ${planPrice} for ${asset} trade management?`, async () => {
                await updateDoc(userRef, { balance: increment(-price) });
                
                showModal('success', 'Eagle Soaring!', 'Account debited successfully. Your professional trade management session has started.');

                const msg = `Hello Competentraders, I just subscribed to CPT TRADE 4 ME.\n\nAsset: ${asset}\nAmount: ${planPrice}\nReturn: ${returnAmt}\nUser UID: ${user.uid}`;
                
                // Delay WhatsApp slightly so they see the success message
                setTimeout(() => {
                    window.location.href = `https://wa.me/2349157023248?text=${encodeURIComponent(msg)}`;
                }, 2800);
            });

        } catch (error) {
            console.error(error);
            showModal('standard', 'System Error', 'Could not process transaction. Please check your network.');
        }
    };

    // RENDER LIVE PLANS
    onSnapshot(query(collection(db, "forex_plans"), orderBy("timestamp", "desc")), (snapshot) => {
        container.innerHTML = "";
        if(snapshot.empty) document.getElementById('empty-state').classList.remove('hidden');
        else document.getElementById('empty-state').classList.add('hidden');

        snapshot.forEach((doc) => {
            const plan = doc.data();
            const card = `
                <div class="plan-card glass-panel p-8 rounded-[32px] shadow-xl">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-black uppercase bg-indigo-500/10 text-indigo-400 px-4 py-1 rounded-full border border-indigo-500/10">${plan.asset}</span>
                        <span class="text-[10px] font-black text-green-500 uppercase tracking-widest">${plan.guarantee} Guarantee</span>
                    </div>

                    <div class="space-y-4 mb-8">
                        <div>
                            <p class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Investment Plan</p>
                            <p class="text-3xl font-black text-white">${plan.plan}</p>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-gray-500 uppercase tracking-widest">Expected Return</p>
                            <p class="text-xl font-black text-indigo-400">${plan.returns}</p>
                        </div>
                    </div>

                    <button onclick="subscribeToPlan('${plan.asset}', '${plan.plan}', '${plan.returns}')" 
                       class="block w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl text-center text-[11px] font-black uppercase tracking-[0.2em] transition-all shadow-lg shadow-indigo-500/20">
                       CPT TRADE 4 ME
                    </button>
                </div>
            `;
            container.innerHTML += card;
        });
    });
</script>

</body>
</html>
