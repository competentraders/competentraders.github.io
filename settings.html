<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Settings | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; }
        .input-box { background: #0f111a; border: 1px solid #1e293b; border-radius: 15px; padding: 15px; width: 100%; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: #3b82f6; }
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #3b82f6; color: white; padding: 12px 24px; border-radius: 12px; font-size: 12px; font-weight: 800; z-index: 9999; transition: 0.5s; }
        #toast.show { top: 20px; }
    </style>
</head>
<body class="p-6">
    <div id="toast">Details Saved Successfully!</div>

    <div class="max-w-md mx-auto">
        <div class="flex items-center gap-4 mb-8">
            <a href="dashboard.html" class="text-gray-500 text-xl"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-black uppercase tracking-tight">Withdrawal <span class="text-blue-500">Settings</span></h1>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-widest">Bank Name</label>
                <input type="text" id="bank-name" placeholder="e.g. GTBank, Kuda, OPay" class="input-box text-sm">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-widest">Account Number</label>
                <input type="number" id="acc-num" placeholder="0123456789" class="input-box text-sm">
            </div>
            <div>
                <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-widest">Account Holder Name</label>
                <input type="text" id="acc-name" placeholder="Full Name on Bank Account" class="input-box text-sm">
            </div>

            <button onclick="saveBankDetails()" id="save-btn" class="w-full py-5 bg-blue-600 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg shadow-blue-600/20">
                Update Bank Details
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists() && snap.data().bankDetails) {
                    const d = snap.data().bankDetails;
                    document.getElementById('bank-name').value = d.bankName || "";
                    document.getElementById('acc-num').value = d.accNum || "";
                    document.getElementById('acc-name').value = d.accName || "";
                }
            } else { window.location.href = "login.html"; }
        });

        window.saveBankDetails = async () => {
            const btn = document.getElementById('save-btn');
            const data = {
                bankName: document.getElementById('bank-name').value,
                accNum: document.getElementById('acc-num').value,
                accName: document.getElementById('acc-name').value
            };

            if(!data.bankName || !data.accNum || !data.accName) return alert("Fill all fields");

            btn.innerText = "SAVING...";
            await updateDoc(doc(db, "users", auth.currentUser.uid), { bankDetails: data });
            
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); btn.innerText = "Update Bank Details"; }, 3000);
        };
    </script>
</body>
</html>
