<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Account Settings | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; margin: 0; }
        .settings-card { background: #0f111a; border-radius: 24px; border: 1px solid #1e293b; overflow: hidden; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid #1e293b; }
        .setting-item:last-child { border-bottom: none; }
        
        /* Toggle Switch Styling */
        .switch { position: relative; display: inline-block; width: 45px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(21px); }

        /* Toast Popup */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #3b82f6; color: white; padding: 12px 25px; border-radius: 50px;
            font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
            display: none; z-index: 10000; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="p-4 pb-12">

    <div id="toast">Settings Updated</div>

    <div class="flex items-center gap-4 mb-6">
        <a href="user-dashboard.html" class="w-10 h-10 flex items-center justify-center bg-gray-800 rounded-full text-blue-500">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-black uppercase italic">App <span class="text-blue-500">Settings</span></h1>
    </div>

    <div class="settings-card p-6 mb-8 border-dashed border-blue-500/30 bg-blue-500/5">
        <p class="text-[9px] font-black text-blue-500 uppercase mb-2 tracking-widest">Dashboard Preview</p>
        <div class="flex justify-between items-end">
            <div>
                <p class="text-[10px] text-gray-500 font-bold uppercase">Main Balance</p>
                <p id="previewBalance" class="text-2xl font-black text-white">₦0.00</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-500 font-bold uppercase">Account</p>
                <p id="previewAccount" class="text-xs font-bold text-gray-300 italic">User-7721</p>
            </div>
        </div>
    </div>

    <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 ml-2">Security Lock</p>
    <div class="settings-card mb-6">
        <div class="setting-item">
            <div class="flex items-center gap-4">
                <i class="fas fa-lock text-blue-500"></i>
                <div>
                    <p class="text-sm font-bold">Require Login PIN</p>
                    <p class="text-[10px] text-gray-500">Lock app on startup</p>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="lockToggle" onchange="toggleAppLock(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <button onclick="updatePin()" class="setting-item w-full text-left">
            <div class="flex items-center gap-4">
                <i class="fas fa-key text-yellow-500"></i>
                <div>
                    <p class="text-sm font-bold">Change PIN</p>
                    <p class="text-[10px] text-gray-500">Update security access code</p>
                </div>
            </div>
            <i class="fas fa-chevron-right text-gray-700"></i>
        </button>
    </div>

    <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 ml-2">Privacy & Display</p>
    <div class="settings-card mb-6">
        <div class="setting-item">
            <div class="flex items-center gap-4">
                <i class="fas fa-eye-slash text-purple-500"></i>
                <div>
                    <p class="text-sm font-bold text-purple-200">Hide Balance</p>
                    <p class="text-[10px] text-gray-500">Mask currency on all pages</p>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="hideBalanceToggle" onchange="saveSetting('hideBalance', this.checked)">
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <div class="flex items-center gap-4">
                <i class="fas fa-user-secret text-green-500"></i>
                <div>
                    <p class="text-sm font-bold text-green-200">Hide Account Info</p>
                    <p class="text-[10px] text-gray-500">Mask bank & profile name</p>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="hideAccountToggle" onchange="saveSetting('hideAccount', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 ml-2 text-red-500">Danger Zone</p>
    <div class="settings-card">
        <button onclick="clearAllData()" class="setting-item w-full text-left">
            <div class="flex items-center gap-4">
                <i class="fas fa-trash-can text-red-500"></i>
                <div>
                    <p class="text-sm font-bold text-red-500">Wipe All Data</p>
                    <p class="text-[10px] text-gray-500">Reset everything to factory</p>
                </div>
            </div>
        </button>
    </div>

    <script>
        // Default settings object
        const defaultSettings = {
            lockActive: false,
            hideBalance: false,
            hideAccount: false,
            appPin: "1234"
        };

        window.onload = () => {
            const settings = JSON.parse(localStorage.getItem('appSettings')) || defaultSettings;
            
            // Apply checkbox states
            document.getElementById('lockToggle').checked = settings.lockActive;
            document.getElementById('hideBalanceToggle').checked = settings.hideBalance;
            document.getElementById('hideAccountToggle').checked = settings.hideAccount;

            updatePreview(); // Refresh the visual card at the top
        };

        // Save and Update UI
        function saveSetting(key, value) {
            let settings = JSON.parse(localStorage.getItem('appSettings')) || defaultSettings;
            settings[key] = value;
            localStorage.setItem('appSettings', JSON.stringify(settings));
            
            updatePreview(); // Immediately show the effect in the preview card
            showToast();
        }

        // Updates the Preview Card to show how the app looks
        function updatePreview() {
            const settings = JSON.parse(localStorage.getItem('appSettings')) || defaultSettings;
            const balance = parseFloat(localStorage.getItem('accountBalance')) || 0.00;
            const bank = JSON.parse(localStorage.getItem('userBankDetails')) || { name: "User Name" };

            // Handle Balance Masking
            document.getElementById('previewBalance').innerText = settings.hideBalance ? "₦ ****" : "₦" + balance.toLocaleString();

            // Handle Account Masking
            document.getElementById('previewAccount').innerText = settings.hideAccount ? "Protected" : bank.name;
        }

        function toggleAppLock(isActive) {
            let settings = JSON.parse(localStorage.getItem('appSettings')) || defaultSettings;
            if (isActive) {
                let pin = prompt("Create 4-Digit PIN:", "1234");
                if (pin && pin.length >= 4) {
                    settings.lockActive = true;
                    settings.appPin = pin;
                    localStorage.setItem('appSettings', JSON.stringify(settings));
                    alert("Lock Enabled.");
                } else {
                    document.getElementById('lockToggle').checked = false;
                }
            } else {
                let check = prompt("Enter PIN to disable lock:");
                if (check === settings.appPin) {
                    settings.lockActive = false;
                    localStorage.setItem('appSettings', JSON.stringify(settings));
                } else {
                    alert("Incorrect PIN");
                    document.getElementById('lockToggle').checked = true;
                }
            }
        }

        function updatePin() {
            let settings = JSON.parse(localStorage.getItem('appSettings')) || defaultSettings;
            let old = prompt("Current PIN:");
            if(old === settings.appPin) {
                let newPin = prompt("New 4-Digit PIN:");
                if(newPin && newPin.length >= 4) {
                    settings.appPin = newPin;
                    localStorage.setItem('appSettings', JSON.stringify(settings));
                    alert("PIN Changed!");
                }
            } else {
                alert("Incorrect PIN");
            }
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function clearAllData() {
            if(confirm("Factory Reset? This will delete your balance, history, and bank info!")) {
                localStorage.clear();
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
