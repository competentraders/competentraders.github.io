<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Settings | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; }
        
        .input-box { 
            background: #0f111a; 
            border: 1px solid #1e293b; 
            border-radius: 15px; 
            padding: 16px; 
            width: 100%; 
            outline: none; 
            transition: 0.3s;
            color: white;
            font-size: 14px;
        }
        .input-box:focus { border-color: #3b82f6; background: #131624; }
        
        select.input-box { appearance: none; cursor: pointer; }

        #toast { 
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%); 
            background: #22c55e; color: white; padding: 14px 28px; border-radius: 16px; 
            font-size: 13px; font-weight: 800; z-index: 9999; transition: 0.5s; 
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);
            display: flex; align-items: center; gap: 10px;
        }
        #toast.show { top: 20px; }

        .form-label {
            text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-[0.15em] ml-1;
        }
    </style>
</head>
<body class="p-6">
    <div id="toast"><i class="fas fa-check-circle"></i> <span>Details Saved Successfully!</span></div>

    <div class="max-w-md mx-auto">
        <div class="flex items-center gap-4 mb-10">
            <a href="user-dashboard.html" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/5 text-gray-400 hover:text-white transition-all">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-xl font-black uppercase tracking-tight">Bank <span class="text-blue-500">Settings</span></h1>
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Withdrawal Destination</p>
            </div>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-widest ml-1">Select Bank</label>
                <div class="relative">
                    <select id="bank-name" class="input-box">
                        <option value="" disabled selected>Choose your bank...</option>
                        <option value="Access Bank">Access Bank</option>
                        <option value="Access Bank (Diamond)">Access Bank (Diamond)</option>
                        <option value="Airtel Smartcash">Airtel Smartcash PSB</option>
                        <option value="EcoBank">EcoBank Nigeria</option>
                        <option value="Fidelity Bank">Fidelity Bank</option>
                        <option value="First Bank">First Bank of Nigeria</option>
                        <option value="First City Monument Bank">First City Monument Bank (FCMB)</option>
                        <option value="GTBank">Guaranty Trust Bank (GTB)</option>
                        <option value="Heritage Bank">Heritage Bank</option>
                        <option value="Kuda Bank">Kuda Bank</option>
                        <option value="Moniepoint">Moniepoint MFB</option>
                        <option value="OPay">OPay Digital Bank (PayCom)</option>
                        <option value="Palmpay">Palmpay</option>
                        <option value="Stanbic IBTC">Stanbic IBTC Bank</option>
                        <option value="Standard Chartered">Standard Chartered Bank</option>
                        <option value="Sterling Bank">Sterling Bank</option>
                        <option value="UBA">United Bank for Africa (UBA)</option>
                        <option value="Union Bank">Union Bank of Nigeria</option>
                        <option value="Unity Bank">Unity Bank</option>
                        <option value="Wema Bank">Wema Bank</option>
                        <option value="Zenith Bank">Zenith Bank</option>
                        <option value="9PSB">9PSB</option>
                        <option value="Carbon">Carbon</option>
                        <option value="FairMoney">FairMoney MFB</option>
                        <option value="Globus Bank">Globus Bank</option>
                        <option value="Jaiz Bank">Jaiz Bank</option>
                        <option value="Lotus Bank">Lotus Bank</option>
                        <option value="MTN MoMo">MTN MoMo PSB</option>
                        <option value="Optimus Bank">Optimus Bank</option>
                        <option value="Parallex Bank">Parallex Bank</option>
                        <option value="PremiumTrust Bank">PremiumTrust Bank</option>
                        <option value="Providus Bank">Providus Bank</option>
                        <option value="Rubies Bank">Rubies Bank</option>
                        <option value="SunTrust Bank">SunTrust Bank</option>
                        <option value="TAJ Bank">TAJ Bank</option>
                        <option value="Titan Trust Bank">Titan Trust Bank</option>
                        <option value="VFD Microfinance Bank">VFD Microfinance Bank</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 pointer-events-none text-xs"></i>
                </div>
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-widest ml-1">Account Number</label>
                <input type="number" id="acc-num" placeholder="0123456789" maxlength="10" class="input-box">
            </div>

            <div>
                <label class="text-[10px] font-black uppercase text-gray-500 mb-2 block tracking-widest ml-1">Account Holder Name</label>
                <input type="text" id="acc-name" placeholder="Name as seen on Bank App" class="input-box">
            </div>

            <div class="pt-4">
                <button onclick="saveBankDetails()" id="save-btn" class="w-full py-5 bg-blue-600 rounded-2xl font-black uppercase text-[11px] tracking-[0.2em] shadow-lg shadow-blue-600/30 active:scale-95 transition-all">
                    Securely Save Details
                </button>
            </div>
            
            <p class="text-[9px] text-gray-600 text-center font-bold uppercase leading-relaxed px-4">
                Ensure these details are correct. Payments are processed to the account saved above.
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check login and Load existing data
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists() && snap.data().bankDetails) {
                    const d = snap.data().bankDetails;
                    document.getElementById('bank-name').value = d.bankName || "";
                    document.getElementById('acc-num').value = d.accNum || "";
                    document.getElementById('acc-name').value = d.accName || "";
                }
            } else { window.location.href = "login.html"; }
        });

        window.saveBankDetails = async () => {
            const btn = document.getElementById('save-btn');
            const data = {
                bankName: document.getElementById('bank-name').value,
                accNum: document.getElementById('acc-num').value,
                accName: document.getElementById('acc-name').value
            };

            if(!data.bankName || !data.accNum || !data.accName) {
                return alert("Please fill in all bank details before saving.");
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> ENCRYPTING...`;

            try {
                await updateDoc(doc(db, "users", auth.currentUser.uid), { bankDetails: data });
                
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                
                // Professional Redirect after 2 seconds
                setTimeout(() => { 
                    window.location.href = "user-dashboard.html"; 
                }, 2000);

            } catch (error) {
                alert("Error saving details. Check connection.");
                btn.disabled = false;
                btn.innerText = "Securely Save Details";
            }
        };
    </script>
</body>
</html>
