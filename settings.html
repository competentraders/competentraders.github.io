<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #06070a; color: white; }
        .settings-card { background: #0f111a; border-radius: 24px; border: 1px solid #1e293b; overflow: hidden; }
        .setting-item { display: flex; align-items: center; justify-content: space-between; padding: 20px; border-bottom: 1px solid #1e293b; }
        .setting-item:last-child { border-bottom: none; }
        
        /* Custom Toggle Switch */
        .switch { position: relative; display: inline-block; width: 45px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(21px); }
    </style>
</head>
<body class="p-4 pb-12">

    <div class="flex items-center gap-4 mb-8">
        <a href="user-dashboard.html" class="w-10 h-10 flex items-center justify-center bg-gray-800 rounded-full text-blue-500">
            <i class="fas fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-black uppercase italic">App <span class="text-blue-500">Settings</span></h1>
    </div>

    <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 ml-2">Security & Privacy</p>
    <div class="settings-card mb-6">
        <div class="setting-item">
            <div class="flex items-center gap-4">
                <i class="fas fa-fingerprint text-blue-500"></i>
                <div>
                    <p class="text-sm font-bold">Biometric Login</p>
                    <p class="text-[10px] text-gray-500">Use FaceID or Fingerprint</p>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="biometricToggle" onchange="saveSetting('biometric', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <div class="flex items-center gap-4">
                <i class="fas fa-shield-halved text-green-500"></i>
                <div>
                    <p class="text-sm font-bold">Two-Factor Auth</p>
                    <p class="text-[10px] text-gray-500">Secure your withdrawals</p>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="twoFactorToggle" onchange="saveSetting('2fa', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 ml-2">Preferences</p>
    <div class="settings-card mb-6">
        <div class="setting-item">
            <div class="flex items-center gap-4">
                <i class="fas fa-bell text-orange-500"></i>
                <div>
                    <p class="text-sm font-bold">Push Notifications</p>
                    <p class="text-[10px] text-gray-500">Alerts for trade results</p>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="notifyToggle" checked onchange="saveSetting('notify', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <div class="flex items-center gap-4">
                <i class="fas fa-eye-slash text-purple-500"></i>
                <div>
                    <p class="text-sm font-bold">Hide Balance</p>
                    <p class="text-[10px] text-gray-500">Hide balance on dashboard</p>
                </div>
            </div>
            <label class="switch">
                <input type="checkbox" id="hideBalanceToggle" onchange="saveSetting('hideBalance', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <p class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 ml-2">Data Management</p>
    <div class="settings-card">
        <button onclick="clearAllData()" class="setting-item w-full text-left">
            <div class="flex items-center gap-4">
                <i class="fas fa-trash-can text-red-500"></i>
                <div>
                    <p class="text-sm font-bold text-red-500">Clear Cache & Reset</p>
                    <p class="text-[10px] text-gray-500">Delete all locally stored data</p>
                </div>
            </div>
            <i class="fas fa-chevron-right text-gray-700 text-xs"></i>
        </button>
    </div>

    <script>
        // Load settings on startup
        window.onload = () => {
            const settings = JSON.parse(localStorage.getItem('appSettings')) || {};
            document.getElementById('biometricToggle').checked = settings.biometric || false;
            document.getElementById('twoFactorToggle').checked = settings['2fa'] || false;
            document.getElementById('notifyToggle').checked = settings.notify !== undefined ? settings.notify : true;
            document.getElementById('hideBalanceToggle').checked = settings.hideBalance || false;
        };

        // Save individual setting
        function saveSetting(key, value) {
            let settings = JSON.parse(localStorage.getItem('appSettings')) || {};
            settings[key] = value;
            localStorage.setItem('appSettings', JSON.stringify(settings));
        }

        // Wipe Local Storage
        function clearAllData() {
            if(confirm("Are you sure? This will delete your balance, profile, and saved accounts!")) {
                localStorage.clear();
                alert("Data cleared. Restarting...");
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
