<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin: Forex Manager | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #06070a; color: white; }
        .glass-panel { background: rgba(15, 18, 24, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-style { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 14px; border-radius: 12px; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-style:focus { border-color: #6366f1; background: rgba(99, 102, 241, 0.05); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-4xl mx-auto">
        <div class="mb-12">
            <h1 class="text-3xl font-black uppercase tracking-tight text-indigo-500">Forex Admin <span class="text-white">Panel</span></h1>
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-[0.3em]">Manage CPT Trade 4 Me Sessions</p>
        </div>

        <div class="glass-panel p-8 rounded-[40px] mb-12">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="text-[9px] font-black uppercase text-gray-500 ml-2 mb-2 block">Asset Pair</label>
                    <input type="text" id="asset" placeholder="e.g. XAU/USD" class="input-style font-bold">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-gray-500 ml-2 mb-2 block">Investment Amount (Price to Debit)</label>
                    <input type="text" id="planAmt" placeholder="e.g. 50000" class="input-style font-bold">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-gray-500 ml-2 mb-2 block">Expected Return</label>
                    <input type="text" id="returnAmt" placeholder="e.g. 75,000" class="input-style font-bold">
                </div>
                <div>
                    <label class="text-[9px] font-black uppercase text-gray-500 ml-2 mb-2 block">Guarantee %</label>
                    <input type="text" id="guarantee" placeholder="e.g. 99%" class="input-style font-bold">
                </div>
            </div>

            <button onclick="publishPlan()" id="publishBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-5 rounded-2xl font-black uppercase text-xs tracking-[0.3em] transition-all">
                Publish CPT Plan
            </button>
        </div>

        <h3 class="text-sm font-black uppercase tracking-widest text-gray-400 ml-2 mb-6">Active Plans</h3>
        <div id="active-list" class="space-y-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Publish Function
        window.publishPlan = async () => {
            const asset = document.getElementById('asset').value;
            const plan = document.getElementById('planAmt').value;
            const returns = document.getElementById('returnAmt').value;
            const guarantee = document.getElementById('guarantee').value;
            const btn = document.getElementById('publishBtn');

            if(!asset || !plan || !returns) return alert("Please fill all fields!");

            btn.disabled = true;
            btn.innerText = "PUBLISHING...";

            try {
                await addDoc(collection(db, "forex_plans"), {
                    asset, plan, returns, guarantee,
                    timestamp: serverTimestamp()
                });
                alert("Plan Published Live!");
                document.querySelectorAll('input').forEach(i => i.value = "");
            } catch (e) {
                console.error(e);
                alert("Error: check your Firebase Rules.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Publish CPT Plan";
            }
        };

        // Live Listener
        onSnapshot(query(collection(db, "forex_plans"), orderBy("timestamp", "desc")), (snapshot) => {
            const list = document.getElementById('active-list');
            list.innerHTML = "";
            snapshot.forEach((d) => {
                const data = d.data();
                const div = document.createElement('div');
                div.className = "glass-panel p-6 rounded-2xl flex justify-between items-center border-l-4 border-indigo-500";
                div.innerHTML = `
                    <div>
                        <p class="text-indigo-400 font-black text-sm uppercase">${data.asset}</p>
                        <p class="text-[10px] text-gray-500 font-bold uppercase">Debit: ${data.plan} | Return: ${data.returns}</p>
                    </div>
                    <button onclick="deletePlan('${d.id}')" class="text-red-500 hover:text-white bg-red-500/10 p-3 rounded-lg transition-all">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        });

        window.deletePlan = async (id) => {
            if(confirm("Remove this plan?")) await deleteDoc(doc(db, "forex_plans", id));
        };
    </script>
</body>
</html>
