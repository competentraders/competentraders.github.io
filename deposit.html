<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Opay Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; color: #1a1a1a; }
        .checkout-box { background: white; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .timer-progress { height: 100%; background: #00d38d; width: 100%; transition: width 1s linear; }
        .copy-btn { color: #0066ff; font-weight: 700; font-size: 0.75rem; border: 1px solid #eef2f6; padding: 4px 10px; border-radius: 6px; }
        .opay-green { color: #00d38d; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md checkout-box overflow-hidden">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-white">
            <div>
                <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Amount to Pay</p>
                <h2 class="text-2xl font-black text-gray-800" id="displayAmount">₦5,000.00</h2>
            </div>
            <div class="text-right flex flex-col items-end">
                <div class="flex items-center gap-1">
                    <div class="w-6 h-6 bg-[#00d38d] rounded-full flex items-center justify-center">
                        <i class="fas fa-bolt text-white text-[10px]"></i>
                    </div>
                    <span class="font-black text-xl tracking-tighter italic">OPay</span>
                </div>
                <span class="text-[9px] font-bold text-gray-300 uppercase">Gateway Payment</span>
            </div>
        </div>

        <div class="px-6 py-4 bg-gray-50 flex flex-col gap-2">
            <div class="flex justify-between items-center">
                <span class="text-[11px] font-bold text-gray-500 uppercase">Payment Window Expires in:</span>
                <span class="font-mono font-bold text-red-500" id="countdown">60:00</span>
            </div>
            <div class="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                <div id="progress" class="timer-progress"></div>
            </div>
        </div>

        <div class="p-8">
            <div class="space-y-6">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-semibold text-gray-400 uppercase">Bank</span>
                    <span class="font-bold text-gray-800 text-right">OPay / Digital Bank</span>
                </div>

                <div class="flex justify-between items-start">
                    <span class="text-xs font-semibold text-gray-400 uppercase">Account Number</span>
                    <div class="text-right">
                        <span class="block font-black text-2xl text-gray-900 tracking-tight" id="accNum">6119316029</span>
                        <button onclick="copyText('6119316029')" class="copy-btn mt-1 hover:bg-blue-50 transition">COPY NUMBER</button>
                    </div>
                </div>

                <div class="flex justify-between items-start">
                    <span class="text-xs font-semibold text-gray-400 uppercase">Beneficiary</span>
                    <span class="font-bold text-gray-800 text-right">Godswill Business Account</span>
                </div>

                <div class="bg-blue-50 p-4 rounded-xl flex justify-between items-center border border-blue-100">
                    <div>
                        <p class="text-[10px] text-blue-400 font-bold uppercase">Transaction Narration</p>
                        <p class="font-mono font-black text-blue-700" id="refCode">TRX-7821</p>
                    </div>
                    <button onclick="copyText(document.getElementById('refCode').innerText)" class="text-blue-600 text-xs font-bold underline">Copy</button>
                </div>
            </div>

            <div class="mt-8">
                <button onclick="confirmPayment(this)" class="w-full py-4 bg-[#1a1a1a] text-white rounded-xl font-bold text-sm shadow-xl hover:bg-black transition active:scale-95 flex items-center justify-center gap-3">
                    I HAVE SENT THE MONEY
                </button>
                <p class="text-center mt-4 text-[10px] text-gray-400 font-medium">
                    Please ensure you use the narration code above to avoid delays.
                </p>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-50 flex justify-center items-center gap-2">
            <i class="fas fa-shield-alt text-gray-300 text-xs"></i>
            <span class="text-[9px] text-gray-400 uppercase font-black tracking-widest">Secured by OPay Infrastructure</span>
        </div>
    </div>

    <script>
        // Set Amount
        const depositAmt = localStorage.getItem('lastDepositAmount') || "5,000";
        document.getElementById('displayAmount').innerText = "₦" + depositAmt;

        // Random Reference
        const ref = "CT" + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('refCode').innerText = ref;

        // Timer Logic
        let timeLeft = 3600; 
        const countdownElem = document.getElementById('countdown');
        const progressElem = document.getElementById('progress');

        const timer = setInterval(() => {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            countdownElem.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            let percentage = (timeLeft / 3600) * 100;
            progressElem.style.width = percentage + "%";
            if (timeLeft <= 0) { clearInterval(timer); window.location.href = "user-dashboard.html"; }
            timeLeft--;
        }, 1000);

        function copyText(text) {
            navigator.clipboard.writeText(text);
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "COPIED!";
            setTimeout(() => btn.innerText = originalText, 2000);
        }

        function confirmPayment(btn) {
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> VERIFYING...';
            btn.disabled = true;

            setTimeout(() => {
                alert("Thank you! Our finance team is verifying your transfer (" + ref + "). Your wallet will be updated within 5-10 minutes.");
                window.location.href = "user-dashboard.html";
            }, 3000);
        }
    </script>
</body>
</html>
