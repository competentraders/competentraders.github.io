<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Predictions | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #06070a; color: white; overflow-x: hidden; }
        
        .glass-panel { 
            background: rgba(15, 18, 24, 0.8); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .prediction-card {
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .prediction-card:hover { transform: translateY(-5px); border-color: #3b82f6; }

        /* Fixed blinking: removed extreme drop-shadows and added min-height */
        .team-logo { 
            width: 45px; height: 45px; 
            object-fit: contain; 
            margin: 0 auto 8px; 
            display: block;
        }

        #notif-toast {
            position: fixed; bottom: -100px; right: 20px;
            background: #3b82f6; color: white; padding: 16px 24px;
            border-radius: 20px; z-index: 9999; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #notif-toast.show { bottom: 20px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="notif-toast">
        <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">
            <i class="fas fa-bell"></i>
        </div>
        <div>
            <p class="text-[10px] font-black uppercase tracking-widest opacity-80">New Tip Added</p>
            <p id="notif-msg" class="text-xs font-bold">Check out the latest prediction!</p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto mb-10 flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
            <div class="inline-flex items-center gap-2 mb-2">
                <div class="w-8 h-8 bg-green-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-futbol text-white text-sm"></i>
                </div>
                <span class="text-xl font-black uppercase tracking-tighter">Competent<span class="text-blue-500">raders</span></span>
            </div>
            <h2 class="text-3xl font-black uppercase tracking-tight">Pro Predictions</h2>
            <p class="text-gray-500 text-xs font-bold uppercase tracking-[0.3em]">Live Algorithmic Betting Tips</p>
        </div>
        
        <div class="flex gap-4">
            <a href="user-dashboard.html" class="px-6 py-3 glass-panel rounded-xl text-[10px] font-black uppercase hover:bg-white/5 transition-all flex items-center gap-2">
                <i class="fas fa-home"></i> Dashboard
            </a>
        </div>
    </div>

    <div class="max-w-6xl mx-auto flex gap-3 overflow-x-auto pb-6 mb-4 no-scrollbar">
        <button class="px-6 py-3 bg-blue-600 rounded-full text-[10px] font-black uppercase whitespace-nowrap">Current Board</button>
    </div>

    <div id="predictions-container" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-20 opacity-20">
            <i class="fas fa-circle-notch fa-spin text-4xl mb-4"></i>
            <p class="text-xs font-black uppercase tracking-widest">Connecting to Server...</p>
        </div>
    </div>

    <p class="mt-20 text-center text-[10px] text-gray-700 uppercase tracking-[0.4em]">
        AI Analysis Engine v4.2 <br> Gamble Responsibly.
    </p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJkvNofiX0SjvqsIBaJj81y38yRVsjSFQ",
            authDomain: "competentraders-2efdc.firebaseapp.com",
            projectId: "competentraders-2efdc",
            storageBucket: "competentraders-2efdc.firebasestorage.app",
            messagingSenderId: "150379227882",
            appId: "1:150379227882:web:19d9c19805ef68b016c593"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById('predictions-container');
        let initialLoad = true;

        const q = query(collection(db, "predictions"), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            container.innerHTML = ""; 

            if (snapshot.empty) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 font-bold uppercase text-[10px] tracking-widest">No active games posted.</div>`;
                return;
            }

            if (!initialLoad && snapshot.docChanges().some(change => change.type === "added")) {
                showPushNotif("New prediction added!");
            }

            snapshot.forEach((doc) => {
                const game = doc.data();
                
                let statusHTML = `<span class="text-[10px] font-bold text-blue-500 uppercase bg-blue-500/10 px-3 py-1 rounded-full">Pending</span>`;
                if (game.status === 'won') {
                    statusHTML = `<span class="text-[10px] font-bold text-green-500 uppercase bg-green-500/20 px-3 py-1 rounded-full border border-green-500/30"><i class="fas fa-check-circle mr-1"></i> WON</span>`;
                } else if (game.status === 'lost') {
                    statusHTML = `<span class="text-[10px] font-bold text-red-500 uppercase bg-red-500/20 px-3 py-1 rounded-full border border-red-500/30"><i class="fas fa-times-circle mr-1"></i> LOST</span>`;
                }

                // Fixed the logo URL to ensure it loads directly
                const homeLogo = `https://api.sofascore.app/api/v1/team/${game.homeId}/image`;
                const awayLogo = `https://api.sofascore.app/api/v1/team/${game.awayId}/image`;

                const card = `
                <div class="prediction-card glass-panel rounded-[32px] p-6 ${game.status === 'won' ? 'border-green-500/20' : ''}">
                    <div class="flex justify-between items-start mb-6">
                        ${statusHTML}
                        <span class="text-[10px] text-gray-500 font-bold uppercase">${game.time || 'Today'}</span>
                    </div>
                    
                    <div class="flex items-center justify-between mb-8">
                        <div class="text-center w-5/12">
                            <img src="${homeLogo}" class="team-logo" loading="lazy" onerror="this.onerror=null;this.src='https://crests.football-data.org/soccer.png';">
                            <p class="text-[11px] font-black uppercase truncate">${game.homeName}</p>
                        </div>
                        <div class="text-[10px] font-black text-gray-700">VS</div>
                        <div class="text-center w-5/12">
                            <img src="${awayLogo}" class="team-logo" loading="lazy" onerror="this.onerror=null;this.src='https://crests.football-data.org/soccer.png';">
                            <p class="text-[11px] font-black uppercase truncate">${game.awayName}</p>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between p-3 bg-white/5 rounded-2xl border border-white/5">
                            <span class="text-[9px] text-gray-500 uppercase font-black">Prediction:</span>
                            <span class="text-[9px] ${game.status === 'won' ? 'text-green-500' : 'text-blue-500'} font-black uppercase">${game.mainPrediction}</span>
                        </div>
                    </div>
                </div>`;
                
                container.innerHTML += card;
            });

            initialLoad = false;
        });

        function showPushNotif(msg) {
            const toast = document.getElementById('notif-toast');
            document.getElementById('notif-msg').innerText = msg;
            toast.classList.add('show');
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.volume = 0.3;
            audio.play().catch(() => {});
            setTimeout(() => toast.classList.remove('show'), 5000);
        }
    </script>
</body>
</html>
