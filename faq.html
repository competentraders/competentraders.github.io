<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Terminal | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: #06070a; 
            color: white; 
            overflow-x: hidden;
        }

        /* Smooth Accordion Logic */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }

        .faq-item.active .accordion-content {
            max-height: 500px;
            opacity: 1;
            padding-bottom: 1.5rem;
        }

        .faq-item.active .chevron {
            transform: rotate(180deg);
            color: #06b6d4;
        }

        .faq-item.active {
            background: rgba(6, 182, 212, 0.03);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .glass-card {
            background: #0f1218;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Category Header Styling */
        .category-label {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            background: rgba(6, 182, 212, 0.1);
            color: #06b6d4;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body class="p-4 md:p-10 pb-32">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-16">
            <a href="user-dashboard.html" class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-gray-500 hover:text-white transition-all">
                <i class="fas fa-arrow-left text-[8px]"></i> Return to Dashboard
            </a>
            <div class="px-4 py-1 rounded-full border border-cyan-500/20 bg-cyan-500/5">
                <span class="text-[9px] font-black text-cyan-400 uppercase tracking-widest">Global Support v2.0</span>
            </div>
        </div>

        <div class="text-center mb-20">
            <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter mb-4">Support <span class="text-cyan-400">Hub</span></h1>
            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-[0.5em]">Comprehensive System Protocols</p>
        </div>

        <div id="faq-master-container" class="space-y-6">
            </div>

        <div class="mt-24 text-center glass-card p-12 rounded-[3.5rem] border-cyan-500/10">
            <h2 class="text-2xl font-black uppercase tracking-tighter mb-4">Still need <span class="text-cyan-400">Assistance?</span></h2>
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-10 text-center max-w-sm mx-auto">Our specialized agents are ready to resolve high-priority technical conflicts.</p>
            <a href="mailto:competentraders@gmail.com" class="inline-flex items-center gap-3 px-12 py-5 bg-cyan-500 text-black rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] shadow-2xl shadow-cyan-500/30 hover:scale-105 transition-all">
                <i class="fas fa-paper-plane"></i> Email Support
            </a>
        </div>
    </div>

    <script>
        const faqDatabase = [
            // ACCESS & CORE (1-5)
            { cat: "Access", q: "Is there a registration link sent to my email?", a: "No. Registration is instant. You are redirected straight to the dashboard to avoid ISP delays and filter issues." },
            { cat: "Security", q: "Can I use a VPN during registration or login?", a: "No. Using a VPN masks your location and can trigger our Anti-Fraud system, leading to an automatic security lock." },
            { cat: "Security", q: "What should I do if my account is suspended?", a: "Suspensions occur due to multiple account detection. Contact support with proof of identity for manual review." },
            { cat: "Security", q: "How do I recover my transaction PIN?", a: "Go to Profile Settings > Reset PIN. You must answer your secret security questions to authorize the reset." },
            { cat: "Security", q: "Can I stay logged in on multiple devices?", a: "No. For the safety of your funds, logging into a new device will automatically terminate previous sessions." },

            // REFERRAL (6-10)
            { cat: "Referral", q: "How do I earn referral bonuses?", a: "Share your unique link from the 'Affiliate' tab. Bonuses are credited once your referral completes their first investment cycle." },
            { cat: "Referral", q: "What is 'Sybil Activity'?", a: "Sybil activity is creating fake accounts under your own link. This results in a permanent ban of all linked accounts." },
            { cat: "Referral", q: "Where can I find my affiliate link?", a: "Your link is prominently displayed in the Referral/Affiliate section of your user dashboard." },
            { cat: "Referral", q: "Are referral earnings withdrawable?", a: "Yes, referral commissions are moved to your main balance and can be withdrawn or re-invested instantly." },
            { cat: "Referral", q: "Is there a limit to how many people I can refer?", a: "No. There is no cap on the number of partners you can bring into the Competentraders ecosystem." },

            // FOOTBALL PREDICTION (11-15)
            { cat: "Football", q: "What is Football Prediction?", a: "It is a data-driven analysis service providing high-probability sports outcomes for educational and entertainment purposes." },
            { cat: "Football", q: "How do I access daily predictions?", a: "Active members can find the latest analysis in the 'Sports' or 'Prediction' tab of the dashboard." },
            { cat: "Football", q: "Are the predictions 100% guaranteed?", a: "No sports prediction is guaranteed. We provide the highest mathematical probability, but users should follow strict bankroll management." },
            { cat: "Football", q: "Do you offer 'Fixed Matches'?", a: "No. We provide analytical predictions based on team form, injuries, and statistics. We do not engage in match-fixing." },
            { cat: "Football", q: "Which leagues are covered?", a: "We cover the Premier League, La Liga, Serie A, Bundesliga, and major International tournaments." },

            // INVESTMENT PLAN (16-20)
            { cat: "Investment", q: "What is an Investment Plan?", a: "It is a fixed-duration contract where your capital is deployed in various markets to generate a target return." },
            { cat: "Investment", q: "Can I run multiple plans at once?", a: "Yes, you can have several active cycles across different tiers (Starter, Pro, Elite) simultaneously." },
            { cat: "Investment", q: "What happens when a cycle matures?", a: "Your capital and profit are moved to your maturity balance, where you can choose to withdraw or re-invest." },
            { cat: "Investment", q: "Can I cancel an active plan?", a: "No. Once a cycle begins, the funds are locked in the market liquidity pool until the duration is complete." },
            { cat: "Investment", q: "How are profits calculated?", a: "Profits are based on the specific ROI percentage of your chosen plan and the total capital invested." },

            // FOREX TRADING (21-25)
            { cat: "Forex", q: "Do I need trading skills to earn?", a: "No. Our automated systems and pro-desk manage the trades. You simply provide the capital and collect the returns." },
            { cat: "Forex", q: "Which pairs do we trade?", a: "We specialize in high-liquidity pairs like EUR/USD and GBP/USD, alongside Gold (XAU/USD) and BTC/USD." },
            { cat: "Forex", q: "Is Forex trading risky?", a: "Yes, all trading carries risk. We use advanced stop-loss protocols to ensure your principal capital remains protected." },
            { cat: "Forex", q: "Can I see the trade history?", a: "Yes, high-tier accounts can view periodic trade reports in their dashboard under 'Market History'." },
            { cat: "Forex", q: "How does the AI assist in trading?", a: "Our AI monitors 24/7 for specific price action patterns, executing trades faster than manual human capacity." },

            // VIP (26-28)
            { cat: "VIP", q: "How do I become a VIP member?", a: "VIP status is unlocked by reaching a specific total investment volume or through a direct invite from the administration." },
            { cat: "VIP", q: "What are the VIP perks?", a: "VIPs enjoy priority withdrawals, 0% maintenance fees, and access to exclusive 'Flash Cycles' with higher ROI." },
            { cat: "VIP", q: "Is there a VIP support line?", a: "Yes, VIP members have access to a dedicated account manager for 24/7 personalized assistance." },

            // UNIVERSITY (29-31)
            { cat: "University", q: "What is Competentraders University?", a: "It is our educational platform where you can learn about financial literacy, technical analysis, and wealth management." },
            { cat: "University", q: "How do I enroll in courses?", a: "Courses are available via the 'University' tab. Some are free, while others require an active investment plan to unlock." },
            { cat: "University", q: "Do I get a certificate?", a: "Yes, upon completion of our Masterclasses, digital certificates are issued to verify your financial literacy training." },

            // OUR GOALS (32-34)
            { cat: "Our Goals", q: "What is your main mission?", a: "To empower individuals with secure, simplified access to global wealth-building tools, fulfilling the 'Lifting Lives' vision." },
            { cat: "Our Goals", q: "Is Competentraders a local or global brand?", a: "We are a global entity with users spanning multiple continents, focusing on decentralized financial growth." },
            { cat: "Our Goals", q: "Do you have physical offices?", a: "We are a digital-first organization. This allows us to maintain low overhead and provide higher returns to our users." },

            // CONNECT WITH US (35-37)
            { cat: "Connect", q: "How do I contact support?", a: "Use the 'Email Support' button below or join our official Telegram community for real-time updates." },
            { cat: "Connect", q: "Where are your social media handles?", a: "Verified links to our WhatsApp, Telegram, and Twitter are found in the footer of your user dashboard." },
            { cat: "Connect", q: "Can I join the leadership team?", a: "We periodically open applications for Regional Representatives. Check the announcements for recruitment phases." },

            // TERMS & PRIVACY (38-42)
            { cat: "Legal", q: "Where are the Terms & Conditions?", a: "The full legal framework is available via the 'Terms' link. It outlines the rules of the ecosystem." },
            { cat: "Legal", q: "How is my data protected?", a: "We use high-level encryption and do not share user data with third-party marketers. Your privacy is our priority." },
            { cat: "Legal", q: "What is your refund policy?", a: "Due to the nature of market trading, capital currently in an active cycle cannot be refunded until the cycle is complete." },
            { cat: "Legal", q: "Can I close my account?", a: "Yes. You can request account deletion in settings. All personal data will be purged in 30 days." },
            { cat: "Legal", q: "Is Competentraders regulated?", a: "We operate as a private digital asset management firm. We comply with standard AML and KYC security protocols." }
        ];

        const container = document.getElementById('faq-master-container');

        function initFAQs() {
            container.innerHTML = faqDatabase.map((item, index) => `
                <div class="faq-item glass-card rounded-3xl transition-all cursor-pointer overflow-hidden border border-white/5" onclick="toggleItem(this)">
                    <div class="p-6 md:p-8 flex justify-between items-center gap-6">
                        <div class="flex flex-col gap-1">
                            <span class="category-label">${item.cat}</span>
                            <h3 class="text-[13px] md:text-sm font-black uppercase tracking-tight text-gray-200">${item.q}</h3>
                        </div>
                        <i class="fas fa-plus chevron text-[10px] text-gray-600 transition-transform"></i>
                    </div>
                    <div class="accordion-content px-6 md:px-8">
                        <div class="border-t border-white/5 pt-6 text-[13px] text-gray-500 leading-relaxed text-justify">
                            ${item.a}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleItem(element) {
            const isActive = element.classList.contains('active');
            
            // Close all items
            document.querySelectorAll('.faq-item').forEach(item => {
                item.classList.remove('active');
                item.querySelector('.chevron').className = 'fas fa-plus chevron text-[10px] text-gray-600 transition-transform';
            });

            // If it wasn't active, open it
            if (!isActive) {
                element.classList.add('active');
                element.querySelector('.chevron').className = 'fas fa-minus chevron text-[10px] text-cyan-400 transition-transform';
            }
        }

        initFAQs();
    </script>
</body>
</html>
