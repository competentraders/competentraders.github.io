<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Terminal | Competentraders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background: #06070a; 
            color: white; 
            overflow-x: hidden;
        }

        /* Smooth Accordion Logic */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }

        .faq-item.active .accordion-content {
            max-height: 500px;
            opacity: 1;
            padding-bottom: 1.5rem;
        }

        .faq-item.active .chevron {
            transform: rotate(180deg);
            color: #06b6d4;
        }

        .faq-item.active {
            background: rgba(6, 182, 212, 0.03);
            border-color: rgba(6, 182, 212, 0.3);
        }

        .glass-card {
            background: #0f1218;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="p-4 md:p-10 pb-32">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-16">
            <a href="user-dashboard.html" class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-gray-500 hover:text-white transition-all">
                <i class="fas fa-arrow-left text-[8px]"></i> Return to Dashboard
            </a>
            <div class="px-4 py-1 rounded-full border border-cyan-500/20 bg-cyan-500/5">
                <span class="text-[9px] font-black text-cyan-400 uppercase tracking-widest">Knowledge Base v1.0</span>
            </div>
        </div>

        <div class="text-center mb-20">
            <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter mb-4">CPT Support <span class="text-cyan-400">FAQ</span></h1>
            <p class="text-[10px] font-bold text-gray-600 uppercase tracking-[0.5em]"></p>
        </div>

        <div id="faq-master-container" class="space-y-6">
            </div>

        <div class="mt-24 text-center glass-card p-12 rounded-[3.5rem] border-cyan-500/10">
            <h2 class="text-2xl font-black uppercase tracking-tighter mb-4">Still need <span class="text-cyan-400">Assistance?</span></h2>
            <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-10 text-center max-w-sm mx-auto">Our specialized agents are ready to resolve high-priority technical conflicts.</p>
            <a href="mailto:competentraders@gmail.com" class="inline-flex items-center gap-3 px-12 py-5 bg-cyan-500 text-black rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] shadow-2xl shadow-cyan-500/30 hover:scale-105 transition-all">
                <i class="fas fa-paper-plane"></i> Email Support Terminal
            </a>
        </div>
    </div>

    <script>
        const faqDatabase = [
            // CATEGORY: REGISTRATION & LOGIN (1-5)
            { q: "Is there a registration link sent to my email?", a: "No. Registration is instant. You are redirected straight to the dashboard. We do not send activation links to avoid ISP delays and filter issues." },
            { q: "Can I use a VPN during registration or login?", a: "No. Using a VPN masks your location and can trigger our Anti-Fraud system, leading to an automatic security lock on your account." },
            { q: "What should I do if the login page says 'Account Suspended'?", a: "Suspensions occur if the system detects multiple accounts on one device. Contact support to prove your identity and request a manual review." },
            { q: "I forgot my transaction PIN. How do I recover it?", a: "Go to your Profile Settings and select 'Reset PIN'. You will need to answer your security questions to set a new 4-digit code." },
            { q: "Can I stay logged in on multiple devices?", a: "No. For security, logging into a new device will automatically log you out of any previous active sessions." },

            // CATEGORY: DEPOSITS & FUNDING (6-10)
            { q: "How do I fund my account via Opay?", a: "Copy the corporate account number from the Deposit page. After payment, upload the clear transaction receipt to your dashboard for instant verification." },
            { q: "Why is my deposit still pending after 30 minutes?", a: "This usually happens if the uploaded receipt is blurry or the transaction reference is missing. Ensure you upload high-quality screenshots for the AI to read." },
            { q: "What is the minimum deposit amount?", a: "The minimum threshold is currently N1000 Naira. This ensures every account has enough liquidity to enter a trading cycle." },
            { q: "Can I use someone else's bank account to deposit?", a: "Yes, as long as you provide the correct transaction proof, funds can be sent from any account to your unique dashboard wallet." },
            { q: "Are there fees for funding my account?", a: "Competentraders charges 0% on all incoming deposits. You only pay the standard transfer fees charged by your bank or Opay." },

            // CATEGORY: WITHDRAWALS & PROFITS (11-15)
            { q: "When can I withdraw my profit?", a: "Profit is available for withdrawal once your active trading cycle reaches 'Maturity'. You can see the countdown timer on your Investment page." },
            { q: "Why does my withdrawal status say 'Audit'?", a: "All withdrawals go through a brief security audit to ensure funds are not being sent to fraudulent accounts. This usually takes 6-24 hours." },
            { q: "Is there a maximum withdrawal limit?", a: "Standard accounts are limited to $2,000 daily. To increase this, you must complete full KYC verification and upgrade your account tier." },
            { q: "What happens if I enter the wrong bank details?", a: "If the transfer has not been processed, contact support immediately. If already processed, the funds cannot be retrieved as bank transfers are final." },
            { q: "Is there a fee for withdrawing funds?", a: "Yes, we apply a 2% maintenance fee to all withdrawals to cover network gateway costs and platform sustainability." },

            // CATEGORY: REFERRALS & TECH (16-20)
            { q: "How do I earn referral bonuses?", a: "Share your unique link. When your referral completes their first investment cycle, a bonus is instantly credited to your referral wallet." },
            { q: "What is 'Sybil Activity' and why is it banned?", a: "Sybil activity is creating fake accounts under your own link. This is theft of referral funds and results in a permanent ban of all linked accounts." },
            { q: "How do I compound my profits?", a: "Instead of withdrawing, select 'Re-invest' at the end of your cycle to add your profits back into the principal for higher future returns." },
            { q: "The dashboard is not loading correctly. What do I do?", a: "Clear your browser cache and refresh. Ensure you are using a modern browser like Chrome or Safari. Avoid using rooted or jailbroken devices." },
            { q: "Who owns Competentraders Global?", a: "The platform is founded and managed by Ugbesia Godswill, focused on the mission of 'Lifting Lives' through secure digital asset management." }
        ];





        // CATEGORY: FOOTBALL PREDICTION (26-28)
        { q: "What is the Football Prediction service?", a: "We provide high-probability sports analysis. Note that these are predictions based on data, and users should manage their risk accordingly." },
        { q: "How often are predictions posted?", a: "Daily analysis is provided during active league seasons, focusing on top European and International fixtures." },

        // CATEGORY: INVESTMENT PLANS (29-31)
        { q: "What are the different investment plans?", a: "We offer tiers ranging from 'Starter' to 'Elite'. Each has different minimum entry requirements, cycle durations, and profit margins." },
        { q: "Can I run two investment plans at once?", a: "Yes. You can have multiple active cycles running simultaneously on different plans to diversify your earnings." },

        // CATEGORY: FOREX TRADING (32-34)
        { q: "Do I need to trade Forex myself?", a: "No. Our systems and expert traders manage the trades. You simply select a plan, and the system handles the technical execution." },
        { q: "Which currency pairs are traded?", a: "Our desk focuses on major pairs like EUR/USD, GBP/USD, and XAU/USD (Gold) due to their high liquidity." },

        // CATEGORY: VIP MEMBERSHIP (35-37)
        { q: "How do I join the VIP circle?", a: "VIP status is attained by maintaining a specific capital threshold or through a direct invitation based on your platform activity." },
        { q: "What are the benefits of VIP?", a: "VIP members enjoy 0% withdrawal fees, a dedicated account manager, and early access to high-yield investment cycles." },

        // CATEGORY: COMPETENTRADERS UNIVERSITY (38-40)
        { q: "What is Competentraders University?", a: "An educational wing designed to teach users the fundamentals of financial markets, technical analysis, and digital asset security." },
        { q: "Are the courses free?", a: "Basic modules are free for all registered users. Advanced certification courses are reserved for active investors." },

        // CATEGORY: OUR GOALS (41-43)
        { q: "What is the mission of Competentraders Global?", a: "Our mission is to bridge the wealth gap by providing simplified, secure access to global financial markets for everyone." },
        { q: "Where do you see the platform in 5 years?", a: "We aim to be the leading decentralized finance hub in Africa, empowering over 1 million users with financial literacy." },

        // CATEGORY: CONNECT WITH US (44-46)
        { q: "How do I join the official community?", a: "Follow our verified Telegram and WhatsApp channels. Links are provided in the 'Community' section of your dashboard." },
        { q: "Is there an office I can visit?", a: "We operate as a digital-first global entity. Support is provided through our online terminal to ensure 24/7 availability for users worldwide." },

        // CATEGORY: TERMS & PRIVACY (47-50)
        { q: "Where can I read the full Terms and Conditions?", a: "A link is provided at the footer of the dashboard. It covers our legal framework, user obligations, and platform liabilities." },
        { q: "Is my data safe from hackers?", a: "We use AES-256 encryption. Your personal data is never shared with third-party marketing firms; it is strictly used for account security." },
        { q: "How do I report a privacy breach?", a: "If you suspect your data has been compromised, immediately use the 'Security Alert' button or email our Data Protection Officer." }
    ];







        const container = document.getElementById('faq-master-container');

        function initFAQs() {
            container.innerHTML = faqDatabase.map((item, index) => `
                <div class="faq-item glass-card rounded-3xl transition-all cursor-pointer overflow-hidden border border-white/5" onclick="toggleItem(this)">
                    <div class="p-6 md:p-8 flex justify-between items-center gap-6">
                        <div class="flex gap-4 items-center">
                            <span class="text-[9px] font-black text-cyan-500/50 uppercase tracking-widest">${(index + 1).toString().padStart(2, '0')}</span>
                            <h3 class="text-[13px] md:text-sm font-black uppercase tracking-tight text-gray-200">${item.q}</h3>
                        </div>
                        <i class="fas fa-plus chevron text-[10px] text-gray-600 transition-transform"></i>
                    </div>
                    <div class="accordion-content px-6 md:px-8">
                        <div class="border-t border-white/5 pt-6 text-[13px] text-gray-500 leading-relaxed text-justify">
                            ${item.a}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleItem(element) {
            const isActive = element.classList.contains('active');
            
            // Close all items
            document.querySelectorAll('.faq-item').forEach(item => {
                item.classList.remove('active');
                item.querySelector('.chevron').className = 'fas fa-plus chevron text-[10px] text-gray-600 transition-transform';
            });

            // If it wasn't active, open it
            if (!isActive) {
                element.classList.add('active');
                element.querySelector('.chevron').className = 'fas fa-minus chevron text-[10px] text-cyan-400 transition-transform';
            }
        }

        initFAQs();
    </script>
</body>
</html>
